<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05010f">
<title>NEON DRIFT — Cyber Chronicles 2.0</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#05010f;
  color:#0ff;
  font-family:-apple-system,BlinkMacSystemFont,"Courier New",monospace;
  touch-action:none;
}

canvas{display:block}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

#topbar{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

#speedo,#info{
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#speedo{
  padding:8px 14px;
  border:1px solid #0ff;
  border-radius:10px;
  background:rgba(0,10,30,.58);
  box-shadow:0 0 20px rgba(0,255,255,.4);
  font-size:10px;
  letter-spacing:2px;
}

#speedo b{
  font-size:26px;
  color:#f0f;
  text-shadow:0 0 12px #f0f;
}

#info{
  padding:8px 12px;
  border:1px solid #f0f;
  border-radius:10px;
  background:rgba(30,0,30,.58);
  box-shadow:0 0 20px rgba(255,0,255,.4);
  font-size:10px;
  text-align:right;
  letter-spacing:1px;
  line-height:1.5;
}

#info b{
  color:#0ff;
  font-size:13px;
}

#styleName{
  color:#ff0;
  font-size:11px;
  letter-spacing:2px;
}

#mapWrap{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 70px);
  right:10px;
  width:110px;
  height:110px;
  border:1px solid #0ff;
  border-radius:50%;
  overflow:hidden;
  background:rgba(0,10,30,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(0,255,255,.4);
}

#mapCanvas{
  width:100%;
  height:100%;
}

#nitroLabel{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 142px);
  color:#ff0;
  font-size:9px;
  letter-spacing:3px;
  text-shadow:0 0 8px #ff0;
}

#nitroBar{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 130px);
  width:180px;
  height:8px;
  border:1px solid #ff0;
  border-radius:4px;
  background:rgba(0,0,0,.65);
  overflow:hidden;
  box-shadow:0 0 12px rgba(255,255,0,.5);
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff0,#f80);
  box-shadow:0 0 10px #ff0;
}

.pad,.pad-sm{
  position:absolute;
  pointer-events:auto;
  touch-action:none;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pad{
  border-radius:50%;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,255,.25),
    rgba(0,255,255,.08)
  );
  border:2px solid #0ff;
  color:#0ff;
  font-size:24px;
  font-weight:900;
  box-shadow:
    0 0 20px rgba(0,255,255,.6),
    inset 0 0 20px rgba(0,255,255,.15);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.pad.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,255,.7),
    rgba(0,255,255,.3)
  );
  box-shadow:
    0 0 30px #0ff,
    inset 0 0 30px rgba(0,255,255,.5);
  transform:scale(.94);
}

#btnLeft{
  left:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
}

#btnRight{
  left:98px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
}

#btnGas{
  right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:82px;
  height:82px;
  border-color:#0f0;
  color:#0f0;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,0,.25),
    rgba(0,255,0,.08)
  );
  box-shadow:
    0 0 20px rgba(0,255,0,.6),
    inset 0 0 20px rgba(0,255,0,.15);
}

#btnGas.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,0,.8),
    rgba(0,255,0,.4)
  );
  box-shadow:
    0 0 30px #0f0,
    inset 0 0 30px rgba(0,255,0,.5);
}

#btnBrake{
  right:106px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
  border-color:#f00;
  color:#f00;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(255,0,0,.25),
    rgba(255,0,0,.08)
  );
  box-shadow:
    0 0 20px rgba(255,0,0,.6),
    inset 0 0 20px rgba(255,0,0,.15);
}

#btnBrake.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(255,0,0,.8),
    rgba(255,0,0,.4)
  );
  box-shadow:
    0 0 30px #f00,
    inset 0 0 30px rgba(255,0,0,.5);
}

.pad-sm{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  border:2px solid #f0f;
  color:#f0f;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 0 14px rgba(255,0,255,.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.pad-sm.on{
  background:rgba(255,0,255,.5);
  box-shadow:0 0 20px #f0f;
  transform:scale(.92);
}

.pad-sm.yellow{
  border-color:#ff0;
  color:#ff0;
  box-shadow:0 0 14px rgba(255,255,0,.5);
}

.pad-sm.yellow.on{
  background:rgba(255,255,0,.4);
  box-shadow:0 0 20px #ff0;
}

.pad-sm.blue{
  border-color:#0af;
  color:#0af;
  box-shadow:0 0 14px rgba(0,170,255,.5);
}

.pad-sm.blue.on{
  background:rgba(0,170,255,.4);
  box-shadow:0 0 20px #0af;
}

.pad-sm.green{
  border-color:#0fa;
  color:#0fa;
  box-shadow:0 0 14px rgba(0,255,170,.5);
}

.pad-sm.green.on{
  background:rgba(0,255,170,.4);
  box-shadow:0 0 20px #0fa;
}

#btnStyle{
  right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnHorn{
  left:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnJump{
  right:78px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnNitro{
  right:136px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnCam{
  left:78px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#toast{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:22px;
  letter-spacing:6px;
  color:#ff0;
  text-shadow:0 0 20px #ff0;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  font-weight:900;
}

#splash{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  background:radial-gradient(
    circle at 50% 50%,
    #1a0033,
    #05010f 70%
  );
  transition:opacity .5s;
}

#splash h1{
  font-size:36px;
  letter-spacing:6px;
  color:#f0f;
  text-shadow:
    0 0 30px #f0f,
    0 0 60px #f0f;
  margin-bottom:10px;
}

#splash h2{
  font-size:14px;
  letter-spacing:4px;
  color:#0ff;
  text-shadow:0 0 12px #0ff;
  margin-bottom:30px;
}

#splash p{
  font-size:11px;
  line-height:1.9;
  color:#8ff;
  margin-bottom:30px;
  max-width:330px;
  letter-spacing:1px;
}

#startBtn{
  pointer-events:auto;
  touch-action:manipulation;
  padding:16px 40px;
  border:2px solid #0ff;
  border-radius:12px;
  background:rgba(0,255,255,.1);
  color:#0ff;
  font-size:14px;
  letter-spacing:4px;
  font-weight:900;
  box-shadow:0 0 30px #0ff;
}

#loading{
  font-size:11px;
  color:#f0f;
  letter-spacing:2px;
  margin-top:20px;
  opacity:.7;
}
</style>
</head>

<body>

<div id="splash">
  <h1>NEON DRIFT</h1>
  <h2>CYBER CHRONICLES 2.0</h2>

  <p>
    ЛЕВО / ПРАВО — руль<br>
    ▲ — газ<br>

<div id="hud">

  <div id="topbar">

  <div class="pad-sm green" id="btnJump">JUMP</div>
  <div class="pad-sm yellow" id="btnNitro">N2O</div>

</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   СЦЕНА
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05010f);

scene.fog = new THREE.FogExp2(
  0x0a0320,
  0.024
);

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.2)
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.25;

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

document.body.appendChild(
  renderer.domElement
);

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.1,
    2000
  );


/* =========================================================
   СВЕТ
========================================================= */

scene.add(
  new THREE.AmbientLight(
    0x223355,
    0.75
  )
);

const keyLight =
  new THREE.DirectionalLight(
    0xff44ff,
    0.5
  );

keyLight.position.set(
  0,
  100,
  50
);

scene.add(keyLight);

const rimLight =
  new THREE.DirectionalLight(
    0x00ffff,
    0.6
  );

rimLight.position.set(
  -80,
  60,
  -100
);

scene.add(rimLight);

scene.add(
  new THREE.HemisphereLight(
    0x0066ff,
    0xff00aa,
    0.35
  )
);


/* =========================================================
   ГОРОД
========================================================= */

const cityGroup =
  new THREE.Group();

scene.add(cityGroup);

const collidables = [];

const blockSize = 42;
const citySize = 10;

const NEON_COLORS = [
  0x00ffff,
  0xff00ff,
  0xff0066,
  0x00ffaa,
  0xffff00,
  0x00aaff,
  0xff6600,
  0xff2266
];

const BILLBOARD_TEXTS = [

  {
    text:"未来",
    sub:"FUTURE",
    color:0xff00ff
  },

  {
    text:"東京",
    sub:"TOKYO",
    color:0x00ffff
  },

  {
    text:"電気",
    sub:"ELECTRIC",
    color:0xffff00
  },

  {
    text:"ZONE A",
    sub:"LEVEL 07",
    color:0xff0066
  },

  {
    text:"SYSTEM",
    sub:"07",
    color:0x00ffaa
  },

  {
    text:"CORE UNIT",
    sub:"ACTIVE",
    color:0xff00ff
  },

  {
    text:"INNOVATE",
    sub:"ADAPT",
    color:0x00ffff
  },

  {
    text:"NO LIMITS",
    sub:"ONLY POSSIBLE",
    color:0xff2266
  },

  {
    text:"サイバー",
    sub:"CYBER",
    color:0x00aaff
  },

  {
    text:"X-89",
    sub:"FUTURE",
    color:0xff6600
  }

];

const billboardCache =
  Object.create(null);


/* =========================================================
   БИЛБОРДЫ
========================================================= */

function makeBillboardTexture(
  mainText,
  subText,
  colorHex
){

  const canvas =
    document.createElement("canvas");

  canvas.width = 512;
  canvas.height = 256;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle = "#05010f";
  ctx.fillRect(
    0,
    0,
    512,
    256
  );

  const color =
    "#" +
    colorHex
      .toString(16)
      .padStart(6,"0");

  ctx.strokeStyle = color;
  ctx.lineWidth = 8;

  ctx.strokeRect(
    4,
    4,
    504,
    248
  );

  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;

  ctx.font =
    "bold 90px Arial,sans-serif";

  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText(
    mainText,
    256,
    110
  );

  ctx.shadowBlur = 10;

  ctx.font =
    "bold 40px Arial,sans-serif";

  ctx.fillText(
    subText,
    256,
    190
  );

  ctx.shadowBlur = 0;

  ctx.fillStyle = color;

  for(let i=0;i<30;i++){

    ctx.fillRect(
      Math.random()*512,
      Math.random()*256,
      3,
      1
    );

  }

  const tex =
    new THREE.CanvasTexture(canvas);

  tex.colorSpace =
    THREE.SRGBColorSpace;

  return tex;
}


function getBillboardTex(index){

  if(!billboardCache[index]){

    const data =
      BILLBOARD_TEXTS[
        index %
        BILLBOARD_TEXTS.length
      ];

    billboardCache[index] =
      makeBillboardTexture(
        data.text,
        data.sub,
        data.color
      );
  }

  return billboardCache[index];
}


/* =========================================================
   НЕБОСКРЁБ
========================================================= */

function makeSkyscraper(
  x,
  z,
  forceHeight
){

  const isLandmark =
    Math.random() < 0.15;

  const h =
    forceHeight ||
    (
      isLandmark
      ?
      180 + Math.random()*120
      :
      50 + Math.random()*150
    );

  const w =
    12 + Math.random()*14;

  const d =
    12 + Math.random()*14;


  const bodyMat =
    new THREE.MeshStandardMaterial({

      color:0x08081a,

      metalness:0.85,

      roughness:0.35,

      emissive:
        Math.random() > 0.5
        ?
        0x001a2a
        :
        0x20001c,

      emissiveIntensity:0.4

    });


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        w,
        h,
        d
      ),
      bodyMat
    );

  body.position.set(
    x,
    h/2,
    z
  );

  cityGroup.add(body);


  collidables.push({

    x:x,
    z:z,

    w:w/2 + 2.5,
    d:d/2 + 2.5

  });


  /* ОКНА */

  const color =
    NEON_COLORS[
      Math.floor(
        Math.random() *
        NEON_COLORS.length
      )
    ];

  const winMat =
    new THREE.MeshBasicMaterial({

      color:color,

      transparent:true,

      opacity:0.85

    });

  const winGeo =
    new THREE.PlaneGeometry(
      0.7,
      0.7
    );

  const cols =
    Math.floor(w/1.6);

  const rows =
    Math.floor(h/3);

  const maxRows =
    Math.min(rows,42);


  for(
    let r=0;
    r<maxRows;
    r++
  ){

    for(
      let c=0;
      c<cols;
      c++
    ){

      if(Math.random()>0.55)
        continue;

      const wx =
        -w/2 +
        1 +
        c*(w-2) /
        Math.max(cols,1);

      const wy =
        4 +
        r*2.8;


      const win1 =
        new THREE.Mesh(
          winGeo,
          winMat
        );

      win1.position.set(
        x+wx,
        wy,
        z+d/2+0.06
      );

      cityGroup.add(win1);


      const win2 =
        new THREE.Mesh(
          winGeo,
          winMat
        );

      win2.position.set(
        x+w/2+0.06,
        wy,
        z+wx
      );

      win2.rotation.y =
        Math.PI/2;

      cityGroup.add(win2);

    }

  }


  /* БИЛБОРДЫ */

  const billboardCount =
    isLandmark
    ?
    3
    :
    (
      Math.random()<0.7
      ?
      1
      :
      0
    );


  for(
    let b=0;
    b<billboardCount;
    b++
  ){

    const texIndex =
      Math.floor(
        Math.random() *
        BILLBOARD_TEXTS.length
      );

    const tex =
      getBillboardTex(
        texIndex
      );


    const billW =
      w*0.85;

    const billH =
      billW*0.5;


    const bill =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          billW,
          billH
        ),

        new THREE.MeshBasicMaterial({
          map:tex,
          side:THREE.DoubleSide
        })

      );


    const billY =
      15 +
      Math.random() *
      Math.max(
        1,
        h-30
      );


    const side =
      Math.floor(
        Math.random()*4
      );


    if(side===0){

      bill.position.set(
        x,
        billY,
        z+d/2+0.15
      );

    }
    else if(side===1){

      bill.position.set(
        x,
        billY,
        z-d/2-0.15
      );

      bill.rotation.y =
        Math.PI;

    }
    else if(side===2){

      bill.position.set(
        x+w/2+0.15,
        billY,
        z
      );

      bill.rotation.y =
        Math.PI/2;

    }
    else{

      bill.position.set(
        x-w/2-0.15,
        billY,
        z
      );

      bill.rotation.y =
        -Math.PI/2;

    }


    cityGroup.add(bill);


    /* Только часть билбордов получает свет */

    if(Math.random()<0.25){

      const glow =
        new THREE.PointLight(
          BILLBOARD_TEXTS[
            texIndex
          ].color,
          2.5,
          18,
          2
        );

      glow.position.copy(
        bill.position
      );

      cityGroup.add(glow);

    }

  }


  /* ВЕРТИКАЛЬНАЯ РЕКЛАМА */

  if(Math.random()<0.4){

    const tex =
      getBillboardTex(
        Math.floor(
          Math.random() *
          BILLBOARD_TEXTS.length
        )
      );

    const vert =
      new THREE.Mesh(

        new THREE.PlaneGeometry(
          3,
          12
        ),

        new THREE.MeshBasicMaterial({
          map:tex
        })

      );

    vert.position.set(

      x+w/2+0.2,

      15 +
      Math.random()*40,

      z+d/2+0.2

    );

    vert.rotation.y =
      Math.PI/4;

    cityGroup.add(vert);

  }


  /* МАЯК */

  const beacon =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        0.9,
        8,
        8
      ),

      new THREE.MeshBasicMaterial({
        color:color
      })

    );

  beacon.position.set(
    x,
    h+4,
    z
  );

  cityGroup.add(beacon);


  if(Math.random()<0.06){

    const light =
      new THREE.PointLight(
        color,
        4,
        32,
        2
      );

    light.position.set(
      x,
      h+4,
      z
    );

    cityGroup.add(light);

  }

}


/* СОЗДАНИЕ ГОРОДА */

for(
  let i=-citySize;

function updateFlyingCars(dt){

  const t =
    performance.now()*0.001;


  for(
    let i=0;
    i<flyingCars.length;
    i++
  ){

    const c =
      flyingCars[i];


    c.userData.heading +=
      Math.sin(t+i)*
      0.15*
      dt;


    c.position.x +=
      Math.sin(
        c.userData.heading
      ) *
      c.userData.speed *
      dt;


    c.position.z +=
      Math.cos(
        c.userData.heading
      ) *
      c.userData.speed *
      dt;


    c.position.y =
      c.userData.baseY +
      Math.sin(
        t*2+i
      )*1.5;


    c.rotation.y =
      c.userData.heading;

    c.rotation.z =
      Math.sin(t+i)*0.08;


    const bound = 700;


    if(
      Math.abs(c.position.x)>bound
    ){

      c.position.x =
        -Math.sign(
          c.position.x
        )*bound;

      c.userData.heading =
        Math.random()*Math.PI*2;

    }


    if(
      Math.abs(c.position.z)>bound
    ){

      c.position.z =
        -Math.sign(
          c.position.z
        )*bound;

      c.userData.heading =
        Math.random()*Math.PI*2;

    }

  }

}

/* =========================================================
   БЕЗОПАСНАЯ ОЧИСТКА
========================================================= */

function disposeObjectTree(obj){

  if(obj.children){

    for(
      const child of [...obj.children]
    ){

      obj.remove(child);

      disposeObjectTree(child);

    }

  }


  if(obj.geometry){

    obj.geometry.dispose();

  }


  if(obj.material){

    const materials =
      Array.isArray(obj.material)
      ?
      obj.material
      :
      [obj.material];


    for(
      const material of materials
    ){

      if(
        material.map &&
        material.map.userData &&
        material.map.userData.disposeWithCar
      ){

        material.map.dispose();

      }

      material.dispose();

    }

  }

}


function clearGroup(group){

  while(
    group.children.length
  ){

    const obj =
      group.children[
        group.children.length-1
      ];

    group.remove(obj);

    disposeObjectTree(obj);

  }

}

function bindHold(
  id,
  property
){

  const el =
    document.getElementById(id);


  const release =
    e=>{

      activePointers.delete(
        e.pointerId
      );

      input[property] =
        false;

      el.classList.remove(
        "on"
      );

    };


  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      el.setPointerCapture?.(
        e.pointerId
      );

      activePointers.set(
        e.pointerId,
        id
      );

      input[property]=true;

      el.classList.add("on");

    },
    {
      passive:false
    }
  );


  el.addEventListener(
    "pointerup",
    release,
    {
      passive:false
    }
  );

  el.addEventListener(
    "pointercancel",
    release,
    {
      passive:false
    }
  );

  el.addEventListener(
    "lostpointercapture",
    release,
    {
      passive:false
    }
  );

}

let audioCtx = null;


function initAudio(){

  if(!audioCtx){

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if(
    audioCtx.state ===
    "suspended"
  ){

    audioCtx.resume();

  }

}


function playHorn(){

  initAudio();


  const o1 =
    audioCtx.createOscillator();

  const o2 =
    audioCtx.createOscillator();

  const gain =
    audioCtx.createGain();


  o1.type =
    "sawtooth";

  o2.type =
    "sawtooth";


  o1.frequency.value =
    220;

  o2.frequency.value =
    277;


  gain.gain.value =
    0.0001;


  o1.connect(gain);
  o2.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  o1.start();
  o2.start();


  const now =
    audioCtx.currentTime;


  gain.gain
    .exponentialRampToValueAtTime(
      0.12,
      now+0.03
    );


  gain.gain
    .exponentialRampToValueAtTime(
      0.0001,
      now+0.5
    );


  o1.stop(
    now+0.55
  );

  o2.stop(
    now+0.55
  );

}

function resolveBuildingCollisions(){

  if(
    carState.airborne
  )
    return;


  for(
    const c of collidables
  ){

    const dx =
      car.position.x-c.x;

    const dz =
      car.position.z-c.z;


    const overlapX =
      c.w-Math.abs(dx);

    const overlapZ =
      c.d-Math.abs(dz);


    if(
      overlapX>0 &&
      overlapZ>0
    ){

      if(
        overlapX<overlapZ
      ){

        const dir =
          dx===0
          ?
          1
          :
          Math.sign(dx);


        car.position.x +=
          dir*overlapX;

        carState.heading +=
          dir*0.08;

      }
      else{

        const dir =
          dz===0
          ?
          1
          :
          Math.sign(dz);


        car.position.z +=
          dir*overlapZ;

        carState.heading -=
          dir*0.08;

      }


      carState.speed *=
        0.25;

    }

  }

}


/* =========================================================
   ФИЗИКА
========================================================= */

function updateCar(dt){

  const forward =
    (input.forward?1:0) -
    (input.back?1:0);


  const steerInput =
    (input.left?1:0) -
    (input.right?1:0);


  carState.boosting =
    input.nitro &&
    carState.nitro>0 &&
    carState.speed>5;


  const targetMax =
    carState.boosting
    ?
    carState.boostSpeed
    :
    carState.maxSpeed;


  /* Разгон */

  if(
    forward>0
  ){

    carState.speed +=
      carState.accel*
      dt*
      (
        carState.boosting
        ?
        2.1
        :
        1
      );

  }
  else if(
    forward<0
  ){

    carState.speed -=
      carState.brake*dt;

  }
  else{

    const amount =
      carState.friction*dt;


    if(
      carState.speed>0
    ){

      carState.speed =
        Math.max(
          0,
          carState.speed-amount
        );

    }
    else if(
      carState.speed<0
    ){

      carState.speed =
        Math.min(
          0,
          carState.speed+amount
        );

    }

  }


  carState.speed =
    THREE.MathUtils.clamp(
      carState.speed,
      -35,
      targetMax
    );


  /* Нитро */

  if(
    carState.boosting
  ){

    carState.nitro =
      Math.max(
        0,
        carState.nitro-32*dt
      );

  }
  else{

    carState.nitro =
      Math.min(
        100,
        carState.nitro+14*dt
      );

  }


  /* Руль */

  const steerFactor =
    THREE.MathUtils.clamp(
      Math.abs(
        carState.speed
      )/25,
      0,
      1
    );


  const targetDrift =
    Math.abs(
      steerInput
    )*steerFactor;


  carState.drift +=
    (
      targetDrift -
      carState.drift
    ) *
    Math.min(
      1,
      dt*7
    );


  carState.heading +=
    steerInput *
    carState.steer *
    steerFactor *
    dt *
    (
      carState.speed>=0
      ?
      1
      :
      -1
    );


  /* Прыжок */

  if(
    carState.airborne
  ){

    carState.verticalVel -=
      26*dt;

    carState.y +=
      carState.verticalVel*dt;


    if(
      carState.y<=0
    ){

      carState.y=0;

      carState.verticalVel=0;

      carState.airborne=false;

    }


    carState.speed *=
      Math.max(
        0,
        1-0.35*dt
      );

  }


  /* Позиция */

  car.position.x +=
    Math.sin(
      carState.heading
    ) *
    carState.speed *
    dt;


  car.position.z +=
    Math.cos(
      carState.heading
    ) *
    carState.speed *
    dt;


  car.position.y =
    carState.y;


  /* Наклон */

  const targetRoll =
    -steerInput*
    0.2*
    steerFactor;


  car.rotation.z +=
    (
      targetRoll-
      car.rotation.z
    ) *
    Math.min(
      1,
      8*dt
    );


  car.rotation.y =
    carState.heading;


  const targetPitch =
    carState.airborne
    ?
    -carState.verticalVel*
    0.014
    :
    0;


  car.rotation.x +=
    (
      targetPitch-
      car.rotation.x
    ) *
    Math.min(
      1,
      5*dt
    );


  /* Тормоза */

  const braking =
    input.back &&
    carState.speed>2;


  const targetBrake =
    braking
    ?
    8
    :
    0;


  brakeLightL.intensity +=
    (
      targetBrake -
      brakeLightL.intensity
    ) *
    Math.min(
      1,
      dt*12
    );


  brakeLightR.intensity =
    brakeLightL.intensity;


  /* Полиция */

  if(
    carStyles[currentStyle].police
  ){

    const t =
      performance.now()*0.005;

    const phase =
      Math.sin(t);


    policeLightL.intensity =
      phase>0 ? 5 : 0;

    policeLightR.intensity =
      phase>0 ? 0 : 5;

  }
  else{

    policeLightL.intensity=0;
    policeLightR.intensity=0;

  }


  /* Следы */

  skidTimer -= dt;


  if(
    carState.drift>0.25 &&
    Math.abs(carState.speed)>25 &&
    !carState.airborne &&
    skidTimer<=0
  ){

    const bx =
      car.position.x -
      Math.sin(
        carState.heading
      )*1.55;


    const bz =
      car.position.z -
      Math.cos(
        carState.heading
      )*1.55;


    spawnSkid(

      bx -
      Math.cos(
        carState.heading
      )*1.15,

      bz +
      Math.sin(
        carState.heading
      )*1.15,

      carState.heading

    );


    spawnSkid(

      bx +
      Math.cos(
        carState.heading
      )*1.15,

      bz -
      Math.sin(
        carState.heading
      )*1.15,

      carState.heading

    );


    skidTimer =
      0.045;

  }


  /* Удаление старых следов */

  for(
    let i=skidMarks.length-1;
    i>=0;
    i--
  ){

    const s =
      skidMarks[i];

    s.life -= dt;


    s.mesh.material.opacity =
      Math.max(
        0,
        s.life/1.5
      )*0.45;


    if(
      s.life<=0
    ){

      scene.remove(
        s.mesh
      );

      skidMarks.splice(
        i,
        1
      );

    }

  }


  /* Коллизии */

  resolveBuildingCollisions();


  /* Колёса */

  wheelsGroup.children
    .forEach(
      obj=>{

        if(
          obj.userData.isWheel
        ){

          obj.rotation.x +=
            carState.speed*
            dt*
            2.2;

        }

      }
    );


  /* Турбины */

  turbineGroup.children
    .forEach(
      obj=>{

        if(
          obj.userData.isTurbine
        ){

          obj.rotation.z +=
            dt*
            (
              8+
              Math.abs(
                carState.speed
              )*.35
            );

        }

      }
    );


  /* Подсветка */

  const time =
    performance.now()*0.005;


  const pulse =
    7+
    Math.sin(time)*2+
    Math.abs(
      carState.speed
    )*0.055;


  underglow.intensity =
    pulse*
    (
      carState.boosting
      ?
      1.6
      :
      1
    );


  underglow2.intensity =
    underglow.intensity;


  underglow3.intensity =
    underglow.intensity*0.55;

}


/* =========================================================
   КАМЕРА
========================================================= */

const camPos =
  new THREE.Vector3();

const camTarget =
  new THREE.Vector3();


function updateCamera(dt){

  let back;
  let height;
  let look;


  if(
    camMode===0
  ){

    back=-10;
    height=4.5;
    look=10;

  }
  else if(
    camMode===1
  ){

    back=-0.3;
    height=1.4;
    look=8;

  }
  else{

    back=-16;
    height=7;
    look=12;

  }


  const sinH =
    Math.sin(
      carState.heading
    );

  const cosH =
    Math.cos(
      carState.heading
    );


  camPos.set(

    car.position.x+
    sinH*back,

    car.position.y+
    height,

    car.position.z+
    cosH*back

  );


  camTarget.set(

    car.position.x+
    sinH*look,

    car.position.y+
    1.2,

    car.position.z+
    cosH*look

  );


  const smooth =
    camMode===1
    ?
    1
    :
    1-
    Math.pow(
      0.0015,
      dt
    );


  camera.position.lerp(
    camPos,
    smooth
  );


  camera.lookAt(
    camTarget
  );


  const targetFov =
    72+
    Math.abs(
      carState.speed
    )*0.25+
    (
      carState.boosting
      ?
      14
      :
      0
    );


  camera.fov +=
    (
      targetFov-
      camera.fov
    ) *
    Math.min(
      1,
      4*dt
    );


  camera.updateProjectionMatrix();

}


/* =========================================================
   ДОЖДЬ
========================================================= */

function updateRain(dt){

  const p =
    rain.geometry
      .attributes
      .position
      .array;


  for(
    let i=0;
    i<rainCount;
    i++
  ){

    p[i*3+1] -=
      80*dt;


    if(
      p[i*3+1]<0
    ){

      p[i*3+1]=140;


      p[i*3] =
        car.position.x+
        (Math.random()-.5)*
        220;


      p[i*3+2] =
        car.position.z+
        (Math.random()-.5)*
        220;

    }

  }


  rain.geometry
    .attributes
    .position
    .needsUpdate=true;

}


/* =========================================================
   HUD
========================================================= */

const speedEl =
  document.querySelector(
    "#speedo b"
  );

const nitroFill =
  document.getElementById(
    "nitroFill"
  );

const mapCanvas =
  document.getElementById(
    "mapCanvas"
  );

const mapCtx =
  mapCanvas.getContext(
    "2d"
  );


function updateHUD(){

  const kmh =
    Math.abs(
      carState.speed
    )*3.6|0;


  speedEl.textContent =
    kmh;


  let gear;


  if(
    carState.airborne
  )
    gear="F";

  else if(kmh<5)
    gear="N";

  else if(kmh<40)
    gear=1;

  else if(kmh<80)
    gear=2;

  else if(kmh<130)
    gear=3;

  else if(kmh<200)
    gear=4;

  else
    gear=5;


  document.querySelector(
    "#info b"
  ).textContent =
    gear;


  document.getElementById(
    "styleName"
  ).textContent =
    carStyles[
      currentStyle
    ].name;


  nitroFill.style.width =
    carState.nitro+"%";

}


/* =========================================================
   МИНИКАРТА
========================================================= */

let mapTimer = 0;


function drawMap(){

  const W =
    mapCanvas.width;

  const H =
    mapCanvas.height;


  mapCtx.clearRect(
    0,
    0,
    W,
    H
  );


  mapCtx.save();


  mapCtx.translate(
    W/2,
    H/2
  );


  mapCtx.rotate(
    -carState.heading
  );


  const scale =
    0.13;


  mapCtx.fillStyle =
    "rgba(255,0,255,.55)";


  for(
    const c of collidables
  ){

    const x =
      (
        c.x-
        car.position.x
      )*scale;


    const z =
      (
        c.z-
        car.position.z
      )*scale;


    if(
      Math.abs(x)<W/2 &&
      Math.abs(z)<H/2
    ){

      mapCtx.fillRect(
        x-1.5,
        z-1.5,
        3,
        3
      );

    }

  }


  mapCtx.fillStyle =
    "#0ff";

  mapCtx.shadowColor =
    "#0ff";

  mapCtx.shadowBlur =
    12;


  mapCtx.beginPath();

  mapCtx.moveTo(
    0,
    -9
  );

  mapCtx.lineTo(
    -5,
    6
  );

  mapCtx.lineTo(
    5,
    6
  );

  mapCtx.closePath();

  mapCtx.fill();


  mapCtx.restore();

}


/* =========================================================
   START
========================================================= */

const splash =
  document.getElementById(
    "splash"
  );


document
  .getElementById("startBtn")
  .addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      initAudio();

      splash.style.opacity =
        0;


      setTimeout(
        ()=>{
          splash.style.display =
            "none";
        },
        500
      );

    },
    {
      passive:false
    }
  );


document.getElementById(
  "loading"
).textContent =
  "ГОРОД ГОТОВ";


/* =========================================================
   ГЛАВНЫЙ ЦИКЛ
========================================================= */

let lastTime =
  performance.now();


function loop(){

  requestAnimationFrame(
    loop
  );


  const now =
    performance.now();


  const dt =
    Math.min(
      (now-lastTime)/1000,
      0.05
    );


  lastTime =
    now;


  updateCar(dt);

  updateCamera(dt);

  updateFlyingCars(dt);

  updateRain(dt);

  updateHUD();


  mapTimer += dt;


  if(
    mapTimer>0.08
  ){

    drawMap();

    mapTimer=0;

  }


  renderer.render(
    scene,
    camera
  );

}


drawMap();

loop();


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1.2
      )
    );

  }
);


/* =========================================================
   IOS GESTURES
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>e.preventDefault(),
  {passive:false}
);

document.addEventListener(
  "contextmenu",
  e=>e.preventDefault()
);

</script>
