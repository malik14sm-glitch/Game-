<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON HUNTER v4.0 // Cyberpunk R15</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { overflow:hidden; background:#000; font-family: 'Courier New', monospace; cursor:none; }
  canvas { display:block; }

  #hud {
    position:fixed; top:15px; left:15px; color:#0ff; font-size:15px;
    text-shadow:0 0 10px #0ff; pointer-events:none; z-index:10;
  }
  #hud div { margin:5px 0; }
  .bar { width:240px; height:16px; border:1px solid #0ff; background:rgba(0,0,0,0.7); position:relative; overflow:hidden; }
  .bar > div { height:100%; transition:width 0.12s linear; }
  #hpFill { background:linear-gradient(90deg,#f0f,#0ff); width:100%; box-shadow:0 0 12px #0ff; }
  #enFill { background:linear-gradient(90deg,#ff0,#f80); width:0%; box-shadow:0 0 12px #f80; }

  #crosshair {
    position:fixed; pointer-events:none; z-index:12;
    width:30px; height:30px; transform:translate(-50%,-50%);
    left:50%; top:50%;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#0ff;
    box-shadow:0 0 10px #0ff, 0 0 20px #0ff;
  }
  #crosshair::before { left:14px; top:0; width:2px; height:30px; }
  #crosshair::after { top:14px; left:0; height:2px; width:30px; }
  #crosshair .dot {
    position:absolute; left:13px; top:13px; width:4px; height:4px;
    background:#f0f; border-radius:50%; box-shadow:0 0 10px #f0f;
  }

  #info {
    position:fixed; bottom:15px; left:50%; transform:translateX(-50%);
    color:#0ff; text-shadow:0 0 8px #0ff; font-size:12px; z-index:10;
    background:rgba(0,0,0,0.7); padding:8px 18px; border:1px solid #0ff;
    border-radius:4px; text-align:center; letter-spacing:1px;
  }

  #waveInfo {
    position:fixed; top:15px; right:15px; color:#f0f; font-size:16px;
    text-shadow:0 0 12px #f0f; text-align:right; z-index:10;
    background:rgba(0,0,0,0.5); padding:10px 16px; border:1px solid #f0f;
    border-radius:4px; min-width:180px;
  }

  #menu {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #1a0033, #0a0018, #000);
    z-index:500; flex-direction:column;
  }
  #menu h1 {
    color:#f0f; font-size:76px; text-shadow:0 0 40px #f0f, 0 0 80px #f0f;
    letter-spacing:10px; margin-bottom:10px; animation:pulse 2s infinite;
  }
  #menu h2 {
    color:#0ff; font-size:16px; text-shadow:0 0 12px #0ff;
    letter-spacing:6px; margin-bottom:50px;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 30px #f0f, 0 0 60px #f0f; }
    50% { text-shadow: 0 0 60px #f0f, 0 0 120px #f0f, 0 0 160px #0ff; }
  }
  .btn {
    padding:16px 50px; margin:8px; font-size:18px; letter-spacing:4px;
    background:transparent; color:#0ff; border:2px solid #0ff;
    cursor:pointer; font-family:inherit; text-shadow:0 0 10px #0ff;
    box-shadow:0 0 20px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
    transition:all 0.3s; border-radius:4px; min-width:280px;
  }
  .btn:hover {
    background:#0ff; color:#000; text-shadow:none;
    box-shadow:0 0 40px #0ff, 0 0 80px #0ff;
    transform:scale(1.05);
  }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#0ff; font-size:22px; z-index:600; flex-direction:column;
    letter-spacing:3px;
  }
  #loading .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.2; } }
  #err {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#200; color:#f66; font-size:14px; z-index:700; padding:40px;
    white-space:pre-wrap; overflow:auto; font-family:monospace;
  }
  #gameover {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.92); color:#f0f; font-size:56px;
    text-shadow:0 0 30px #f0f; z-index:100; flex-direction:column;
  }
  .hitmark {
    position:fixed; pointer-events:none; color:#f00; font-size:28px;
    font-weight:bold; z-index:20; text-shadow:0 0 12px #f00;
    animation: hitFade 0.4s forwards;
  }
  @keyframes hitFade {
    0% { opacity:1; transform:scale(0.8); }
    100% { opacity:0; transform:scale(1.6); }
  }
  #damageOverlay {
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(255,0,0,0.6) 100%);
    opacity:0; transition:opacity 0.2s;
  }
  .killfeed {
    position:fixed; top:120px; right:15px; color:#0ff; font-size:13px;
    text-shadow:0 0 8px #0ff; z-index:10; text-align:right;
    background:rgba(0,0,0,0.4); padding:4px 10px; border-radius:3px;
  }
  .killfeed div { margin:3px 0; animation: slideIn 0.3s; }
  @keyframes slideIn {
    from { transform: translateX(30px); opacity:0; }
    to { transform: translateX(0); opacity:1; }
  }
  #lockHint {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#0ff; text-shadow:0 0 20px #0ff; font-size:22px;
    background:rgba(0,0,0,0.85); padding:20px 40px; border:2px solid #0ff;
    border-radius:8px; z-index:400; display:none; text-align:center;
    letter-spacing:2px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="loading">ЗАГРУЗКА СИСТЕМЫ<span class="dot">...</span></div>
<div id="err"></div>
<div id="damageOverlay"></div>

<div id="menu">
  <h1>NEON HUNTER</h1>
  <h2>CYBERPUNK SHOOTER v4.0 · R15</h2>
  <button class="btn" id="btnPlay">▶  ИГРАТЬ</button>
  <button class="btn" id="btnHelp">?  УПРАВЛЕНИЕ</button>
</div>

<div id="lockHint">🖱 КЛИКНИ СЮДА<br><small style="font-size:14px;">чтобы захватить мышь</small></div>

<div id="hud" style="display:none;">
  <div>HP: <div class="bar"><div id="hpFill"></div></div></div>
  <div>ENERGY: <div class="bar"><div id="enFill"></div></div></div>
  <div id="score">SCORE: 0</div>
  <div id="kills">KILLS: 0</div>
  <div id="wave">WAVE: 1</div>
</div>
<div id="waveInfo" style="display:none;"></div>
<div id="crosshair" style="display:none;"><div class="dot"></div></div>
<div id="info" style="display:none;">
  WASD — движение | SHIFT — бег | SPACE — прыжок (x2) | ЛКМ — плазма | ПКМ (держать) — МЕГА-ЛАЗЕР | E — мина
</div>
<div id="gameover">
  СИСТЕМА УНИЧТОЖЕНА
  <div style="font-size:22px; color:#0ff; margin-top:20px;" id="finalScore"></div>
  <small style="font-size:16px; color:#f0f; margin-top:20px;">F5 — перезапуск</small>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ============== ЗАЩИТА ==============
window.addEventListener('error', function(e) {
  const err = document.getElementById('err');
  err.style.display = 'flex';
  err.textContent = 'ОШИБКА:\n' + e.message + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
});

// ============== АУДИО ==============
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfx = {
  laser: () => playSound(880, 0.08, 'sawtooth', 0.06),
  mega: () => { playSound(120, 0.7, 'sawtooth', 0.15); playSound(300, 0.6, 'square', 0.1); },
  explode: () => playSound(70, 0.35, 'sawtooth', 0.14),
  hit: () => playSound(1400, 0.04, 'square', 0.04),
  hurt: () => playSound(160, 0.2, 'sawtooth', 0.1),
  pickup: () => playSound(1600, 0.15, 'sine', 0.09),
  jump: () => playSound(600, 0.1, 'sine', 0.05),
  mine: () => playSound(300, 0.12, 'square', 0.05),
  charge: () => playSound(400, 0.4, 'sine', 0.05),
};

// ============== ПРОВЕРКА ==============
window.addEventListener('load', () => {
  setTimeout(() => {
    if (typeof THREE === 'undefined') {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('err');
      err.style.display = 'flex';
      err.textContent = '❌ Three.js не загрузился.\n\nFirefox / GitHub Pages / python -m http.server — одно из решений.';
      return;
    }
    initMenu();
  }, 500);
});

function initMenu() {
  document.getElementById('loading').style.display = 'none';

  document.getElementById('btnPlay').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('info').style.display = 'block';
    document.getElementById('waveInfo').style.display = 'block';
    initAudio();
    startGame();
  });

  document.getElementById('btnHelp').addEventListener('click', () => {
    alert('УПРАВЛЕНИЕ v4.0:\n\n🖱 МЫШЬ — камера\n🖱 КОЛЕСО — зум\nЛКМ — плазменный заряд\nПКМ (держать) — МЕГА-ЛАЗЕР (ваншот)\nWASD — движение\nSHIFT — бег\nSPACE — двойной прыжок\nE — мина\nESC — освободить мышь\n\nРоботы летают с НОЖАМИ. Не стреляют.');
  });
}

let gameStarted = false;
function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  mainGame();
}
// ============================================================
// ЧАСТЬ 2 — ОСНОВНАЯ ИГРА v4.0
// ============================================================

function mainGame() {

  // ============ СЦЕНА ============
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02000a);
  scene.fog = new THREE.FogExp2(0x08001a, 0.009);

  const camera = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  document.body.appendChild(renderer.domElement);

  // ============ СВЕТ ============
  scene.add(new THREE.AmbientLight(0x1a0033, 0.7));
  const moon = new THREE.DirectionalLight(0x6644ff, 1.3);
  moon.position.set(50, 90, 40);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -120;
  moon.shadow.camera.right = 120;
  moon.shadow.camera.top = 120;
  moon.shadow.camera.bottom = -120;
  moon.shadow.camera.far = 300;
  scene.add(moon);

  const neonColors = [0xff00ff, 0x00ffff, 0xff0066, 0x00ff88, 0xffaa00, 0xff3300, 0xaa00ff, 0x00ffaa, 0xff44aa];

  const cityLights = [];
  for (let i = 0; i < 30; i++) {
    const l = new THREE.PointLight(neonColors[i % neonColors.length], 3, 55);
    l.position.set((Math.random()-0.5)*180, 8 + Math.random()*22, (Math.random()-0.5)*180);
    scene.add(l);
    cityLights.push({ light: l, base: 3, phase: Math.random() * Math.PI * 2 });
  }

  // ============ ЗЕМЛЯ ============
  const groundGeo = new THREE.PlaneGeometry(240, 240, 60, 60);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x060010, roughness: 0.5, metalness: 0.85,
    emissive: 0x0f0022, emissiveIntensity: 0.5
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(240, 120, 0xff00ff, 0x00ffff);
  grid.position.y = 0.02;
  grid.material.opacity = 0.35;
  grid.material.transparent = true;
  scene.add(grid);

  // ============================================================
  // ГОРОД — ДЕТАЛИЗИРОВАННЫЙ
  // ============================================================
  const CITY_SIZE = 40;
  const CELL = 5;
  const buildingColliders = [];

  const buildMats = [
    new THREE.MeshStandardMaterial({ color:0x1a1a2e, metalness:0.88, roughness:0.3, emissive:0x220044, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x16213e, metalness:0.9, roughness:0.25, emissive:0x004466, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x0f0f1e, metalness:0.92, roughness:0.2, emissive:0x440022, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x2a1a3e, metalness:0.85, roughness:0.32, emissive:0x004444, emissiveIntensity:0.35 }),
    new THREE.MeshStandardMaterial({ color:0x1e1030, metalness:0.9, roughness:0.28, emissive:0x330066, emissiveIntensity:0.45 }),
  ];

  // --- Неоновая вывеска с "иероглифами" ---
  function makeBillboard(x, y, z, rotY, color) {
    const g = new THREE.Group();
    const W = 4.8, H = 2.8;
    // внешняя светящаяся рамка
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(W + 0.3, H + 0.3, 0.28),
      new THREE.MeshBasicMaterial({ color: color })
    );
    g.add(frame);
    // тёмный экран
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(W, H),
      new THREE.MeshStandardMaterial({ color:0x08080f, emissive: color, emissiveIntensity: 0.35 })
    );
    screen.position.z = 0.15;
    g.add(screen);
    // белые "иероглифы" — вертикальные штрихи
    const cols = 7, rows = 4;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.45) continue;
        const sw = 0.15 + Math.random() * 0.25;
        const sh = 0.12 + Math.random() * 0.35;
        const strip = new THREE.Mesh(
          new THREE.PlaneGeometry(sw, sh),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
        );
        strip.position.set(-W/2 + 0.5 + c*(W-1)/cols, -H/2 + 0.5 + r*(H-1)/rows, 0.16);
        g.add(strip);
      }
    }
    // маленькая неоновая плашка сверху
    const topStrip = new THREE.Mesh(
      new THREE.BoxGeometry(W + 0.4, 0.15, 0.3),
      new THREE.MeshBasicMaterial({ color })
    );
    topStrip.position.y = H/2 + 0.35;
    g.add(topStrip);
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    scene.add(g);
  }

  // --- Кабели (провисающие линии между зданиями) ---
  function makeCable(x1, y1, z1, x2, y2, z2, color) {
    const points = [];
    const segs = 8;
    const sag = 1.5;
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const sagY = -Math.sin(t * Math.PI) * sag;
      points.push(new THREE.Vector3(
        x1 + (x2 - x1) * t,
        y1 + (y2 - y1) * t + sagY,
        z1 + (z2 - z1) * t
      ));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    const tubeGeo = new THREE.TubeGeometry(curve, 10, 0.05, 5, false);
    const tube = new THREE.Mesh(tubeGeo, new THREE.MeshBasicMaterial({ color }));
    scene.add(tube);
  }

  // --- Антенна на крыше ---
  function makeAntenna(x, y, z, height, color) {
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.08, height, 6),
      new THREE.MeshStandardMaterial({ color:0x222233, metalness: 1, roughness: 0.2 })
    );
    pole.position.set(x, y + height / 2, z);
    scene.add(pole);
    const tip = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 8, 8),
      new THREE.MeshBasicMaterial({ color })
    );
    tip.position.set(x, y + height, z);
    scene.add(tip);
    // маленькие перекладины
    for (let i = 1; i <= 3; i++) {
      const bar = new THREE.Mesh(
        new THREE.CylinderGeometry(0.03, 0.03, 0.6, 4),
        new THREE.MeshBasicMaterial({ color })
      );
      bar.rotation.z = Math.PI / 2;
      bar.position.set(x, y + (height * i / 4), z);
      scene.add(bar);
    }
  }

  // --- Одно здание ---
  function makeBuilding(x, z) {
    const w = 2.8 + Math.random() * 1.6;
    const d = 2.8 + Math.random() * 1.6;
    const h = 5 + Math.random() * 26;
    const mat = buildMats[Math.floor(Math.random() * buildMats.length)];

    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    b.position.set(x, h/2, z);
    b.castShadow = true; b.receiveShadow = true;
    scene.add(b);

    buildingColliders.push({ x, z, w: w/2 + 0.5, d: d/2 + 0.5 });

    const edgeColor = neonColors[Math.floor(Math.random()*neonColors.length)];

    // Неоновая кромка сверху
    const edge = new THREE.Mesh(
      new THREE.BoxGeometry(w + 0.08, 0.2, d + 0.08),
      new THREE.MeshBasicMaterial({ color: edgeColor })
    );
    edge.position.set(x, h + 0.06, z);
    scene.add(edge);

    // Вертикальные неоновые полосы
    const stripCount = Math.floor(Math.random() * 3) + 1;
    for (let s = 0; s < stripCount; s++) {
      const sc = neonColors[Math.floor(Math.random()*neonColors.length)];
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, h * (0.6 + Math.random()*0.35), 0.08),
        new THREE.MeshBasicMaterial({ color: sc })
      );
      const side = Math.floor(Math.random() * 4);
      let sx = x, sz = z;
      if (side === 0) sx = x + w/2 + 0.05;
      else if (side === 1) sx = x - w/2 - 0.05;
      else if (side === 2) sz = z + d/2 + 0.05;
      else sz = z - d/2 - 0.05;
      strip.position.set(sx, h/2, sz);
      scene.add(strip);
    }

    // Окна — светящиеся прямоугольники на гранях
    const winRows = Math.floor(h / 1.8);
    for (let i = 0; i < winRows; i++) {
      if (Math.random() < 0.35) continue;
      const face = Math.floor(Math.random() * 4);
      const wc = Math.random() < 0.5 ? 0xffaa44 : (Math.random() < 0.5 ? 0x00ffff : 0xff00ff);
      const win = new THREE.Mesh(
        new THREE.PlaneGeometry(0.4 + Math.random()*0.35, 0.3),
        new THREE.MeshBasicMaterial({ color: wc })
      );
      const wy = 2 + i * 1.8;
      if (face === 0) { win.position.set(x + w/2 + 0.03, wy, z + (Math.random()-0.5)*d*0.5); }
      else if (face === 1) { win.position.set(x - w/2 - 0.03, wy, z + (Math.random()-0.5)*d*0.5); win.rotation.y = Math.PI; }
      else if (face === 2) { win.position.set(x + (Math.random()-0.5)*w*0.5, wy, z + d/2 + 0.03); }
      else { win.position.set(x + (Math.random()-0.5)*w*0.5, wy, z - d/2 - 0.03); win.rotation.y = Math.PI; }
      scene.add(win);
    }

    // Трубы сбоку
    if (Math.random() < 0.4 && h > 10) {
      const pipe = new THREE.Mesh(
        new THREE.CylinderGeometry(0.1, 0.1, h * 0.7, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a2a3a, metalness: 0.9, roughness: 0.3 })
      );
      const side = Math.random() < 0.5 ? 1 : -1;
      pipe.position.set(x + side * (w/2 + 0.15), h * 0.5, z + (Math.random()-0.5) * d * 0.4);
      scene.add(pipe);
    }

    // Билборд
    if (h > 12 && Math.random() < 0.7) {
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      const side = Math.random() < 0.5 ? 1 : -1;
      makeBillboard(x, h - 2.5, z + side * (d/2 + 0.3), side > 0 ? 0 : Math.PI, col);
    }
    // Большой билборд на крыше
    if (h > 20 && Math.random() < 0.5) {
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      makeBillboard(x, h + 2, z, Math.random() * Math.PI * 2, col);
    }
    // Антенна
    if (h > 15 && Math.random() < 0.5) {
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      makeAntenna(x, h, z, 2 + Math.random() * 3, col);
    }
  }

  (function generateCity() {
    const half = (CITY_SIZE * CELL) / 2;
    for (let ix = 0; ix < CITY_SIZE; ix++) {
      for (let iz = 0; iz < CITY_SIZE; iz++) {
        if (Math.abs(ix - CITY_SIZE/2) < 3 && Math.abs(iz - CITY_SIZE/2) < 3) continue;
        if (Math.random() < 0.3) continue;
        if (ix % 9 === 4 || iz % 9 === 4) continue;
        const x = ix * CELL - half + CELL/2;
        const z = iz * CELL - half + CELL/2;
        makeBuilding(x, z);
      }
    }
  })();

    isLocked = document.pointerLockElement === renderer.domElement;

  });

  });

    if (!isLocked) return;
    const sens = 0.0022;
    yaw -= e.movementX * sens;
    pitch += e.movementY * sens;
    pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
  });

  function createRobot(style, isBoss) {
    const scale = isBoss ? 2.3 : 1;
    const group = new THREE.Group();
    const cMain = style.color;
    const cAcc = style.acc;

    const mBody = new THREE.MeshStandardMaterial({ color:cMain, metalness:0.9, roughness:0.28, emissive:cMain, emissiveIntensity:0.4 });
    const mDark = new THREE.MeshStandardMaterial({ color:0x0a0a14, metalness:0.95, roughness:0.2, emissive:cAcc, emissiveIntensity:0.18 });
    const mAcc = new THREE.MeshBasicMaterial({ color: cAcc });
    const mEye = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Ядро (светящийся шар) — висит у всех
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.2*scale, 12, 12), mAcc);
    core.position.y = 1.5 * scale;
    group.add(core);

    // Плазменная аура — прозрачная сфера
    const aura = new THREE.Mesh(
      new THREE.SphereGeometry(0.4*scale, 14, 14),
      new THREE.MeshBasicMaterial({ color: cAcc, transparent: true, opacity: 0.15 })
    );
    aura.position.y = 1.5 * scale;
    group.add(aura);

    // 2 руки — идут от ядра, держат ножи
    for (let s = -1; s <= 1; s += 2) {
      const armGroup = new THREE.Group();
      armGroup.position.set(s * 0.35 * scale, 1.5 * scale, 0);
      // плечо
      const upper = new THREE.Mesh(new THREE.BoxGeometry(0.14*scale, 0.5*scale, 0.14*scale), mBody);
      upper.position.y = -0.25*scale;
      upper.castShadow = true;
      armGroup.add(upper);
      // локоть
      const el = new THREE.Mesh(new THREE.SphereGeometry(0.09*scale, 8, 8), mDark);
      el.position.y = -0.5*scale;
      armGroup.add(el);
      // предплечье
      const fore = new THREE.Mesh(new THREE.BoxGeometry(0.12*scale, 0.45*scale, 0.12*scale), mDark);
      fore.position.y = -0.75*scale;
      armGroup.add(fore);
      // кисть
      const hand = new THREE.Mesh(new THREE.BoxGeometry(0.14*scale, 0.12*scale, 0.14*scale), mBody);
      hand.position.y = -1.0*scale;
      armGroup.add(hand);
      // нож
      const knife = makeKnife(cAcc);
      knife.scale.setScalar(scale * 1.2);
      knife.position.y = -1.15*scale;
      knife.rotation.x = Math.PI; // острие вниз
      armGroup.add(knife);
      group.add(armGroup);
      if (s === 1) group.userData.rightArm = armGroup;
      else group.userData.leftArm = armGroup;
    }

    // Торс (небольшой)
    const torso = new THREE.Mesh(new THREE.BoxGeometry(0.5*scale, 0.5*scale, 0.4*scale), mBody);
    torso.position.y = 1.5*scale;
    torso.castShadow = true;
    group.add(torso);

    // Голова
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.4*scale, 0.38*scale, 0.4*scale), mDark);
    head.position.y = 2.0*scale;
    head.castShadow = true;
    group.add(head);

    // Визор
    const visor = new THREE.Mesh(new THREE.BoxGeometry(0.35*scale, 0.1*scale, 0.05*scale), mEye);
    visor.position.set(0, 2.02*scale, 0.22*scale);
    group.add(visor);

    // 2 маленьких глаза
    const e1 = new THREE.Mesh(new THREE.SphereGeometry(0.03*scale, 8, 8), mEye);
    e1.position.set(-0.08*scale, 2.02*scale, 0.25*scale);
    group.add(e1);
    const e2 = e1.clone();
    e2.position.x = 0.08 * scale;
    group.add(e2);

    // Антенна
    const antRod = new THREE.Mesh(new THREE.CylinderGeometry(0.015*scale, 0.015*scale, 0.28*scale, 6), mAcc);
    antRod.position.set(0.14*scale, 2.35*scale, 0);
    group.add(antRod);
    const antTip = new THREE.Mesh(new THREE.SphereGeometry(0.045*scale, 8, 8), mAcc);
    antTip.position.set(0.14*scale, 2.5*scale, 0);
    group.add(antTip);

    // Ноги — тоже летают, но пусть висят
    for (let s = -1; s <= 1; s += 2) {
      const legGroup = new THREE.Group();
      legGroup.position.set(s * 0.15 * scale, 1.15 * scale, 0);
      const thigh = new THREE.Mesh(new THREE.BoxGeometry(0.16*scale, 0.4*scale, 0.16*scale), mBody);
      thigh.position.y = -0.2*scale;
      legGroup.add(thigh);
      const knee = new THREE.Mesh(new THREE.SphereGeometry(0.08*scale, 8, 8), mDark);
      knee.position.y = -0.45*scale;
      legGroup.add(knee);
      const shin = new THREE.Mesh(new THREE.BoxGeometry(0.14*scale, 0.4*scale, 0.14*scale), mDark);
      shin.position.y = -0.65*scale;
      legGroup.add(shin);
      const foot = new THREE.Mesh(new THREE.BoxGeometry(0.18*scale, 0.1*scale, 0.3*scale), mBody);
      foot.position.set(0, -0.9*scale, 0.05*scale);
      legGroup.add(foot);
      group.add(legGroup);
    }

    // Гравитационные кольца (визуально — почему летают)
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(0.7*scale, 0.04*scale, 6, 24), mAcc);
    ring1.rotation.x = Math.PI / 2;
    ring1.position.y = 1.5*scale;
    group.add(ring1);
    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.9*scale, 0.03*scale, 6, 24), mAcc);
    ring2.rotation.x = Math.PI / 2;
    ring2.position.y = 1.5*scale;
    group.add(ring2);
    group.userData.ring1 = ring1;
    group.userData.ring2 = ring2;
    group.userData.core = core;
    group.userData.aura = aura;

    if (isBoss) {
      const crown = new THREE.Mesh(
        new THREE.TorusGeometry(0.6*scale, 0.06, 8, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      crown.rotation.x = Math.PI / 2;
      crown.position.y = 2.8 * scale;
      group.add(crown);
      group.userData.crown = crown;
    }

    return group;
  }

  function spawnEnemy(idx, pos, isBoss) {
    const style = robotStyles[idx % robotStyles.length];
    const mesh = createRobot(style, isBoss);
    mesh.position.copy(pos);
    mesh.position.y = 1.5; // парят над землёй
    scene.add(mesh);
    const e = {
      mesh, style,
      hp: style.hp * (isBoss ? 12 : 1),
      maxHp: style.hp * (isBoss ? 12 : 1),
      speed: style.speed * (isBoss ? 0.6 : 1),
      dmg: style.dmg * (isBoss ? 2 : 1),
      attackCD: 0,
      hover: Math.random() * Math.PI * 2,
      isBoss: !!isBoss,
      bobPhase: Math.random() * Math.PI * 2,
      baseY: 1.5
    };
    enemies.push(e);
    return e;
  }

  // ============================================================
  // ЛАЗЕРЫ — ПЛАЗМЕННЫЕ СНАРЯДЫ (как у Злого Морти)
  // ============================================================
  const lasers = [];
  const particles = [];
  const mines = [];
  const powerups = [];
  let mineCooldown = 0;

  // Основной видимый снаряд
  function firePlasma(origin, direction, isMega) {
    isMega = !!isMega;
    const group = new THREE.Group();
    group.position.copy(origin);

    const coreSize = isMega ? 0.9 : 0.35;
    const glowSize = isMega ? 2.5 : 0.9;

    // Ядро — белое/золотое
    const coreMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffffff : 0xffffaa });
    const core = new THREE.Mesh(new THREE.SphereGeometry(coreSize, 16, 16), coreMat);
    group.add(core);

    // Внутреннее кольцо энергии
    const innerMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffdd44 : 0xffaa00 });
    const inner = new THREE.Mesh(new THREE.SphereGeometry(coreSize * 1.4, 14, 14), innerMat);
    inner.material.transparent = true;
    inner.material.opacity = 0.6;
    group.add(inner);

    // Внешний ореол
    const outerMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffaa00 : 0xff8800 });
    const outer = new THREE.Mesh(new THREE.SphereGeometry(glowSize, 16, 16), outerMat);
    outer.material.transparent = true;
    outer.material.opacity = 0.28;
    group.add(outer);

    // Плазменное кольцо поперёк направления
    const ringGeo = new THREE.TorusGeometry(glowSize * 0.9, glowSize * 0.15, 8, 24);
    const ringMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffdd88 : 0xffcc44, transparent: true, opacity: 0.85 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    group.add(ring);

    // Хвост — конус позади
    const tailGeo = new THREE.ConeGeometry(glowSize * 0.8, glowSize * 4, 16, 1, true);
    const tailMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffdd44 : 0xffaa00, transparent: true, opacity: 0.4 });
    const tail = new THREE.Mesh(tailGeo, tailMat);
    tail.position.z = -glowSize * 2;
    tail.rotation.x = Math.PI / 2;
    group.add(tail);

    // Свет, чтобы подсвечивал окружение
    const light = new THREE.PointLight(isMega ? 0xffdd44 : 0xffaa00, isMega ? 8 : 3, isMega ? 30 : 12);
    group.add(light);

    // Ориентируем группу по направлению
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), direction.clone().normalize());
    group.quaternion.copy(q);

    scene.add(group);

    lasers.push({
      group, core, inner, outer, ring, tail, light,
      dir: direction.clone().normalize(),
      speed: isMega ? 60 : 45,
      life: isMega ? 1.5 : 2.2,
      maxLife: isMega ? 1.5 : 2.2,
      isMega,
      length: isMega ? 100 : 35,
      traveled: 0
    });

    isMega ? sfx.mega() : sfx.laser();
  }

  // Проверка попадания снаряда по врагам
  function checkLaserHits() {
    for (let li = lasers.length - 1; li >= 0; li--) {
      const L = lasers[li];
      const pos = L.group.position;
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        const eCenter = e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
        const dist = pos.distanceTo(eCenter);
        const hitR = (e.isBoss ? 2.0 : 1.2) + (L.isMega ? 2 : 0.3);
        if (dist < hitR) {
          // МЕГА — ваншот всего
          damageEnemy(e, L.isMega ? 99999 : 20);
          if (!L.isMega) {
            // обычный лазер исчезает после попадания
            removeLaser(li);
          }
          break;
        }
      }
    }
  }

  function removeLaser(idx) {
    const L = lasers[idx];
    // вспышка на месте
    if (L.group.position) {
      for (let i = 0; i < 10; i++) spawnHitParticles(L.group.position.clone(), L.isMega ? 0xffdd44 : 0xffaa00);
    }
    scene.remove(L.group);
    lasers.splice(idx, 1);
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)), e.style.acc);
    showHitmark();
    sfx.hit();
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    scene.remove(e.mesh);
    const i = enemies.indexOf(e);
    if (i >= 0) enemies.splice(i, 1);
    score += (10 + e.maxHp) * (e.isBoss ? 5 : 1);
    kills++;
    updateHUD();
    addKillFeed(e.style.name + (e.isBoss ? ' [BOSS]' : ''));
    sfx.explode();
    const c = e.style.acc;
    const count = e.isBoss ? 80 : 25;
    for (let j = 0; j < count; j++) {
      spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0,1.5,0)), c);
    }
  }

  function spawnHitParticles(pos, color) {
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 4, 4),
        new THREE.MeshBasicMaterial({ color, transparent: true })
      );
      p.position.copy(pos);
      const vel = new THREE.Vector3(
        (Math.random()-0.5)*5, Math.random()*3.5, (Math.random()-0.5)*5
      );
      scene.add(p);
      particles.push({ mesh: p, vel, life: 0.7, maxLife: 0.7 });
    }
  }

  function spawnPowerup(pos, type) {
    const color = type === 'health' ? 0x00ff88 : 0xffaa00;
    const geo = type === 'health'
      ? new THREE.BoxGeometry(0.55, 0.55, 0.55)
      : new THREE.OctahedronGeometry(0.45);
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos);
    p.position.y = 1.5;
    scene.add(p);
    const glow = new THREE.PointLight(color, 3, 8);
    p.add(glow);
    powerups.push({ mesh: p, type, hover: Math.random() * 6, life: 25 });
  }

  // Мины
  function placeMine() {
    if (mineCooldown > 0) return;
    mineCooldown = 3;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    m.position.copy(player.position);
    m.position.y = 0.4;
    scene.add(m);
    const light = new THREE.PointLight(0xff0000, 3, 6);
    m.add(light);
    mines.push({ mesh: m, life: 18, blink: 0 });
    sfx.mine();
  }

  function updateMines(dt) {
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      m.life -= dt;
      m.blink += dt;
      m.mesh.material.color.setHex(Math.sin(m.blink * 12) > 0 ? 0xff0000 : 0x440000);
      m.mesh.scale.setScalar(1 + Math.sin(m.blink * 12) * 0.15);
      for (const e of enemies) {
        const d = e.mesh.position.distanceTo(m.mesh.position);
        if (d < 3.5) {
          for (let j = 0; j < 20; j++) spawnHitParticles(m.mesh.position, 0xff8800);
          for (const e2 of enemies) {
            if (e2.mesh.position.distanceTo(m.mesh.position) < 4.5) {
              damageEnemy(e2, e2.isBoss ? 60 : 120);
            }
          }
          sfx.explode();
          flashScreen(0xff4400, 0.25);
          scene.remove(m.mesh);
          mines.splice(i, 1);
          break;
        }
      }
      if (m.life <= 0) {
        scene.remove(m.mesh);
        mines.splice(i, 1);
      }
    }
  }

  // ============================================================
  // HUD
  // ============================================================
  let hp = 100;
  let energy = 0;
  let charging = false;
  let chargeTime = 0;
  let score = 0, kills = 0;
  let wave = 1;
  let waveTimer = 0;
  let waveState = 'preparing';
  let gameOver = false;
  let velocityY = 0;
  let onGround = true;
  let jumpCount = 0;
  let shootCooldown = 0;

  const hpFill = document.getElementById('hpFill');
  const enFill = document.getElementById('enFill');
  const scoreEl = document.getElementById('score');
  const killsEl = document.getElementById('kills');
  const waveEl = document.getElementById('wave');
  const waveInfoEl = document.getElementById('waveInfo');
  const gameoverEl = document.getElementById('gameover');
  const damageOverlay = document.getElementById('damageOverlay');
  const killFeed = document.createElement('div');
  killFeed.className = 'killfeed';
  document.body.appendChild(killFeed);

  function updateHUD() {
    hpFill.style.width = Math.max(0, hp) + '%';
    enFill.style.width = energy + '%';
    scoreEl.textContent = 'SCORE: ' + score;
    killsEl.textContent = 'KILLS: ' + kills;
    waveEl.textContent = 'WAVE: ' + wave;
    if (waveState === 'preparing') {
      waveInfoEl.innerHTML = 'ВОЛНА ' + wave + ' ЧЕРЕЗ<br><span style="font-size:36px;color:#0ff;">' + Math.ceil(waveTimer) + '</span>';
    } else if (waveState === 'cleared') {
      waveInfoEl.innerHTML = '<span style="color:#0ff;">ВОЛНА ЗАЧИЩЕНА!</span>';
    } else {
      waveInfoEl.textContent = 'ВРАГОВ: ' + enemies.length;
    }
  }

  function addKillFeed(name) {
    const div = document.createElement('div');
    div.textContent = '✖ ' + name;
    killFeed.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function showHitmark() {
    const hm = document.createElement('div');
    hm.className = 'hitmark';
    hm.textContent = '✕';
    hm.style.left = 'calc(50% + 18px)';
    hm.style.top = 'calc(50% - 18px)';
    document.body.appendChild(hm);
    setTimeout(() => hm.remove(), 400);
  }

  function showDamage() {
    damageOverlay.style.opacity = '1';
    setTimeout(() => { damageOverlay.style.opacity = '0'; }, 180);
  }

  function flashScreen(color, alpha) {
    const div = document.createElement('div');
    const r = (color>>16)&255, g = (color>>8)&255, b = color&255;
    div.style.cssText = 'position:fixed;inset:0;background:rgba('+r+','+g+','+b+','+alpha+');pointer-events:none;z-index:50;transition:opacity 0.4s;';
    document.body.appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; }, 30);
    setTimeout(() => div.remove(), 500);
  }

  function endGame() {
    gameOver = true;
    document.getElementById('finalScore').textContent = 'SCORE: ' + score + ' | KILLS: ' + kills + ' | WAVE: ' + wave;
    gameoverEl.style.display = 'flex';
    if (document.exitPointerLock) document.exitPointerLock();
  }

  // ============================================================
  // МЫШЬ
  // ============================================================
  let mouseDownL = false, mouseDownR = false;
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 0) mouseDownL = true;
    if (e.button === 2) mouseDownR = true;
  });
  renderer.domElement.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDownL = false;
    if (e.button === 2) {
      if (charging && chargeTime > 1.2) releaseMegaLaser();
      mouseDownR = false;
      charging = false;
    }
  });
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  function getAimDirection() {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    return dir.normalize();
  }

  function releaseMegaLaser() {
    const origin = player.position.clone();
    origin.y += 1.8;
    const dir = getAimDirection();
    // Смещаем стартовую точку чуть вперёд
    origin.add(dir.clone().multiplyScalar(1.2));
    firePlasma(origin, dir, true);
    player.position.add(dir.clone().multiplyScalar(-2));
    flashScreen(0xffdd44, 0.5);
    energy = 0;
    chargeTime = 0;
    updateHUD();
  }

  // ============================================================
  // СПАВН
  // ============================================================
  function spawnRandomEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 35;
    const x = player.position.x + Math.cos(angle) * radius;
    const z = player.position.z + Math.sin(angle) * radius;
    spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z));
  }

  // ============================================================
  // ЦИКЛ
  // ============================================================
  const clock = new THREE.Clock();
  let camPosLerp = new THREE.Vector3(0, 5, 7);
  let camLookLerp = new THREE.Vector3(0, 1.5, 0);
  let spawnTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (gameOver) {
      renderer.render(scene, camera);
      return;
    }

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Мерцание города
    for (const cl of cityLights) {
      cl.light.intensity = cl.base + Math.sin(t * 1.5 + cl.phase) * 1.2;
    }

    // ============ ДВИЖЕНИЕ ИГРОКА ============
    const moveDir = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp']) moveDir.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveDir.z += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

    const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
    const baseSpeed = isRunning ? 12 : 6;
    let isMoving = false;

    if (moveDir.lengthSq() > 0) {
      isMoving = true;
      moveDir.normalize();
      const camFwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const camRight = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const worldMove = new THREE.Vector3()
        .addScaledVector(camFwd, -moveDir.z)
        .addScaledVector(camRight, moveDir.x)
        .normalize()
        .multiplyScalar(baseSpeed * dt);

      const newPos = player.position.clone().add(worldMove);
      let blocked = false;
      for (const c of buildingColliders) {
        if (Math.abs(newPos.x - c.x) < c.w && Math.abs(newPos.z - c.z) < c.d) {
          blocked = true; break;
        }
      }
      if (Math.abs(newPos.x) > 115 || Math.abs(newPos.z) > 115) blocked = true;

      if (!blocked) player.position.copy(newPos);
    }
    player.rotation.y = yaw;

    // Прыжок (двойной)
    if (keys['Space'] && !player.userData.jumpHeld) {
      if (onGround) { velocityY = 9; onGround = false; jumpCount = 1; sfx.jump(); }
      else if (jumpCount < 2) { velocityY = 8.5; jumpCount = 2; sfx.jump(); }
      player.userData.jumpHeld = true;
    }
    if (!keys['Space']) player.userData.jumpHeld = false;

    velocityY -= 25 * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 0) { player.position.y = 0; velocityY = 0; onGround = true; jumpCount = 0; }

    // Мина
    if (keys['KeyE'] && !player.userData.mineHeld) {
      placeMine();
      player.userData.mineHeld = true;
    }
    if (!keys['KeyE']) player.userData.mineHeld = false;
    mineCooldown -= dt;

    // ============ АНИМАЦИЯ ПЕРСОНАЖА R15 ============
    const speedFactor = isMoving ? (isRunning ? 1.5 : 1) : 0;
    const walkCycle = Math.sin(t * 10) * speedFactor;
    const walkBob = Math.abs(Math.sin(t * 10)) * 0.06 * speedFactor;

    // Ноги — гнутся в коленях
    legL.group.rotation.x = walkCycle * 0.7;
    legL.knee.rotation.x = Math.max(0, -walkCycle) * 0.9;
    legR.group.rotation.x = -walkCycle * 0.7;
    legR.knee.rotation.x = Math.max(0, walkCycle) * 0.9;

    // Руки
    armL.group.rotation.x = -walkCycle * 0.5;
    armL.group.rotation.z = 0.15;
    armL.elbow.rotation.x = -0.3 - Math.abs(walkCycle) * 0.3;

    armR.group.rotation.x = -Math.PI / 2 + 0.15 + Math.sin(t * 2) * 0.03;
    armR.group.rotation.z = -0.1;
    armR.elbow.rotation.x = -0.15;

    // Пояс — плавно покачивается
    lowerTorso.rotation.z = Math.sin(t * 10) * 0.04 * speedFactor;
    upperTorso.rotation.z = -Math.sin(t * 10) * 0.02 * speedFactor;
    upperTorso.position.y = 0.3 + walkBob;

    // Кольцо на груди
    coreRing.rotation.z += dt * 2;

    // Антенна мигает
    if (Math.random() < 0.03) {
      antTip.material = M_glowP;
      setTimeout(() => { if (antTip) antTip.material = M_glowO; }, 100);
    }

    // ============ КАМЕРА ============
    const camTargetY = player.position.y + 1.8;
    const targetPos = new THREE.Vector3(player.position.x, camTargetY, player.position.z);
    const camOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * cameraDistance,
      Math.sin(pitch) * cameraDistance + 1.5,
      Math.cos(yaw) * Math.cos(pitch) * cameraDistance
    );
    const desiredCamPos = targetPos.clone().add(camOffset);
    camPosLerp.lerp(desiredCamPos, 0.18);
    camLookLerp.lerp(targetPos, 0.25);
    camera.position.copy(camPosLerp);
    camera.lookAt(camLookLerp);

    // ============ СТРЕЛЬБА ============
    shootCooldown -= dt;
    if (mouseDownL && shootCooldown <= 0 && isLocked) {
      const origin = player.position.clone();
      origin.y += 1.6;
      const dir = getAimDirection();
      origin.add(dir.clone().multiplyScalar(1));
      firePlasma(origin, dir, false);
      shootCooldown = 0.28;
    }

    // Заряд мега-лазера
    if (mouseDownR && !charging && isLocked) { charging = true; chargeTime = 0; }
    if (charging) {
      chargeTime += dt;
      energy = Math.min(100, chargeTime * 60);
      updateHUD();
      const gi = Math.min(1, chargeTime / 1.5);
      // свечение имплантов на руках
      if (armL.elbow.children[2]) armL.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
      if (armR.elbow.children[2]) armR.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
    } else {
      if (energy < 100) { energy = Math.min(100, energy + dt * 8); updateHUD(); }
    }

    // ============ ЛАЗЕРЫ (снаряды) ============
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      L.life -= dt;
      const step = L.speed * dt;
      L.group.position.addScaledVector(L.dir, step);
      L.traveled += step;

      // пульсация
      const pulse = 1 + Math.sin(t * 20 + i) * 0.1;
      L.core.scale.setScalar(pulse);
      L.ring.rotation.z += dt * 12;
      L.tail.scale.set(1, 1 + Math.sin(t * 15 + i) * 0.2, 1);

      if (L.life <= 0 || L.traveled > L.length) {
        removeLaser(i);
      }
    }

    // Проверка попаданий
    checkLaserHits();

    // ============ ВРАГИ (летают, приближаются, бьют ножом) ============
    for (const e of enemies) {
      const toPlayer = player.position.clone().sub(e.mesh.position);
      toPlayer.y = 0;
      const dist = toPlayer.length();
      toPlayer.normalize();

      // Парение
      e.bobPhase += dt * 3;
      e.mesh.position.y = e.baseY + Math.sin(e.bobPhase) * 0.4;

      // Кольца вращаются
      if (e.mesh.userData.ring1) e.mesh.userData.ring1.rotation.z += dt * 3;
      if (e.mesh.userData.ring2) e.mesh.userData.ring2.rotation.z -= dt * 2;
      if (e.mesh.userData.crown) e.mesh.userData.crown.rotation.z += dt * 2;
      // Пульсация ядра
      if (e.mesh.userData.core) {
        const s = 1 + Math.sin(t * 6 + e.bobPhase) * 0.15;
        e.mesh.userData.core.scale.setScalar(s);
      }
      // Аура
      if (e.mesh.userData.aura) {
        e.mesh.userData.aura.material.opacity = 0.15 + Math.sin(t * 4 + e.bobPhase) * 0.08;
      }

      // Движение к игроку
      if (dist > 2.2) {
        const speedMul = e.isBoss ? 0.7 : 1;
        e.mesh.position.addScaledVector(toPlayer, e.speed * speedMul * dt);
      }
      // Поворот к игроку
      const targetRot = Math.atan2(toPlayer.x, toPlayer.z);
      e.mesh.rotation.y += (targetRot - e.mesh.rotation.y) * 0.12;

      // Анимация рук с ножами — машут
      if (e.mesh.userData.rightArm) {
        const swing = Math.sin(t * 8 + e.bobPhase) * 0.6;
        e.mesh.userData.rightArm.rotation.x = -0.5 + swing;
        e.mesh.userData.leftArm.rotation.x = -0.5 - swing;
        e.mesh.userData.rightArm.rotation.z = 0.4;
        e.mesh.userData.leftArm.rotation.z = -0.4;
      }

      // Атака ножом — только если рядом
      e.attackCD -= dt;
      if (dist < 2.5 && e.attackCD <= 0) {
        hp -= e.dmg;
        e.attackCD = e.isBoss ? 0.6 : 1.0;
        updateHUD();
        flashScreen(0xff0000, 0.28);
        showDamage();
        sfx.hurt();
        if (hp <= 0) { hp = 0; updateHUD(); endGame(); }
      }
    }

    // ============ ВОЛНЫ ============
    waveTimer -= dt;
    if (waveState === 'preparing') {
      updateHUD();
      if (waveTimer <= 0) {
        waveState = 'fighting';
        const count = 4 + wave * 2;
        for (let i = 0; i < count; i++) {
          setTimeout(() => { if (!gameOver) spawnRandomEnemy(); }, i * 250);
        }
        if (wave % 5 === 0) {
          setTimeout(() => {
            if (!gameOver) {
              const angle = Math.random() * Math.PI * 2;
              const x = player.position.x + Math.cos(angle) * 35;
              const z = player.position.z + Math.sin(angle) * 35;
              spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z), true);
            }
          }, count * 250 + 500);
        }
      }
    } else if (waveState === 'fighting') {
      updateHUD();
      spawnTimer += dt;
      if (spawnTimer > 6 && enemies.length < 4 + wave) {
        spawnRandomEnemy();
        spawnTimer = 0;
      }
      if (Math.random() < 0.005 && enemies.length > 0 && powerups.length < 3) {
        const e = enemies[Math.floor(Math.random() * enemies.length)];
        spawnPowerup(e.mesh.position.clone(), Math.random() < 0.6 ? 'health' : 'energy');
      }
      if (enemies.length === 0 && waveTimer < -2) {
        waveState = 'cleared';
        waveTimer = 3;
      }
    } else if (waveState === 'cleared') {
      updateHUD();
      if (waveTimer <= 0) {
        wave++;
        waveState = 'preparing';
        waveTimer = 5;
        hp = Math.min(100, hp + 20);
        updateHUD();
      }
    }

    // ============ БОНУСЫ ============
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.hover += dt * 3;
      p.mesh.position.y = 1.5 + Math.sin(p.hover) * 0.35;
      p.mesh.rotation.y += dt * 2;
      p.life -= dt;
      const d = player.position.distanceTo(p.mesh.position);
      if (d < 1.6) {
        if (p.type === 'health') { hp = Math.min(100, hp + 30); flashScreen(0x00ff88, 0.15); }
        else { energy = Math.min(100, energy + 50); flashScreen(0xffaa00, 0.15); }
        updateHUD();
        sfx.pickup();
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      }
    }

    updateMines(dt);

    // ============ ПАРТИКЛЫ ============
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      if (p.mesh.material && p.mesh.material.opacity !== undefined) {
        p.mesh.material.opacity = p.life / p.maxLife;
        p.mesh.material.transparent = true;
      }
      if (p.life <= 0) {
        scene.remove(p.mesh);
        particles.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  waveState = 'preparing';
  waveTimer = 4;
  updateHUD();
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
