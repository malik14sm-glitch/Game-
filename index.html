<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON HUNTER v3.0 // Cyberpunk Shooter</title>
<style>
  * { box-sizing: border-box; margin:0; padding:0; }
  body { overflow:hidden; background:#000; font-family: 'Courier New', monospace; cursor:none; }
  canvas { display:block; }

  #hud {
    position:fixed; top:15px; left:15px; color:#0ff; font-size:15px;
    text-shadow:0 0 10px #0ff; pointer-events:none; z-index:10;
  }
  #hud div { margin:5px 0; }
  .bar { width:240px; height:16px; border:1px solid #0ff; background:rgba(0,0,0,0.7); position:relative; overflow:hidden; }
  .bar > div { height:100%; transition:width 0.12s linear; }
  #hpFill { background:linear-gradient(90deg,#f0f,#0ff); width:100%; box-shadow:0 0 12px #0ff; }
  #enFill { background:linear-gradient(90deg,#ff0,#f80); width:0%; box-shadow:0 0 12px #f80; }
  #score, #kills, #wave { font-size:16px; letter-spacing:1px; }

  #crosshair {
    position:fixed; pointer-events:none; z-index:12;
    width:30px; height:30px; transform:translate(-50%,-50%);
    transition:transform 0.05s;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#0ff;
    box-shadow:0 0 10px #0ff, 0 0 20px #0ff;
  }
  #crosshair::before { left:14px; top:0; width:2px; height:30px; }
  #crosshair::after { top:14px; left:0; height:2px; width:30px; }
  #crosshair .dot {
    position:absolute; left:13px; top:13px; width:4px; height:4px;
    background:#f0f; border-radius:50%; box-shadow:0 0 10px #f0f;
  }

  #info {
    position:fixed; bottom:15px; left:50%; transform:translateX(-50%);
    color:#0ff; text-shadow:0 0 8px #0ff; font-size:12px; z-index:10;
    background:rgba(0,0,0,0.7); padding:8px 18px; border:1px solid #0ff;
    border-radius:4px; text-align:center; letter-spacing:1px;
  }

  #waveInfo {
    position:fixed; top:15px; right:15px; color:#f0f; font-size:16px;
    text-shadow:0 0 12px #f0f; text-align:right; z-index:10;
    background:rgba(0,0,0,0.5); padding:10px 16px; border:1px solid #f0f;
    border-radius:4px; min-width:180px;
  }

  #menu {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, #1a0033, #0a0018, #000);
    z-index:500; flex-direction:column;
  }
  #menu h1 {
    color:#f0f; font-size:76px; text-shadow:0 0 40px #f0f, 0 0 80px #f0f;
    letter-spacing:10px; margin-bottom:10px; animation:pulse 2s infinite;
  }
  #menu h2 {
    color:#0ff; font-size:16px; text-shadow:0 0 12px #0ff;
    letter-spacing:6px; margin-bottom:50px;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 30px #f0f, 0 0 60px #f0f; }
    50% { text-shadow: 0 0 60px #f0f, 0 0 120px #f0f, 0 0 160px #0ff; }
  }
  .btn {
    padding:16px 50px; margin:8px; font-size:18px; letter-spacing:4px;
    background:transparent; color:#0ff; border:2px solid #0ff;
    cursor:pointer; font-family:inherit; text-shadow:0 0 10px #0ff;
    box-shadow:0 0 20px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
    transition:all 0.3s; border-radius:4px; min-width:280px;
  }
  .btn:hover {
    background:#0ff; color:#000; text-shadow:none;
    box-shadow:0 0 40px #0ff, 0 0 80px #0ff;
    transform:scale(1.05);
  }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#0ff; font-size:22px; z-index:600; flex-direction:column;
    letter-spacing:3px;
  }
  #loading .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.2; } }
  #err {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#200; color:#f66; font-size:14px; z-index:700; padding:40px;
    white-space:pre-wrap; overflow:auto; font-family:monospace; text-align:left;
  }
  #gameover {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.92); color:#f0f; font-size:56px;
    text-shadow:0 0 30px #f0f; z-index:100; flex-direction:column;
  }
  .hitmark {
    position:fixed; pointer-events:none; color:#f00; font-size:28px;
    font-weight:bold; z-index:20; text-shadow:0 0 12px #f00;
    animation: hitFade 0.4s forwards;
  }
  @keyframes hitFade {
    0% { opacity:1; transform:scale(0.8); }
    100% { opacity:0; transform:scale(1.6); }
  }
  #damageOverlay {
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(255,0,0,0.6) 100%);
    opacity:0; transition:opacity 0.2s;
  }
  .killfeed {
    position:fixed; top:120px; right:15px; color:#0ff; font-size:13px;
    text-shadow:0 0 8px #0ff; z-index:10; text-align:right;
    background:rgba(0,0,0,0.4); padding:4px 10px; border-radius:3px;
  }
  .killfeed div { margin:3px 0; animation: slideIn 0.3s; }
  @keyframes slideIn {
    from { transform: translateX(30px); opacity:0; }
    to { transform: translateX(0); opacity:1; }
  }
  #lockHint {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#0ff; text-shadow:0 0 20px #0ff; font-size:22px;
    background:rgba(0,0,0,0.85); padding:20px 40px; border:2px solid #0ff;
    border-radius:8px; z-index:400; display:none; text-align:center;
    letter-spacing:2px; cursor:pointer;
  }
</style>
</head>
<body>

<div id="loading">ЗАГРУЗКА СИСТЕМЫ<span class="dot">...</span></div>
<div id="err"></div>
<div id="damageOverlay"></div>

<div id="menu">
  <h1>NEON HUNTER</h1>
  <h2>CYBERPUNK SHOOTER v3.0</h2>
  <button class="btn" id="btnPlay">▶  ИГРАТЬ</button>
  <button class="btn" id="btnHelp">?  УПРАВЛЕНИЕ</button>
  <button class="btn" id="btnSettings">⚙  НАСТРОЙКИ</button>
</div>

<div id="lockHint">🖱 КЛИКНИ СЮДА<br><small style="font-size:14px;">чтобы захватить мышь</small></div>

<div id="hud" style="display:none;">
  <div>HP: <div class="bar"><div id="hpFill"></div></div></div>
  <div>ENERGY: <div class="bar"><div id="enFill"></div></div></div>
  <div id="score">SCORE: 0</div>
  <div id="kills">KILLS: 0</div>
  <div id="wave">WAVE: 1</div>
</div>
<div id="waveInfo" style="display:none;"></div>
<div id="crosshair" style="display:none;"><div class="dot"></div></div>
<div id="info" style="display:none;">
  WASD — движение | SHIFT — бег | SPACE — прыжок (x2) | ЛКМ — лазер | ПКМ (держать) — мега-лазер | E — мина | ESC — пауза
</div>
<div id="gameover">
  СИСТЕМА УНИЧТОЖЕНА
  <div style="font-size:22px; color:#0ff; margin-top:20px;" id="finalScore"></div>
  <small style="font-size:16px; color:#f0f; margin-top:20px;">F5 — перезапуск</small>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ============== ЗАЩИТА ==============
window.addEventListener('error', function(e) {
  const err = document.getElementById('err');
  err.style.display = 'flex';
  err.textContent = 'ОШИБКА:\n' + e.message + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
});

// ============== АУДИО ==============
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfx = {
  laser: () => playSound(880, 0.08, 'sawtooth', 0.06),
  mega: () => { playSound(180, 0.5, 'sawtooth', 0.14); playSound(400, 0.4, 'square', 0.08); },
  explode: () => playSound(70, 0.35, 'sawtooth', 0.14),
  hit: () => playSound(1400, 0.04, 'square', 0.04),
  hurt: () => playSound(160, 0.2, 'sawtooth', 0.1),
  pickup: () => playSound(1600, 0.15, 'sine', 0.09),
  jump: () => playSound(600, 0.1, 'sine', 0.05),
  mine: () => playSound(300, 0.12, 'square', 0.05),
};

// ============== ПРОВЕРКА ==============
window.addEventListener('load', () => {
  setTimeout(() => {
    if (typeof THREE === 'undefined') {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('err');
      err.style.display = 'flex';
      err.textContent = '❌ Three.js не загрузился.\n\nОткрой через Firefox или через локальный сервер (python -m http.server), или загрузи на GitHub Pages.';
      return;
    }
    initMenu();
  }, 500);
});

function initMenu() {
  document.getElementById('loading').style.display = 'none';

  document.getElementById('btnPlay').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('info').style.display = 'block';
    document.getElementById('waveInfo').style.display = 'block';
    initAudio();
    startGame();
  });

  document.getElementById('btnHelp').addEventListener('click', () => {
    alert('УПРАВЛЕНИЕ v3.0:\n\n🖱 МЫШЬ — поворот камеры\n🖱 КОЛЕСО — приближение\nЛКМ — золотой лазер\nПКМ (держать) — зарядить мега-лазер\nWASD — движение\nSHIFT — бег\nSPACE — прыжок (двойной!)\nE — поставить мину\nESC — освободить мышь\n\nЦЕЛЬ:\nВыживай против волн роботов.\nКаждые 5 волн — БОСС.');
  });

  document.getElementById('btnSettings').addEventListener('click', () => {
    alert('НАСТРОЙКИ:\n\n(в разработке)');
  });
}

// ============================================================
// ОСНОВНАЯ ИГРА — ЧАСТЬ 2 ИДЁТ НИЖЕ (вставится сюда)
// ============================================================
// ============================================================
// ЧАСТЬ 2 — ОСНОВНАЯ ИГРА
// ============================================================

let gameStarted = false;
function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  mainGame();
}

function mainGame() {

  // ============================================================
  // СЦЕНА / РЕНДЕР / ТУМАН
  // ============================================================
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x03000a);
  scene.fog = new THREE.FogExp2(0x0a0018, 0.012);

  const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.body.appendChild(renderer.domElement);

  // ============================================================
  // СВЕТ
  // ============================================================
  scene.add(new THREE.AmbientLight(0x220044, 0.6));
  const moon = new THREE.DirectionalLight(0x6644ff, 1.1);
  moon.position.set(40, 80, 30);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -100;
  moon.shadow.camera.right = 100;
  moon.shadow.camera.top = 100;
  moon.shadow.camera.bottom = -100;
  moon.shadow.camera.far = 250;
  scene.add(moon);

  const neonColors = [0xff00ff, 0x00ffff, 0xff0066, 0x00ff88, 0xffaa00, 0xff3300, 0xaa00ff, 0x00ffaa];

  // Много неоновых огней по городу
  const cityLights = [];
  for (let i = 0; i < 24; i++) {
    const l = new THREE.PointLight(neonColors[i % neonColors.length], 3.5, 50);
    l.position.set((Math.random()-0.5)*160, 6 + Math.random()*20, (Math.random()-0.5)*160);
    scene.add(l);
    cityLights.push({ light: l, base: 3.5, phase: Math.random() * Math.PI * 2 });
  }

  // ============================================================
  // ЗЕМЛЯ
  // ============================================================
  const groundGeo = new THREE.PlaneGeometry(200, 200, 80, 80);
  const posAttr = groundGeo.attributes.position;
  // легкие неровности
  for (let i = 0; i < posAttr.count; i++) {
    const x = posAttr.getX(i), y = posAttr.getY(i);
    const dist = Math.sqrt(x*x + y*y);
    if (dist > 8) {
      posAttr.setZ(i, (Math.sin(x*0.15)*Math.cos(y*0.15)) * 0.15);
    }
  }
  groundGeo.computeVertexNormals();

  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x080012, roughness: 0.55, metalness: 0.75,
    emissive: 0x110033, emissiveIntensity: 0.4
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(200, 100, 0xff00ff, 0x00ffff);
  grid.position.y = 0.02;
  grid.material.opacity = 0.35;
  grid.material.transparent = true;
  scene.add(grid);

  // ============================================================
  // ГОРОД 40x40
  // ============================================================
  const CITY_SIZE = 40;
  const CELL = 5;
  const buildingColliders = [];

  const buildMats = [
    new THREE.MeshStandardMaterial({ color:0x1a1a2e, metalness:0.85, roughness:0.3, emissive:0x220044, emissiveIntensity:0.35 }),
    new THREE.MeshStandardMaterial({ color:0x16213e, metalness:0.9, roughness:0.25, emissive:0x004466, emissiveIntensity:0.35 }),
    new THREE.MeshStandardMaterial({ color:0x0f0f1e, metalness:0.92, roughness:0.2, emissive:0x440022, emissiveIntensity:0.35 }),
    new THREE.MeshStandardMaterial({ color:0x2a1a3e, metalness:0.8, roughness:0.32, emissive:0x004444, emissiveIntensity:0.3 }),
    new THREE.MeshStandardMaterial({ color:0x1e1030, metalness:0.88, roughness:0.28, emissive:0x330066, emissiveIntensity:0.4 }),
  ];

  function createBillboard(x, y, z, rotY, color, w, h) {
    w = w || 4.5; h = h || 2.6;
    const g = new THREE.Group();
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(w+0.4, h+0.4, 0.25),
      new THREE.MeshStandardMaterial({ color:0x000000, emissive:color, emissiveIntensity:2.2 })
    );
    g.add(frame);
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.92 })
    );
    screen.position.z = 0.14;
    g.add(screen);
    // "японские иероглифы" — вертикальные штрихи
    const rows = 3, cols = Math.floor(w / 0.55);
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.35) continue;
        const sw = 0.15 + Math.random() * 0.25;
        const sh = 0.1 + Math.random() * 0.35;
        const strip = new THREE.Mesh(
          new THREE.PlaneGeometry(sw, sh),
          new THREE.MeshBasicMaterial({ color: 0xffffff, transparent:true, opacity:0.9 })
        );
        strip.position.set(-w/2 + 0.4 + c*0.55, -h/2 + 0.4 + r*0.7, 0.15);
        g.add(strip);
      }
    }
    g.position.set(x, y, z);
    g.rotation.y = rotY;
    scene.add(g);
  }

  function makeBuilding(x, z) {
    const w = 2.8 + Math.random() * 1.6;
    const d = 2.8 + Math.random() * 1.6;
    const h = 5 + Math.random() * 26;
    const mat = buildMats[Math.floor(Math.random() * buildMats.length)];
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    b.position.set(x, h/2, z);
    b.castShadow = true; b.receiveShadow = true;
    scene.add(b);

    buildingColliders.push({ x, z, w: w/2 + 0.4, d: d/2 + 0.4 });

    // неоновая кромка сверху
    const edgeColor = neonColors[Math.floor(Math.random()*neonColors.length)];
    const edge = new THREE.Mesh(
      new THREE.BoxGeometry(w+0.06, 0.18, d+0.06),
      new THREE.MeshBasicMaterial({ color: edgeColor })
    );
    edge.position.set(x, h + 0.06, z);
    scene.add(edge);

    // Вертикальные неоновые полосы
    const stripCount = Math.floor(Math.random() * 3) + 1;
    for (let s = 0; s < stripCount; s++) {
      const sc = neonColors[Math.floor(Math.random()*neonColors.length)];
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, h * (0.5 + Math.random()*0.4), 0.06),
        new THREE.MeshBasicMaterial({ color: sc })
      );
      const side = Math.floor(Math.random() * 4);
      let sx = x, sz = z;
      if (side === 0) { sx = x + w/2 + 0.04; }
      else if (side === 1) { sx = x - w/2 - 0.04; }
      else if (side === 2) { sz = z + d/2 + 0.04; }
      else { sz = z - d/2 - 0.04; }
      strip.position.set(sx, h/2, sz);
      scene.add(strip);
    }

    // Окна (светящиеся точки на гранях)
    const winCount = Math.floor(h / 2);
    for (let i = 0; i < winCount; i++) {
      if (Math.random() < 0.4) continue;
      const face = Math.floor(Math.random() * 4);
      const wc = Math.random() < 0.7 ? 0xffaa44 : (Math.random() < 0.5 ? 0x00ffff : 0xff00ff);
      const win = new THREE.Mesh(
        new THREE.PlaneGeometry(0.35 + Math.random()*0.3, 0.25),
        new THREE.MeshBasicMaterial({ color: wc })
      );
      const wy = 2 + i * 1.8;
      if (face === 0) win.position.set(x + w/2 + 0.02, wy, z + (Math.random()-0.5)*d*0.5);
      else if (face === 1) { win.position.set(x - w/2 - 0.02, wy, z + (Math.random()-0.5)*d*0.5); win.rotation.y = Math.PI; }
      else if (face === 2) { win.position.set(x + (Math.random()-0.5)*w*0.5, wy, z + d/2 + 0.02); }
      else { win.position.set(x + (Math.random()-0.5)*w*0.5, wy, z - d/2 - 0.02); win.rotation.y = Math.PI; }
      scene.add(win);
    }

    // Билборд
    if (h > 12 && Math.random() < 0.75) {
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      const side = Math.random() < 0.5 ? 1 : -1;
      createBillboard(x, h - 2.5, z + side * (d/2 + 0.25), side > 0 ? 0 : Math.PI, col);
    }
    // Большой билборд на крыше
    if (h > 20 && Math.random() < 0.4) {
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      createBillboard(x, h + 2, z, Math.random() * Math.PI * 2, col, 5, 3);
    }
  }

  (function generateCity() {
    const half = (CITY_SIZE * CELL) / 2;
    for (let ix = 0; ix < CITY_SIZE; ix++) {
      for (let iz = 0; iz < CITY_SIZE; iz++) {
        // пустая площадь в центре
        if (Math.abs(ix - CITY_SIZE/2) < 3 && Math.abs(iz - CITY_SIZE/2) < 3) continue;
        if (Math.random() < 0.32) continue;
        // Проспекты — каждые 8 клеток
        if (ix % 8 === 4 || iz % 8 === 4) continue;
        const x = ix * CELL - half + CELL/2;
        const z = iz * CELL - half + CELL/2;
        makeBuilding(x, z);
      }
    }
  })();

  // ============================================================
  // ПЕРСОНАЖ — ДЕТАЛЬНЫЙ КИБОРГ
  // ============================================================
  const player = new THREE.Group();
  player.position.set(0, 0, 0);

  // Материалы
  const matBodyDark = new THREE.MeshStandardMaterial({ color:0x12121e, metalness:0.95, roughness:0.25, emissive:0x001a33, emissiveIntensity:0.2 });
  const matBodyMid = new THREE.MeshStandardMaterial({ color:0x1e1e30, metalness:0.9, roughness:0.3, emissive:0x000022, emissiveIntensity:0.15 });
  const matArmor = new THREE.MeshStandardMaterial({ color:0x0a0a14, metalness:1.0, roughness:0.15, emissive:0x00ffff, emissiveIntensity:0.12 });
  const matGlowCyan = new THREE.MeshBasicMaterial({ color:0x00ffff });
  const matGlowPink = new THREE.MeshBasicMaterial({ color:0xff00ff });
  const matGlowGold = new THREE.MeshBasicMaterial({ color:0xffcc00 });
  const matGlowOrange = new THREE.MeshBasicMaterial({ color:0xff8800 });

  // === ТАЗ ===
  const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.32, 0.34), matBodyMid);
  pelvis.position.y = 0.88;
  pelvis.castShadow = true;
  player.add(pelvis);

  // === ТОРС ===
  const torso = new THREE.Group();
  torso.position.y = 1.2;
  player.add(torso);

  // Основной корпус
  const chestMain = new THREE.Mesh(new THREE.BoxGeometry(0.68, 0.85, 0.42), matBodyMid);
  chestMain.castShadow = true;
  torso.add(chestMain);

  // Броневые пластины спереди
  const chestPlate1 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.28, 0.08), matArmor);
  chestPlate1.position.set(0, 0.2, 0.23);
  torso.add(chestPlate1);

  let yaw = 0;       // горизонтальный поворот камеры
  let pitch = 0.3;   // вертикальный угол
  const PITCH_MIN = -0.2;
  const PITCH_MAX = 1.1;
  let cameraDistance = 6.5;
  let isLocked = false;

  const lockHint = document.getElementById('lockHint');

  function requestLock() {
    if (renderer.domElement.requestPointerLock) {
      renderer.domElement.requestPointerLock();
    }
  }

  document.addEventListener('pointerlockchange', () => {
    isLocked = document.pointerLockElement === renderer.domElement;
    lockHint.style.display = isLocked ? 'none' : 'block';
  });

  renderer.domElement.addEventListener('click', () => {
    if (!isLocked) requestLock();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isLocked) return;
    const sens = 0.0022;
    yaw -= e.movementX * sens;
    pitch += e.movementY * sens;
    pitch = Math.max(PITCH_MIN, Math.min(PITCH_MAX, pitch));
  });

        thigh.position.set(s * 0.35*scale, 0.5*scale, 0);
        thigh.castShadow = true;
        group.add(thigh);
        const shin = new THREE.Mesh(new THREE.BoxGeometry(0.4*scale, 0.55*scale, 0.45*scale), mDark);
        shin.position.set(s * 0.35*scale, -0.1*scale, 0);
        shin.castShadow = true;
        group.add(shin);
        const foot = new THREE.Mesh(new THREE.BoxGeometry(0.5*scale, 0.2*scale, 0.7*scale), mBody);
        foot.position.set(s * 0.35*scale, -0.42*scale, 0.05*scale);
        group.add(foot);
      }
    } else {
      // Дрон — летающий
      const body = new THREE.Mesh(new THREE.SphereGeometry(0.5*scale, 14, 14), mBody);
      body.position.y = 1.6*scale;
      body.castShadow = true;
      group.add(body);

      // Кольцо
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.7*scale, 0.08*scale, 8, 24),
        mDark
      );
      ring.rotation.x = Math.PI / 2;
      ring.position.y = 1.6*scale;
      group.add(ring);

      // Светящиеся части
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07*scale, 8, 8), mEye);
      eyeL.position.set(-0.2*scale, 1.6*scale, 0.5*scale);
      group.add(eyeL);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.2 * scale;
      group.add(eyeR);

      // Плазменное кольцо вокруг
      const outerRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.9*scale, 0.04*scale, 6, 24),
        mAcc
      );
      outerRing.rotation.x = Math.PI / 2;
      outerRing.position.y = 1.6*scale;
      group.add(outerRing);

      // Антенны-щупальца
      for (let i = 0; i < 4; i++) {
        const t = new THREE.Mesh(new THREE.CylinderGeometry(0.02*scale, 0.02*scale, 0.5*scale, 6), mDark);
        const a = i * Math.PI / 2;
        t.position.set(Math.cos(a)*0.6*scale, 1.2*scale, Math.sin(a)*0.6*scale);
        group.add(t);
        const tt = new THREE.Mesh(new THREE.SphereGeometry(0.05*scale, 8, 8), mAcc);
        tt.position.set(Math.cos(a)*0.6*scale, 0.95*scale, Math.sin(a)*0.6*scale);
        group.add(tt);
      }
      group.userData.isDrone = true;
    }

    if (isBoss) {
      // Босс — корона и ореол
      const crown = new THREE.Mesh(
        new THREE.TorusGeometry(0.7*scale, 0.08, 8, 20),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      crown.rotation.x = Math.PI / 2;
      crown.position.y = 3.2 * scale;
      group.add(crown);
      group.userData.crown = crown;
    }

    return group;
  }

  function spawnEnemy(idx, pos, isBoss) {
    const style = robotStyles[idx % robotStyles.length];
    const mesh = createRobot(style, isBoss);
    mesh.position.copy(pos);
    scene.add(mesh);
    const e = {
      mesh, style,
      hp: style.hp * (isBoss ? 12 : 1),
      maxHp: style.hp * (isBoss ? 12 : 1),
      speed: style.speed * (isBoss ? 0.6 : 1),
      dmg: style.dmg * (isBoss ? 2 : 1),
      attackCD: 0, shootCD: 0,
      hover: Math.random() * Math.PI * 2,
      isBoss: !!isBoss,
      walkPhase: Math.random() * Math.PI * 2,
    };
    enemies.push(e);
    return e;
  }

  // ============================================================
  // ЛАЗЕРЫ
  // ============================================================
  const lasers = [];
  const particles = [];
  const enemyProjectiles = [];

  function fireLaser(origin, direction, isMega) {
    isMega = !!isMega;
    const len = isMega ? 100 : 40;
    const thick = isMega ? 1.4 : 0.16;
    const geo = new THREE.CylinderGeometry(thick, thick, len, 10);
    geo.rotateX(Math.PI / 2);
    const mat = new THREE.MeshBasicMaterial({
      color: isMega ? 0xffffff : 0xffdd44,
      transparent: true, opacity: 0.95
    });
    const beam = new THREE.Mesh(geo, mat);
    beam.position.copy(origin);
    const q = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0,0,1), direction.clone().normalize()
    );
    beam.quaternion.copy(q);
    beam.position.add(direction.clone().normalize().multiplyScalar(len / 2));

    const glowGeo = new THREE.CylinderGeometry(thick*2.8, thick*2.8, len, 10);
    glowGeo.rotateX(Math.PI / 2);
    const glowMat = new THREE.MeshBasicMaterial({
      color: isMega ? 0xff88ff : 0xffaa00,
      transparent: true, opacity: 0.35
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.copy(beam.position);
    glow.quaternion.copy(q);

    scene.add(beam); scene.add(glow);
    lasers.push({ beam, glow, life: isMega ? 0.4 : 0.18, maxLife: isMega ? 0.4 : 0.18 });

    // попадания
    for (const e of enemies) {
      const toE = e.mesh.position.clone().sub(origin);
      toE.y += 1.2;
      const dist = toE.dot(direction);
      if (dist < 0 || dist > len) continue;
      const closest = origin.clone().add(direction.clone().multiplyScalar(dist));
      const perp = closest.distanceTo(e.mesh.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
      const hitRadius = (e.isBoss ? 1.8 : 1.0) + (isMega ? 1.5 : 0.3);
      if (perp < hitRadius) {
        damageEnemy(e, isMega ? 250 : 18);
      }
    }

    isMega ? sfx.mega() : sfx.laser();
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)), e.style.acc);
    showHitmark();
    sfx.hit();
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    scene.remove(e.mesh);
    const i = enemies.indexOf(e);
    if (i >= 0) enemies.splice(i, 1);
    score += (10 + e.maxHp) * (e.isBoss ? 5 : 1);
    kills++;
    updateHUD();
    addKillFeed(e.style.name + (e.isBoss ? ' [BOSS]' : ''));
    sfx.explode();
    const c = e.style.acc;
    const count = e.isBoss ? 80 : 25;
    for (let j = 0; j < count; j++) {
      spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0,1,0)), c);
    }
  }

  function spawnHitParticles(pos, color) {
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 4, 4),
        new THREE.MeshBasicMaterial({ color, transparent: true })
      );
      p.position.copy(pos);
      const vel = new THREE.Vector3(
        (Math.random()-0.5)*5, Math.random()*3.5, (Math.random()-0.5)*5
      );
      scene.add(p);
      particles.push({ mesh: p, vel, life: 0.7, maxLife: 0.7 });
    }
  }

  // ============================================================
  // БОНУСЫ
  // ============================================================
  const powerups = [];
  function spawnPowerup(pos, type) {
    const color = type === 'health' ? 0x00ff88 : 0xffaa00;
    const geo = type === 'health'
      ? new THREE.BoxGeometry(0.55, 0.55, 0.55)
      : new THREE.OctahedronGeometry(0.45);
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos);
    p.position.y = 1;
    scene.add(p);
    const glow = new THREE.PointLight(color, 3, 8);
    p.add(glow);
    powerups.push({ mesh: p, type, hover: Math.random() * 6, life: 25 });
  }

  // ============================================================
  // МИНЫ
  // ============================================================
  const mines = [];
  let mineCooldown = 0;

  function placeMine() {
    if (mineCooldown > 0) return;
    mineCooldown = 3;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    m.position.copy(player.position);
    m.position.y = 0.4;
    scene.add(m);
    const light = new THREE.PointLight(0xff0000, 3, 5);
    m.add(light);
    mines.push({ mesh: m, life: 18, blink: 0 });
    sfx.mine();
  }

  function updateMines(dt) {
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      m.life -= dt;
      m.blink += dt;
      m.mesh.material.color.setHex(Math.sin(m.blink * 12) > 0 ? 0xff0000 : 0x440000);
      m.mesh.scale.setScalar(1 + Math.sin(m.blink * 12) * 0.15);
      for (const e of enemies) {
        const d = e.mesh.position.distanceTo(m.mesh.position);
        if (d < 3.5) {
          for (let j = 0; j < 20; j++) spawnHitParticles(m.mesh.position, 0xff8800);
          for (const e2 of enemies) {
            if (e2.mesh.position.distanceTo(m.mesh.position) < 4.5) {
              damageEnemy(e2, e2.isBoss ? 60 : 120);
            }
          }
          sfx.explode();
          flashScreen(0xff4400, 0.25);
          scene.remove(m.mesh);
          mines.splice(i, 1);
          break;
        }
      }
      if (m.life <= 0) {
        scene.remove(m.mesh);
        mines.splice(i, 1);
      }
    }
  }

  // ============================================================
  // СНАРЯДЫ ВРАГОВ
  // ============================================================
  function enemyShoot(origin, target) {
    const dir = target.clone().sub(origin).normalize();
    const proj = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    proj.position.copy(origin);
    const light = new THREE.PointLight(0xff0000, 2, 4);
    proj.add(light);
    scene.add(proj);
    enemyProjectiles.push({ mesh: proj, dir, speed: 16, life: 4 });
  }

  function updateEnemyProjectiles(dt) {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const p = enemyProjectiles[i];
      p.life -= dt;
      p.mesh.position.addScaledVector(p.dir, p.speed * dt);
      const d = p.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0, 1, 0)));
      if (d < 1.2) {
        hp -= 10;
        flashScreen(0xff0000, 0.3);
        showDamage();
        sfx.hurt();
        updateHUD();
        if (hp <= 0) endGame();
        scene.remove(p.mesh);
        enemyProjectiles.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        enemyProjectiles.splice(i, 1);
      }
    }
  }

  // ============================================================
  // HUD
  // ============================================================
  let hp = 100;
  let energy = 0;
  let charging = false;
  let chargeTime = 0;
  let score = 0, kills = 0;
  let wave = 1;
  let waveTimer = 0;
  let waveState = 'preparing';
  let gameOver = false;
  let velocityY = 0;
  let onGround = true;
  let jumpCount = 0;
  let shootCooldown = 0;

  const hpFill = document.getElementById('hpFill');
  const enFill = document.getElementById('enFill');
  const scoreEl = document.getElementById('score');
  const killsEl = document.getElementById('kills');
  const waveEl = document.getElementById('wave');
  const waveInfoEl = document.getElementById('waveInfo');
  const gameoverEl = document.getElementById('gameover');
  const damageOverlay = document.getElementById('damageOverlay');
  const killFeed = document.createElement('div');
  killFeed.className = 'killfeed';
  document.body.appendChild(killFeed);

  function updateHUD() {
    hpFill.style.width = Math.max(0, hp) + '%';
    enFill.style.width = energy + '%';
    scoreEl.textContent = 'SCORE: ' + score;
    killsEl.textContent = 'KILLS: ' + kills;
    waveEl.textContent = 'WAVE: ' + wave;
    if (waveState === 'preparing') {
      waveInfoEl.innerHTML = 'ВОЛНА ' + wave + ' ЧЕРЕЗ<br><span style="font-size:36px;color:#0ff;">' + Math.ceil(waveTimer) + '</span>';
    } else if (waveState === 'cleared') {
      waveInfoEl.innerHTML = '<span style="color:#0ff;">ВОЛНА ЗАЧИЩЕНА!</span>';
    } else {
      waveInfoEl.textContent = 'ВРАГОВ: ' + enemies.length;
    }
  }

  function addKillFeed(name) {
    const div = document.createElement('div');
    div.textContent = '✖ ' + name;
    killFeed.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function showHitmark() {
    const hm = document.createElement('div');
    hm.className = 'hitmark';
    hm.textContent = '✕';
    hm.style.left = 'calc(50% + 18px)';
    hm.style.top = 'calc(50% - 18px)';
    document.body.appendChild(hm);
    setTimeout(() => hm.remove(), 400);
  }

  function showDamage() {
    damageOverlay.style.opacity = '1';
    setTimeout(() => { damageOverlay.style.opacity = '0'; }, 180);
  }

  function flashScreen(color, alpha) {
    const div = document.createElement('div');
    const r = (color>>16)&255, g = (color>>8)&255, b = color&255;
    div.style.cssText = 'position:fixed;inset:0;background:rgba('+r+','+g+','+b+','+alpha+');pointer-events:none;z-index:50;transition:opacity 0.4s;';
    document.body.appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; }, 30);
    setTimeout(() => div.remove(), 500);
  }

  function endGame() {
    gameOver = true;
    document.getElementById('finalScore').textContent = 'SCORE: ' + score + ' | KILLS: ' + kills + ' | WAVE: ' + wave;
    gameoverEl.style.display = 'flex';
    if (document.exitPointerLock) document.exitPointerLock();
  }

  // ============================================================
  // МЫШЬ
  // ============================================================
  let mouseDownL = false, mouseDownR = false;
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 0) mouseDownL = true;
    if (e.button === 2) mouseDownR = true;
  });
  renderer.domElement.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDownL = false;
    if (e.button === 2) {
      if (charging && chargeTime > 1.2) releaseMegaLaser();
      mouseDownR = false;
      charging = false;
    }
  });
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  function getAimDirection() {
    // Луч из камеры в центр экрана (курсор)
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    return dir.normalize();
  }

  function releaseMegaLaser() {
    const origin = player.position.clone();
    origin.y += 1.8;
    const dir = getAimDirection();
    fireLaser(origin, dir, true);
    player.position.add(dir.clone().multiplyScalar(-1.5));
    flashScreen(0xff00ff, 0.4);
    energy = 0;
    chargeTime = 0;
    updateHUD();
  }

  // ============================================================
  // СПАВН
  // ============================================================
  function spawnRandomEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 30;
    const x = player.position.x + Math.cos(angle) * radius;
    const z = player.position.z + Math.sin(angle) * radius;
    spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z));
  }

  // ============================================================
  // ЦИКЛ
  // ============================================================
  const clock = new THREE.Clock();
  let camPosLerp = new THREE.Vector3(0, 5, 7);
  let camLookLerp = new THREE.Vector3(0, 1.5, 0);

  let spawnTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (gameOver) {
      renderer.render(scene, camera);
      return;
    }

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Мерцание городских огней
    for (const cl of cityLights) {
      cl.light.intensity = cl.base + Math.sin(t * 1.5 + cl.phase) * 1.5;
    }

    // ============ ДВИЖЕНИЕ ИГРОКА ============
    const moveDir = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp']) moveDir.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveDir.z += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

    const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
    const baseSpeed = isRunning ? 11 : 5.5;
    let isMoving = false;

    if (moveDir.lengthSq() > 0) {
      isMoving = true;
      moveDir.normalize();
      // направление движения относительно камеры
      const camFwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const camRight = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const worldMove = new THREE.Vector3()
        .addScaledVector(camFwd, -moveDir.z)
        .addScaledVector(camRight, moveDir.x)
        .normalize()
        .multiplyScalar(baseSpeed * dt);

      const newPos = player.position.clone().add(worldMove);
      let blocked = false;
      for (const c of buildingColliders) {
        if (Math.abs(newPos.x - c.x) < c.w && Math.abs(newPos.z - c.z) < c.d) {
          blocked = true; break;
        }
      }
      // границы мира
      if (Math.abs(newPos.x) > 95 || Math.abs(newPos.z) > 95) blocked = true;

      if (!blocked) {
        player.position.copy(newPos);
        // поворот тела игрока к камере
        player.rotation.y = yaw;
      }
    } else {
      // даже когда не двигаемся — тело смотрит куда камера
      player.rotation.y = yaw;
    }

    // Прыжок (двойной)
    if (keys['Space'] && !player.userData.jumpHeld) {
      if (onGround) {
        velocityY = 9; onGround = false; jumpCount = 1; sfx.jump();
      } else if (jumpCount < 2) {
        velocityY = 8.5; jumpCount = 2; sfx.jump();
      }
      player.userData.jumpHeld = true;
    }
    if (!keys['Space']) player.userData.jumpHeld = false;

    velocityY -= 25 * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 0) {
      player.position.y = 0; velocityY = 0; onGround = true; jumpCount = 0;
    }

    // Мина
    if (keys['KeyE'] && !player.userData.mineHeld) {
      placeMine();
      player.userData.mineHeld = true;
    }
    if (!keys['KeyE']) player.userData.mineHeld = false;
    mineCooldown -= dt;

    // ============ АНИМАЦИЯ ПЕРСОНАЖА ============
    const speedFactor = isMoving ? (isRunning ? 1.5 : 1) : 0;
    const walkCycle = Math.sin(t * 10) * speedFactor;
    const walkBob = Math.abs(Math.sin(t * 10)) * 0.06 * speedFactor;

    // Ноги
    legL.rotation.x = walkCycle * 0.7;
    legR.rotation.x = -walkCycle * 0.7;
    legL.userData.knee.rotation.x = Math.max(0, walkCycle) * 0.6;
    legR.userData.knee.rotation.x = Math.max(0, -walkCycle) * 0.6;

    // Руки (левая свободно, правая всегда целится вперёд)
    armL.rotation.x = -walkCycle * 0.5;
    armL.rotation.z = 0.1;
    armR.rotation.x = -Math.PI / 2 + 0.2 + Math.sin(t * 2) * 0.03;
    armR.rotation.z = -0.15;

    // Лёгкое покачивание тела
    torso.position.y = 1.2 + walkBob;
    torso.rotation.z = Math.sin(t * 10) * 0.03 * speedFactor;

    // Вращение кольца на груди
    coreRing.rotation.z += dt * 1.5;

    // Мигание антенны
    if (Math.random() < 0.02) {
      antennaTip.material = matGlowPink;
      setTimeout(() => { antennaTip.material = matGlowOrange; }, 100);
    }

    // ============ КАМЕРА (3-е лицо, орбита) ============
    const camTargetY = player.position.y + 1.7;
    const targetPos = new THREE.Vector3(player.position.x, camTargetY, player.position.z);

    // Позиция камеры относительно игрока
    const camOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * cameraDistance,
      Math.sin(pitch) * cameraDistance + 1.5,
      Math.cos(yaw) * Math.cos(pitch) * cameraDistance
    );
    const desiredCamPos = targetPos.clone().add(camOffset);

    // Плавное следование
    camPosLerp.lerp(desiredCamPos, 0.18);
    camLookLerp.lerp(targetPos, 0.25);
    camera.position.copy(camPosLerp);
    camera.lookAt(camLookLerp);

    // ============ СТРЕЛЬБА ============
    shootCooldown -= dt;
    if (mouseDownL && shootCooldown <= 0 && isLocked) {
      const origin = player.position.clone();
      origin.y += 1.5;
      // стреляем из позиции игрока, но в направлении взгляда камеры
      const dir = getAimDirection();
      fireLaser(origin, dir, false);
      shootCooldown = 0.14;
    }

    // Заряд
    if (mouseDownR && !charging && isLocked) { charging = true; chargeTime = 0; }
    if (charging) {
      chargeTime += dt;
      energy = Math.min(100, chargeTime * 60);
      updateHUD();
      const gi = Math.min(1, chargeTime / 1.5);
      // свечение имплантов
      if (armL.userData.elbow.children[2]) {
        armL.userData.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
      }
      if (armR.userData.elbow.children[2]) {
        armR.userData.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
      }
    } else {
      if (energy < 100) { energy = Math.min(100, energy + dt * 8); updateHUD(); }
    }

    // ============ ВРАГИ ============
    for (const e of enemies) {
      const toPlayer = player.position.clone().sub(e.mesh.position);
      toPlayer.y = 0;
      const dist = toPlayer.length();
      toPlayer.normalize();

      // анимация
      e.walkPhase += dt * 8;
      if (e.mesh.userData.isDrone) {
        e.hover += dt * 3;
        e.mesh.position.y = 1.6 + Math.sin(e.hover) * 0.3;
        e.mesh.rotation.y += dt * 1.5;
      } else if (e.isBoss) {
        e.hover += dt * 2;
        e.mesh.position.y = Math.sin(e.hover) * 0.15;
      }

      // движение
      if (dist > 2) {
        const speedMul = e.isBoss ? 0.6 : 1;
        e.mesh.position.addScaledVector(toPlayer, e.speed * speedMul * dt);
      }
      // поворот
      if (!e.mesh.userData.isDrone) {
        const targetRot = Math.atan2(toPlayer.x, toPlayer.z);
        e.mesh.rotation.y += (targetRot - e.mesh.rotation.y) * 0.15;
      }

      // анимация ходьбы
      if (!e.mesh.userData.isDrone && e.mesh.children) {
        // ищем ноги по индексам сложно, но руки/ноги — просто слегка качаем весь mesh
        e.mesh.position.y = Math.abs(Math.sin(e.walkPhase)) * 0.05;
      }

      // корона босса вращается
      if (e.mesh.userData.crown) {
        e.mesh.userData.crown.rotation.z += dt * 2;
      }

      // атака ближняя
      e.attackCD -= dt;
      if (dist < 2.5 && e.attackCD <= 0) {
        hp -= e.dmg;
        e.attackCD = e.isBoss ? 0.6 : 1.0;
        updateHUD();
        flashScreen(0xff0000, 0.25);
        showDamage();
        sfx.hurt();
        if (hp <= 0) { hp = 0; updateHUD(); endGame(); }
      }

      // стрельба дальняя
      e.shootCD -= dt;
      if (dist > 8 && dist < 35 && e.shootCD <= 0 && Math.random() < 0.02) {
        enemyShoot(
          e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)),
          player.position.clone().add(new THREE.Vector3(0, 1, 0))
        );
        e.shootCD = e.isBoss ? 1 : 2.5;
      }
    }

    // ============ ВОЛНЫ ============
    waveTimer -= dt;
    if (waveState === 'preparing') {
      updateHUD();
      if (waveTimer <= 0) {
        waveState = 'fighting';
        const count = 4 + wave * 2;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            if (!gameOver) spawnRandomEnemy();
          }, i * 250);
        }
        if (wave % 5 === 0) {
          setTimeout(() => {
            if (!gameOver) {
              const angle = Math.random() * Math.PI * 2;
              const x = player.position.x + Math.cos(angle) * 35;
              const z = player.position.z + Math.sin(angle) * 35;
              spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z), true);
            }
          }, count * 250 + 500);
        }
      }
    } else if (waveState === 'fighting') {
      updateHUD();
      spawnTimer += dt;
      if (spawnTimer > 6 && enemies.length < 4 + wave) {
        spawnRandomEnemy();
        spawnTimer = 0;
      }
      if (Math.random() < 0.005 && enemies.length > 0 && powerups.length < 3) {
        const e = enemies[Math.floor(Math.random() * enemies.length)];
        spawnPowerup(e.mesh.position.clone(), Math.random() < 0.6 ? 'health' : 'energy');
      }
      if (enemies.length === 0 && waveTimer < -2) {
        waveState = 'cleared';
        waveTimer = 3;
      }
    } else if (waveState === 'cleared') {
      updateHUD();
      if (waveTimer <= 0) {
        wave++;
        waveState = 'preparing';
        waveTimer = 5;
        hp = Math.min(100, hp + 20);
        updateHUD();
      }
    }

    // ============ БОНУСЫ ============
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.hover += dt * 3;
      p.mesh.position.y = 1 + Math.sin(p.hover) * 0.35;
      p.mesh.rotation.y += dt * 2;
      p.life -= dt;
      const d = player.position.distanceTo(p.mesh.position);
      if (d < 1.6) {
        if (p.type === 'health') { hp = Math.min(100, hp + 30); flashScreen(0x00ff88, 0.15); }
        else { energy = Math.min(100, energy + 50); flashScreen(0xffaa00, 0.15); }
        updateHUD();
        sfx.pickup();
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      }
    }

    updateMines(dt);
    updateEnemyProjectiles(dt);

    // ============ ЛАЗЕРЫ ============
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.life -= dt;
      const a = l.life / l.maxLife;
      l.beam.material.opacity = a;
      l.glow.material.opacity = a * 0.35;
      if (l.life <= 0) {
        scene.remove(l.beam); scene.remove(l.glow);
        l.beam.geometry.dispose(); l.beam.material.dispose();
        l.glow.geometry.dispose(); l.glow.material.dispose();
        lasers.splice(i, 1);
      }
    }

    // ============ ПАРТИКЛЫ ============
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      if (p.mesh.material && p.mesh.material.opacity !== undefined) {
        p.mesh.material.opacity = p.life / p.maxLife;
        p.mesh.material.transparent = true;
      }
      if (p.life <= 0) {
        scene.remove(p.mesh);
        particles.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  // старт
  waveState = 'preparing';
  waveTimer = 4;
  updateHUD();
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
</script>
</body>
</html>
