<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON HUNTER v6.1 // Cyberpunk Shooter</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #000; font-family: 'Courier New', monospace;
    color: #0ff; cursor: crosshair;
    user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; position: fixed; top: 0; left: 0; }

  #hud {
    position: fixed; top: 16px; left: 16px;
    font-size: 15px; letter-spacing: 1px;
    pointer-events: none; z-index: 10;
    text-shadow: 0 0 12px #0ff;
  }
  #hud > div { margin: 6px 0; }
  .bar {
    width: 260px; height: 18px;
    border: 1px solid #0ff; background: rgba(0,0,0,0.75);
    position: relative; overflow: hidden;
    box-shadow: 0 0 12px rgba(0,255,255,0.4);
  }
  .bar > div { height: 100%; transition: width 0.12s linear; }
  #hpFill { width: 100%; background: linear-gradient(90deg, #f0f, #0ff); box-shadow: 0 0 12px #0ff; }
  #enFill { width: 0%; background: linear-gradient(90deg, #ff0, #f80); box-shadow: 0 0 12px #f80; }
  #score, #kills, #wave { font-size: 16px; font-weight: bold; color: #0ff; }
  #wave { color: #f0f; text-shadow: 0 0 12px #f0f; }

  #crosshair {
    position: fixed;
    width: 32px; height: 32px;
    pointer-events: none; z-index: 12;
    will-change: transform;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute;
    background: #0ff;
    box-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
  }
  #crosshair::before { left: 15px; top: 0; width: 2px; height: 32px; }
  #crosshair::after { top: 15px; left: 0; height: 2px; width: 32px; }
  #crosshair .dot {
    position: absolute; left: 13px; top: 13px;
    width: 6px; height: 6px; background: #f0f; border-radius: 50%;
    box-shadow: 0 0 12px #f0f, 0 0 24px #f0f;
    animation: dotPulse 1.5s infinite;
  }
  @keyframes dotPulse {
    0%,100% { transform: scale(1); opacity: 1; }
    50%     { transform: scale(1.3); opacity: 0.7; }
  }

  #info {
    position: fixed; bottom: 16px; left: 50%;
    transform: translateX(-50%);
    font-size: 12px; letter-spacing: 1px; color: #0ff;
    text-shadow: 0 0 8px #0ff;
    background: rgba(0,0,0,0.7);
    padding: 8px 20px; border: 1px solid #0ff;
    border-radius: 4px; z-index: 10;
    text-align: center; white-space: nowrap;
  }

  #waveInfo {
    position: fixed; top: 16px; right: 16px;
    color: #f0f; font-size: 16px; letter-spacing: 1px;
    text-shadow: 0 0 12px #f0f; text-align: right;
    background: rgba(0,0,0,0.55);
    padding: 12px 18px; border: 1px solid #f0f;
    border-radius: 4px; min-width: 200px; z-index: 10;
    box-shadow: 0 0 20px rgba(255,0,255,0.3);
  }

  #menu {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    background: radial-gradient(ellipse at center, #1a0033, #0a0018, #000);
    z-index: 500;
  }
  #menu h1 {
    color: #f0f; font-size: 82px; font-weight: 900;
    letter-spacing: 12px; margin-bottom: 8px;
    text-shadow: 0 0 20px #f0f, 0 0 40px #f0f, 0 0 80px #f0f;
    animation: titlePulse 2s infinite;
  }
  @keyframes titlePulse {
    0%,100% { text-shadow: 0 0 20px #f0f, 0 0 40px #f0f, 0 0 80px #f0f; }
    50%     { text-shadow: 0 0 40px #f0f, 0 0 80px #f0f, 0 0 140px #f0f, 0 0 200px #0ff; }
  }
  #menu h2 {
    color: #0ff; font-size: 16px; letter-spacing: 8px;
    margin-bottom: 60px; text-shadow: 0 0 12px #0ff;
  }
  .btn {
    padding: 18px 60px; margin: 8px; font-size: 18px;
    font-weight: bold; letter-spacing: 5px;
    background: transparent; color: #0ff;
    border: 2px solid #0ff; cursor: pointer;
    font-family: inherit; text-shadow: 0 0 10px #0ff;
    box-shadow: 0 0 20px rgba(0,255,255,0.3), inset 0 0 20px rgba(0,255,255,0.1);
    transition: all 0.25s; border-radius: 4px; min-width: 320px;
  }
  .btn:hover {
    background: #0ff; color: #000; text-shadow: none;
    box-shadow: 0 0 40px #0ff, 0 0 80px #0ff;
    transform: scale(1.05);
  }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; background: #000; color: #0ff;
    font-size: 22px; letter-spacing: 4px; z-index: 600;
  }
  #loading .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }

  #err {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(30,0,0,0.97); color: #f66;
    font-size: 14px; z-index: 700; padding: 40px;
    white-space: pre-wrap; overflow: auto;
    font-family: monospace; text-align: left; line-height: 1.6;
  }

  #gameover {
    position: fixed; inset: 0; display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.94); color: #f0f;
    font-size: 62px; font-weight: 900; letter-spacing: 6px;
    text-shadow: 0 0 30px #f0f, 0 0 60px #f0f;
    z-index: 100;
  }
  #gameover small {
    font-size: 16px; color: #0ff; margin-top: 24px;
    letter-spacing: 4px; text-shadow: 0 0 12px #0ff;
  }

  .hitmark {
    position: fixed; pointer-events: none;
    color: #f00; font-size: 30px; font-weight: bold;
    z-index: 20; text-shadow: 0 0 12px #f00, 0 0 24px #f00;
    animation: hitFade 0.45s forwards;
  }
  @keyframes hitFade {
    0%   { opacity: 1; transform: scale(0.7); }
    100% { opacity: 0; transform: scale(1.8); }
  }

  #damageOverlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 15;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(255,0,0,0.7) 100%);
    opacity: 0; transition: opacity 0.18s;
  }

  .killfeed {
    position: fixed; top: 130px; right: 16px;
    color: #0ff; font-size: 13px; letter-spacing: 1px;
    text-shadow: 0 0 8px #0ff; z-index: 10;
    text-align: right; pointer-events: none;
  }
  .killfeed div {
    margin: 4px 0; padding: 3px 10px;
    background: rgba(0,0,0,0.5);
    border-right: 2px solid #0ff;
    animation: killSlideIn 0.3s;
  }
  @keyframes killSlideIn {
    from { transform: translateX(40px); opacity: 0; }
    to   { transform: translateX(0); opacity: 1; }
  }
</style>
</head>
<body>

<div id="loading">ЗАГРУЗКА СИСТЕМЫ<span class="dot">...</span></div>
<div id="err"></div>
<div id="damageOverlay"></div>

<div id="menu">
  <h1>NEON HUNTER</h1>
  <h2>CYBERPUNK SHOOTER v6.1 · R15</h2>
  <button class="btn" id="btnPlay">▶  ИГРАТЬ</button>
  <button class="btn" id="btnHelp">?  УПРАВЛЕНИЕ</button>
</div>

<div id="hud" style="display:none;">
  <div>HP: <div class="bar"><div id="hpFill"></div></div></div>
  <div>ENERGY: <div class="bar"><div id="enFill"></div></div></div>
  <div id="score">SCORE: 0</div>
  <div id="kills">KILLS: 0</div>
  <div id="wave">WAVE: 1</div>
</div>
<div id="waveInfo" style="display:none;"></div>
<div id="crosshair" style="display:none;"><div class="dot"></div></div>
<div id="info" style="display:none;">
  WASD — движение | SHIFT — бег | SPACE — прыжок (x2) | ЛКМ — плазма | ПКМ (держать 1.2с) — МЕГА-ЛУЧ | E — мина
</div>
<div id="gameover">
  СИСТЕМА УНИЧТОЖЕНА
  <div style="font-size:22px; color:#0ff; margin-top:24px; letter-spacing:4px;" id="finalScore"></div>
  <small>F5 — ПЕРЕЗАПУСК</small>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>

// ============================================================
// NEON HUNTER v6.1 — ПОЛНЫЙ КОД
// ============================================================

window.addEventListener('error', function(e) {
  const err = document.getElementById('err');
  if (!err) return;
  err.style.display = 'flex';
  err.textContent = 'ОШИБКА:\n' + e.message + '\n\n' +
                   'Файл: ' + (e.filename || '?') + '\n' +
                   'Строка: ' + (e.lineno || '?');
});

// ==== АУДИО ====
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(freq, dur, type, vol) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const v = vol !== undefined ? vol : 0.08;
    gain.gain.setValueAtTime(v, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + dur);
  } catch(e){}
}
const sfx = {
  laser:   function() { playSound(880, 0.08, 'sawtooth', 0.06); },
  mega:    function() {
    playSound(120, 0.7, 'sawtooth', 0.15);
    playSound(300, 0.6, 'square', 0.1);
    playSound(600, 0.5, 'sine', 0.06);
  },
  explode: function() { playSound(70, 0.35, 'sawtooth', 0.14); },
  hit:     function() { playSound(1400, 0.04, 'square', 0.04); },
  hurt:    function() { playSound(160, 0.2, 'sawtooth', 0.1); },
  pickup:  function() { playSound(1600, 0.15, 'sine', 0.09); },
  jump:    function() { playSound(600, 0.1, 'sine', 0.05); },
  mine:    function() { playSound(300, 0.12, 'square', 0.05); },
  waveStart: function() {
    playSound(220, 0.4, 'sawtooth', 0.1);
    setTimeout(function(){ playSound(440, 0.4, 'sawtooth', 0.1); }, 200);
    setTimeout(function(){ playSound(880, 0.6, 'sawtooth', 0.12); }, 400);
  },
  boss: function() {
    playSound(80, 1.0, 'sawtooth', 0.18);
    playSound(160, 0.8, 'square', 0.12);
  }
};

window.addEventListener('load', function() {
  setTimeout(function() {
    if (typeof THREE === 'undefined') {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('err');
      err.style.display = 'flex';
      err.textContent = '❌ Three.js не загрузился.\n\nОткрой в Firefox ИЛИ загрузи на GitHub Pages.';
      return;
    }
    initMenu();
    document.getElementById('loading').style.display = 'none';
  }, 400);
});

function initMenu() {
  document.getElementById('btnPlay').addEventListener('click', function() {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('info').style.display = 'block';
    document.getElementById('waveInfo').style.display = 'block';
    initAudio();
    startGame();
  });

  document.getElementById('btnHelp').addEventListener('click', function() {
    alert('УПРАВЛЕНИЕ v6.1:\n\n' +
      '🖱 МЫШЬ — прицел следует за курсором\n' +
      '🖱 КОЛЕСО — зум\n' +
      'ЛКМ — плазменный заряд\n' +
      'ПКМ (держать 1.2с) — МЕГА-ЛУЧ (непрерывный луч из руки!)\n' +
      'WASD — движение\n' +
      'SHIFT — бег\n' +
      'SPACE — двойной прыжок\n' +
      'E — мина\n\n' +
      'МЕГА-ЛУЧ — торчит из руки, жжёт всё на пути, пока не кончится заряд.');
  });
}

let gameStarted = false;
function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  mainGame();
}

function mainGame() {

  // ==== СЦЕНА / КАМЕРА / РЕНДЕР ====
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x02000a);
  scene.fog = new THREE.FogExp2(0x08001a, 0.009);

  const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 600);
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.body.appendChild(renderer.domElement);

  // ==== СВЕТ ====
  scene.add(new THREE.AmbientLight(0x1a0033, 0.7));

  const moon = new THREE.DirectionalLight(0x6644ff, 1.3);
  moon.position.set(50, 90, 40);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -120;
  moon.shadow.camera.right = 120;
  moon.shadow.camera.top = 120;
  moon.shadow.camera.bottom = -120;
  moon.shadow.camera.far = 300;
  moon.shadow.bias = -0.0005;
  scene.add(moon);

  const neonColors = [
    0xff00ff, 0x00ffff, 0xff0066, 0x00ff88, 0xffaa00,
    0xff3300, 0xaa00ff, 0x00ffaa, 0xff44aa
  ];

  const cityLights = [];
  for (let i = 0; i < 20; i++) {
    const l = new THREE.PointLight(neonColors[i % neonColors.length], 3, 50);
    l.position.set(
      (Math.random() - 0.5) * 160,
      8 + Math.random() * 18,
      (Math.random() - 0.5) * 160
    );
    scene.add(l);
    cityLights.push({ light: l, base: 3, phase: Math.random() * Math.PI * 2 });
  }

  // ==== ЗЕМЛЯ ====
  const groundGeo = new THREE.PlaneGeometry(240, 240, 60, 60);
  const groundMat = new THREE.MeshStandardMaterial({
    color: 0x060010,
    roughness: 0.5,
    metalness: 0.85,
    emissive: 0x0f0022,
    emissiveIntensity: 0.5
  });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(240, 120, 0xff00ff, 0x00ffff);
  grid.position.y = 0.02;
  grid.material.opacity = 0.35;
  grid.material.transparent = true;
  scene.add(grid);

  // ==== СТОЛБЫ ПО КРУГУ ====
  for (let i = 0; i < 16; i++) {
    const angle = (i / 16) * Math.PI * 2;
    const r = 60;
    const x = Math.cos(angle) * r;
    const z = Math.sin(angle) * r;
    const col = neonColors[i % neonColors.length];

    const pillar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.4, 0.5, 12, 8),
      new THREE.MeshStandardMaterial({
        color: 0x1a1a2e, metalness: 0.9, roughness: 0.3,
        emissive: col, emissiveIntensity: 0.3
      })
    );
    pillar.position.set(x, 6, z);
    pillar.castShadow = true;
    scene.add(pillar);

    const strip = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 10, 0.15),
      new THREE.MeshBasicMaterial({ color: col })
    );
    strip.position.set(x, 6, z);
    scene.add(strip);

    const topLight = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 10, 10),
      new THREE.MeshBasicMaterial({ color: col })
    );
    topLight.position.set(x, 12.5, z);
    scene.add(topLight);

    const pl = new THREE.PointLight(col, 2, 20);
    pl.position.set(x, 12, z);
    scene.add(pl);
  }

  // ============================================================
  // ПЕРСОНАЖ R15
  // ============================================================
  const player = new THREE.Group();
  player.position.set(0, 0, 0);

  const M_dark  = new THREE.MeshStandardMaterial({ color:0x0d0d18, metalness:0.95, roughness:0.25, emissive:0x001122, emissiveIntensity:0.2 });
  const M_mid   = new THREE.MeshStandardMaterial({ color:0x1c1c2e, metalness:0.9,  roughness:0.3,  emissive:0x000022, emissiveIntensity:0.15 });
  const M_armor = new THREE.MeshStandardMaterial({ color:0x0a0a14, metalness:1.0,  roughness:0.15, emissive:0x00ffff, emissiveIntensity:0.12 });
  const M_glowC = new THREE.MeshBasicMaterial({ color: 0x00ffff });
  const M_glowP = new THREE.MeshBasicMaterial({ color: 0xff00ff });
  const M_glowG = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
  const M_glowO = new THREE.MeshBasicMaterial({ color: 0xff8800 });
  const M_white = new THREE.MeshBasicMaterial({ color: 0xffffff });

  const root = new THREE.Group();
  player.add(root);

  const lowerTorso = new THREE.Group();
  lowerTorso.position.y = 0.95;
  root.add(lowerTorso);

  const pelvisMesh = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.32, 0.36), M_mid);
  pelvisMesh.castShadow = true;
  lowerTorso.add(pelvisMesh);

  const belt = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.1, 0.4), M_armor);
  belt.position.y = 0.15;
  lowerTorso.add(belt);

  const beltGlow = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.42), M_glowC);
  beltGlow.position.y = 0.15;
  lowerTorso.add(beltGlow);

  const upperTorso = new THREE.Group();
  upperTorso.position.y = 0.3;
  lowerTorso.add(upperTorso);

  const chest = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.72, 0.44), M_mid);
  chest.position.y = 0.3;
  chest.castShadow = true;
  upperTorso.add(chest);

  const plate1 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.28, 0.09), M_armor);
  plate1.position.set(0, 0.5, 0.24);
  upperTorso.add(plate1);
  const plate2 = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.22, 0.09), M_armor);
  plate2.position.set(0, 0.2, 0.24);
  upperTorso.add(plate2);
  const plate3 = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.18, 0.09), M_armor);
  plate3.position.set(0, -0.05, 0.24);
  upperTorso.add(plate3);

  const coreOuter = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.1, 20), M_glowC);
  coreOuter.rotation.x = Math.PI / 2;
  coreOuter.position.set(0, 0.36, 0.27);
  upperTorso.add(coreOuter);

  const coreInner = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.12, 16), M_white);
  coreInner.rotation.x = Math.PI / 2;
  coreInner.position.set(0, 0.36, 0.28);
  upperTorso.add(coreInner);

  const coreRing = new THREE.Mesh(new THREE.TorusGeometry(0.19, 0.025, 8, 24), M_glowP);
  coreRing.position.set(0, 0.36, 0.28);
  upperTorso.add(coreRing);

  const beltL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.05), M_armor);
  beltL.position.set(-0.15, 0.3, 0.25);
  beltL.rotation.z = 0.3;
  upperTorso.add(beltL);
  const beltR = beltL.clone();
  beltR.position.x = 0.15;
  beltR.rotation.z = -0.3;
  upperTorso.add(beltR);

  const shL = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.3, 0.42), M_armor);
  shL.position.set(-0.5, 0.5, 0);
  shL.castShadow = true;
  upperTorso.add(shL);
  const shR = shL.clone();
  shR.position.x = 0.5;
  upperTorso.add(shR);

  const shGlowL = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.08, 0.44), M_glowC);
  shGlowL.position.set(-0.5, 0.66, 0);
  upperTorso.add(shGlowL);
  const shGlowR = shGlowL.clone();
  shGlowR.position.x = 0.5;
  upperTorso.add(shGlowR);

  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.14, 0.12, 14), M_dark);
  neck.position.y = 0.72;
  upperTorso.add(neck);

  const headGroup = new THREE.Group();
  headGroup.position.y = 0.9;
  upperTorso.add(headGroup);

  const skull = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.48, 0.44), M_dark);
  skull.castShadow = true;
  headGroup.add(skull);

  const backHead = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.4, 0.08), M_armor);
  backHead.position.z = -0.23;
  headGroup.add(backHead);

  const earL = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.24, 0.3), M_armor);
  earL.position.set(-0.26, 0.02, 0);
  headGroup.add(earL);
  const earR = earL.clone();
  earR.position.x = 0.26;
  headGroup.add(earR);

  const earGlowL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.16), M_glowP);
  earGlowL.position.set(-0.29, 0.08, 0);
  headGroup.add(earGlowL);
  const earGlowR = earGlowL.clone();
  earGlowR.position.x = 0.29;
  headGroup.add(earGlowR);

  const visor = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.08, 0.05), M_glowC);
  visor.position.set(0, 0.06, 0.25);
  headGroup.add(visor);

  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), M_glowP);
  eyeL.position.set(-0.11, 0.06, 0.28);
  headGroup.add(eyeL);
  const eyeR = eyeL.clone();
  eyeR.position.x = 0.11;
  headGroup.add(eyeR);

  function checkLaserHits() {
    for (let li = lasers.length - 1; li >= 0; li--) {
      const L = lasers[li];
      const pos = L.group.position;
      let hit = false;
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        const eCenter = e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));
        const dist = pos.distanceTo(eCenter);
        const hitR = (e.isBoss ? 2.0 : 1.2) + 0.3;
        if (dist < hitR) {
          damageEnemy(e, 20);
          hit = true;
          break;
        }
      }
      if (hit) removeLaser(li);
    }
  }

  // ============================================================
  // МЕГА-ЛУЧ — НЕПРЕРЫВНЫЙ ЛУЧ ИЗ РУКИ
  // ============================================================
  // Луч идёт из руки игрока в направлении прицела, пока горит.
  // Наносит урон всем, кто пересекает его линию.

  const MEGA_LENGTH = 80;
  const MEGA_THICK = 0.4;
  const MEGA_DURATION = 3.0;   // сколько секунд горит луч после зарядки
  const MEGA_DPS = 800;        // урон в секунду

  let megaBeam = null;
  let megaBeamLife = 0;
  let megaBeamActive = false;

  function createMegaBeam() {
    const group = new THREE.Group();

    // Белое ядро
    const coreGeo = new THREE.CylinderGeometry(MEGA_THICK * 0.5, MEGA_THICK * 0.5, MEGA_LENGTH, 12);
    coreGeo.rotateX(Math.PI / 2);
    coreGeo.translate(0, 0, MEGA_LENGTH / 2);
    const core = new THREE.Mesh(
      coreGeo,
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
    );
    group.add(core);

    // Золотая середина
    const midGeo = new THREE.CylinderGeometry(MEGA_THICK * 1.1, MEGA_THICK * 1.1, MEGA_LENGTH, 12);
    midGeo.rotateX(Math.PI / 2);
    midGeo.translate(0, 0, MEGA_LENGTH / 2);
    const mid = new THREE.Mesh(
      midGeo,
      new THREE.MeshBasicMaterial({ color: 0xffdd44, transparent: true, opacity: 0.55 })
    );
    group.add(mid);

    // Оранжевый ореол
    const outerGeo = new THREE.CylinderGeometry(MEGA_THICK * 2.2, MEGA_THICK * 2.2, MEGA_LENGTH, 14);
    outerGeo.rotateX(Math.PI / 2);
    outerGeo.translate(0, 0, MEGA_LENGTH / 2);
    const outer = new THREE.Mesh(
      outerGeo,
      new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.25 })
    );
    group.add(outer);

    // Вспышка в конце
    const tip = new THREE.Mesh(
      new THREE.SphereGeometry(MEGA_THICK * 2, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xffffaa, transparent: true, opacity: 0.9 })
    );
    tip.position.z = MEGA_LENGTH;
    group.add(tip);

    // Точечный свет
    const light = new THREE.PointLight(0xffdd44, 6, 40);
    light.position.z = MEGA_LENGTH * 0.5;
    group.add(light);

    scene.add(group);

    return { group, core, mid, outer, tip, light };
  }

  function startMegaBeam() {
    if (megaBeamActive) return;
    megaBeamActive = true;
    megaBeamLife = MEGA_DURATION;
    megaBeam = createMegaBeam();
    flashScreen(0xffdd44, 0.5);
    sfx.mega();
  }

  function stopMegaBeam() {
    megaBeamActive = false;
  }

  function updateMegaBeam(dt, t) {
    if (!megaBeam) return;

    if (!megaBeamActive) {
      megaBeamLife -= dt * 3;
      if (megaBeamLife <= 0) {
        scene.remove(megaBeam.group);
        megaBeam = null;
        return;
      }
    }

    // Позиция дула на правой руке
    const muzzleLocal = new THREE.Vector3(0, -0.28, 0.4);
    const muzzleWorld = muzzleLocal.clone();
    armR.elbow.localToWorld(muzzleWorld);
    megaBeam.group.position.copy(muzzleWorld);

    // Направление — в прицел
    const aimDir = getAimDirection();
    const q = new THREE.Quaternion().setFromUnitVectors(
      new THREE.Vector3(0, 0, 1),
      aimDir
    );
    megaBeam.group.quaternion.copy(q);

    // Пульсация / затухание
    const pulse = 1 + Math.sin(t * 30) * 0.15;
    const fade = megaBeamActive ? 1 : Math.max(0, megaBeamLife / MEGA_DURATION);

    megaBeam.core.scale.set(pulse, pulse, 1);
    megaBeam.core.material.opacity = 0.95 * fade;

    megaBeam.mid.scale.set(pulse * 1.05, pulse * 1.05, 1);
    megaBeam.mid.material.opacity = 0.55 * fade;

    megaBeam.outer.scale.set(pulse * 1.1, pulse * 1.1, 1);
    megaBeam.outer.material.opacity = 0.25 * fade;

    megaBeam.tip.scale.setScalar(1 + Math.sin(t * 20) * 0.2);
    megaBeam.tip.material.opacity = 0.9 * fade;

    megaBeam.light.intensity = 6 * fade;

    // Урон по врагам, попавшим в луч
    if (megaBeamActive) {
      const startPoint = megaBeam.group.position.clone();
      for (let ei = enemies.length - 1; ei >= 0; ei--) {
        const e = enemies[ei];
        const eCenter = e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0));

        const toE = eCenter.clone().sub(startPoint);
        const projLen = toE.dot(aimDir);

        if (projLen < 0 || projLen > MEGA_LENGTH) continue;

        const closest = startPoint.clone().add(aimDir.clone().multiplyScalar(projLen));
        const perpDist = closest.distanceTo(eCenter);
        const hitRadius = (e.isBoss ? 2.0 : 1.5) + MEGA_THICK * 2;

        if (perpDist < hitRadius) {
          damageEnemy(e, MEGA_DPS * dt);
        }
      }
    }
  }

  // ============================================================
  // УРОН / СМЕРТЬ / ЧАСТИЦЫ
  // ============================================================
  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    if (Math.random() < 0.3) {
      spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)), e.style.acc);
      showHitmark();
    }
    sfx.hit();
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    scene.remove(e.mesh);
    const i = enemies.indexOf(e);
    if (i >= 0) enemies.splice(i, 1);
    score += (10 + e.maxHp) * (e.isBoss ? 5 : 1);
    kills++;
    updateHUD();
    addKillFeed(e.style.name + (e.isBoss ? ' [BOSS]' : ''));
    sfx.explode();
    const count = e.isBoss ? 80 : 25;
    for (let j = 0; j < count; j++) {
      spawnHitParticles(e.mesh.position.clone().add(new THREE.Vector3(0, 1.5, 0)), e.style.acc);
    }
  }

  function spawnHitParticles(pos, color) {
    for (let i = 0; i < 4; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 4, 4),
        new THREE.MeshBasicMaterial({ color, transparent: true })
      );
      p.position.copy(pos);
      const vel = new THREE.Vector3(
        (Math.random() - 0.5) * 5,
        Math.random() * 3.5,
        (Math.random() - 0.5) * 5
      );
      scene.add(p);
      particles.push({ mesh: p, vel, life: 0.7, maxLife: 0.7 });
    }
  }

  function spawnPowerup(pos, type) {
    const color = type === 'health' ? 0x00ff88 : 0xffaa00;
    const geo = type === 'health'
      ? new THREE.BoxGeometry(0.55, 0.55, 0.55)
      : new THREE.OctahedronGeometry(0.45);
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos);
    p.position.y = 1.5;
    scene.add(p);
    const glow = new THREE.PointLight(color, 3, 8);
    p.add(glow);
    powerups.push({ mesh: p, type, hover: Math.random() * 6, life: 25 });
  }

  function placeMine() {
    if (mineCooldown > 0) return;
    mineCooldown = 3;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.35, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    m.position.copy(player.position);
    m.position.y = 0.4;
    scene.add(m);
    const light = new THREE.PointLight(0xff0000, 3, 6);
    m.add(light);
    mines.push({ mesh: m, life: 18, blink: 0 });
    sfx.mine();
  }

  function updateMines(dt) {
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      m.life -= dt;
      m.blink += dt;
      m.mesh.material.color.setHex(Math.sin(m.blink * 12) > 0 ? 0xff0000 : 0x440000);
      m.mesh.scale.setScalar(1 + Math.sin(m.blink * 12) * 0.15);
      let exploded = false;
      for (const e of enemies) {
        if (e.mesh.position.distanceTo(m.mesh.position) < 3.5) {
          for (let j = 0; j < 20; j++) spawnHitParticles(m.mesh.position, 0xff8800);
          for (const e2 of enemies) {
            if (e2.mesh.position.distanceTo(m.mesh.position) < 4.5) {
              damageEnemy(e2, e2.isBoss ? 60 : 120);
            }
          }
          sfx.explode();
          flashScreen(0xff4400, 0.25);
          scene.remove(m.mesh);
          mines.splice(i, 1);
          exploded = true;
          break;
        }
      }
      if (!exploded && m.life <= 0) {
        scene.remove(m.mesh);
        mines.splice(i, 1);
      }
    }
  }

  // ============================================================
  // СОСТОЯНИЕ
  // ============================================================
  let hp = 100;
  let energy = 0;
  let charging = false;
  let chargeTime = 0;
  let score = 0, kills = 0;
  let wave = 1;
  let waveTimer = 0;
  let waveState = 'preparing';
  let gameOver = false;
  let velocityY = 0;
  let onGround = true;
  let jumpCount = 0;
  let shootCooldown = 0;

  const hpFill = document.getElementById('hpFill');
  const enFill = document.getElementById('enFill');
  const scoreEl = document.getElementById('score');
  const killsEl = document.getElementById('kills');
  const waveEl = document.getElementById('wave');
  const waveInfoEl = document.getElementById('waveInfo');
  const gameoverEl = document.getElementById('gameover');
  const damageOverlay = document.getElementById('damageOverlay');
  const crosshairEl = document.getElementById('crosshair');

  const killFeed = document.createElement('div');
  killFeed.className = 'killfeed';
  document.body.appendChild(killFeed);

  function updateHUD() {
    hpFill.style.width = Math.max(0, hp) + '%';
    enFill.style.width = energy + '%';
    scoreEl.textContent = 'SCORE: ' + score;
    killsEl.textContent = 'KILLS: ' + kills;
    waveEl.textContent = 'WAVE: ' + wave;
    if (waveState === 'preparing') {
      waveInfoEl.innerHTML = 'ВОЛНА ' + wave + ' ЧЕРЕЗ<br><span style="font-size:36px;color:#0ff;">' + Math.ceil(waveTimer) + '</span>';
    } else if (waveState === 'cleared') {
      waveInfoEl.innerHTML = '<span style="color:#0ff;">ВОЛНА ЗАЧИЩЕНА!</span>';
    } else {
      waveInfoEl.textContent = 'ВРАГОВ: ' + enemies.length;
    }
  }

  function addKillFeed(name) {
    const div = document.createElement('div');
    div.textContent = '✖ ' + name;
    killFeed.appendChild(div);
    setTimeout(function() { div.remove(); }, 3000);
  }

  function showHitmark() {
    const hm = document.createElement('div');
    hm.className = 'hitmark';
    hm.textContent = '✕';
    hm.style.left = (mouseScreenX + 18) + 'px';
    hm.style.top = (mouseScreenY - 18) + 'px';
    document.body.appendChild(hm);
    setTimeout(function() { hm.remove(); }, 400);
  }

  function showDamage() {
    damageOverlay.style.opacity = '1';
    setTimeout(function() { damageOverlay.style.opacity = '0'; }, 180);
  }

  function flashScreen(color, alpha) {
    const div = document.createElement('div');
    const r = (color >> 16) & 255;
    const g = (color >> 8) & 255;
    const b = color & 255;
    div.style.cssText = 'position:fixed;inset:0;background:rgba(' + r + ',' + g + ',' + b + ',' + alpha + ');pointer-events:none;z-index:50;transition:opacity 0.4s;';
    document.body.appendChild(div);
    setTimeout(function() { div.style.opacity = '0'; }, 30);
    setTimeout(function() { div.remove(); }, 500);
  }

  function endGame() {
    gameOver = true;
    document.getElementById('finalScore').textContent =
      'SCORE: ' + score + ' | KILLS: ' + kills + ' | WAVE: ' + wave;
    gameoverEl.style.display = 'flex';
  }

  // ============================================================
  // МЫШЬ
  // ============================================================
  let mouseDownL = false;
  let mouseDownR = false;

  renderer.domElement.addEventListener('mousedown', function(e) {
    if (e.button === 0) mouseDownL = true;
    if (e.button === 2) mouseDownR = true;
  });

  renderer.domElement.addEventListener('mouseup', function(e) {
    if (e.button === 0) mouseDownL = false;
    if (e.button === 2) mouseDownR = false;
  });

  renderer.domElement.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });

  // ============================================================
  // НАПРАВЛЕНИЕ СТРЕЛЬБЫ
  // ============================================================
  function getAimDirection() {
    const nx = (mouseScreenX / innerWidth) * 2 - 1;
    const ny = -(mouseScreenY / innerHeight) * 2 + 1;
    const raycaster = new THREE.Raycaster();
    raycaster.setFromCamera({ x: nx, y: ny }, camera);
    const targetPoint = raycaster.ray.at(100, new THREE.Vector3());
    const origin = player.position.clone();
    origin.y += 1.5;
    return targetPoint.sub(origin).normalize();
  }

  function spawnRandomEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 30 + Math.random() * 35;
    const x = player.position.x + Math.cos(angle) * radius;
    const z = player.position.z + Math.sin(angle) * radius;
    spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z));
  }

  // ============================================================
  // ИГРОВОЙ ЦИКЛ
  // ============================================================
  const clock = new THREE.Clock();
  let camPosLerp = new THREE.Vector3(0, 5, 8);
  let camLookLerp = new THREE.Vector3(0, 1.5, 0);
  let spawnTimer = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (gameOver) { renderer.render(scene, camera); return; }

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    for (let i = 0; i < cityLights.length; i++) {
      const cl = cityLights[i];
      cl.light.intensity = cl.base + Math.sin(t * 1.5 + cl.phase) * 1.2;
    }

    yaw += (camTargetYaw - yaw) * 0.15;
    pitch += (camTargetPitch - pitch) * 0.15;

    // Движение
    const moveDir = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp'])    moveDir.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  moveDir.z += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  moveDir.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

    const isRunning = keys['ShiftLeft'] || keys['ShiftRight'];
    const baseSpeed = isRunning ? 12 : 6;
    let isMoving = false;

    if (moveDir.lengthSq() > 0) {
      isMoving = true;
      moveDir.normalize();
      const camFwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const camRight = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const worldMove = new THREE.Vector3()
        .addScaledVector(camFwd, -moveDir.z)
        .addScaledVector(camRight, moveDir.x)
        .normalize()
        .multiplyScalar(baseSpeed * dt);
      const newPos = player.position.clone().add(worldMove);
      if (Math.abs(newPos.x) < 115 && Math.abs(newPos.z) < 115) {
        player.position.copy(newPos);
      }
    }

    player.rotation.y = yaw + Math.PI;

    // Прыжок
    if (keys['Space'] && !player.userData.jumpHeld) {
      if (onGround) { velocityY = 9; onGround = false; jumpCount = 1; sfx.jump(); }
      else if (jumpCount < 2) { velocityY = 8.5; jumpCount = 2; sfx.jump(); }
      player.userData.jumpHeld = true;
    }
    if (!keys['Space']) player.userData.jumpHeld = false;
    velocityY -= 25 * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 0) { player.position.y = 0; velocityY = 0; onGround = true; jumpCount = 0; }

    // Мина
    if (keys['KeyE'] && !player.userData.mineHeld) {
      placeMine();
      player.userData.mineHeld = true;
    }
    if (!keys['KeyE']) player.userData.mineHeld = false;
    mineCooldown -= dt;

    // Анимация R15
    const speedFactor = isMoving ? (isRunning ? 1.5 : 1) : 0;
    const walkCycle = Math.sin(t * 10) * speedFactor;
    const walkBob = Math.abs(Math.sin(t * 10)) * 0.06 * speedFactor;

    legL.group.rotation.x = walkCycle * 0.7;
    legL.knee.rotation.x  = Math.max(0, -walkCycle) * 0.9;
    legR.group.rotation.x = -walkCycle * 0.7;
    legR.knee.rotation.x  = Math.max(0, walkCycle) * 0.9;

    armL.group.rotation.x = -walkCycle * 0.5;
    armL.group.rotation.z = 0.15;

    // Правая рука — вытянута вперёд (для стрельбы)
    armR.group.rotation.x = -Math.PI / 2 + 0.15;
    armR.group.rotation.z = -0.1;

    lowerTorso.rotation.z = Math.sin(t * 10) * 0.04 * speedFactor;
    upperTorso.position.y = 0.3 + walkBob;
    coreRing.rotation.z += dt * 2;

    // Камера
    const camTargetY = player.position.y + 1.8;
    const targetPos = new THREE.Vector3(player.position.x, camTargetY, player.position.z);
    const camOffset = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch) * cameraDistance,
      Math.sin(pitch) * cameraDistance + 1.5,
      Math.cos(yaw) * Math.cos(pitch) * cameraDistance
    );
    const desiredCamPos = targetPos.clone().add(camOffset);
    camPosLerp.lerp(desiredCamPos, 0.18);
    camLookLerp.lerp(targetPos, 0.25);
    camera.position.copy(camPosLerp);
    camera.lookAt(camLookLerp);

    // Прицел за мышью
    crosshairEl.style.left = (mouseScreenX - 16) + 'px';
    crosshairEl.style.top = (mouseScreenY - 16) + 'px';

    // ЛКМ — обычная плазма
    shootCooldown -= dt;
    if (mouseDownL && shootCooldown <= 0) {
      const origin = player.position.clone();
      origin.y += 1.6;
      const dir = getAimDirection();
      origin.add(dir.clone().multiplyScalar(1));
      firePlasma(origin, dir, false);
      shootCooldown = 0.28;
    }

    // ============ ПКМ — ЗАРЯД И МЕГА-ЛУЧ ============
    if (mouseDownR) {
      if (!charging && !megaBeamActive) {
        charging = true;
        chargeTime = 0;
      }
      if (charging) {
        chargeTime += dt;
        energy = Math.min(100, chargeTime * 60);
        updateHUD();

        const gi = Math.min(1, chargeTime / 1.2);
        if (armL.elbow.children[2]) {
          armL.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
        }
        if (armR.elbow.children[2]) {
          armR.elbow.children[2].material.color.setRGB(1, 0.5 * gi + 0.2, 0);
        }

        // Заряд дошёл → запускаем луч
        if (chargeTime >= 1.2 && !megaBeamActive) {
          startMegaBeam();
          charging = false;
          chargeTime = 0;
        }
      }
    } else {
      // ПКМ отпущена
      if (charging) {
        charging = false;
        chargeTime = 0;
      }
      if (megaBeamActive) {
        stopMegaBeam();
      }
      if (!megaBeamActive && energy < 100) {
        energy = Math.min(100, energy + dt * 8);
        updateHUD();
      }
    }

    // Обновление луча
    updateMegaBeam(dt, t);

    // Снаряды-лазеры
    for (let i = lasers.length - 1; i >= 0; i--) {
      const L = lasers[i];
      L.life -= dt;
      const step = L.speed * dt;
      L.group.position.addScaledVector(L.dir, step);
      L.traveled += step;
      const pulse = 1 + Math.sin(t * 20 + i) * 0.1;
      L.core.scale.setScalar(pulse);
      L.ring.rotation.z += dt * 12;
      if (L.life <= 0 || L.traveled > L.length) removeLaser(i);
    }

    checkLaserHits();

    // Враги
    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      const toPlayer = player.position.clone().sub(e.mesh.position);
      toPlayer.y = 0;
      const dist = toPlayer.length();
      toPlayer.normalize();

      e.bobPhase += dt * 3;
      e.mesh.position.y = e.baseY + Math.sin(e.bobPhase) * 0.4;

      if (e.mesh.userData.ring1) e.mesh.userData.ring1.rotation.z += dt * 3;
      if (e.mesh.userData.ring2) e.mesh.userData.ring2.rotation.z -= dt * 2;
      if (e.mesh.userData.crown) e.mesh.userData.crown.rotation.z += dt * 2;

      if (dist > 2.2) {
        const speedMul = e.isBoss ? 0.7 : 1;
        e.mesh.position.addScaledVector(toPlayer, e.speed * speedMul * dt);
      }

      const targetRot = Math.atan2(toPlayer.x, toPlayer.z);
      e.mesh.rotation.y += (targetRot - e.mesh.rotation.y) * 0.12;

      if (e.mesh.userData.rightArm) {
        const swing = Math.sin(t * 8 + e.bobPhase) * 0.6;
        e.mesh.userData.rightArm.rotation.x = -0.5 + swing;
        e.mesh.userData.leftArm.rotation.x = -0.5 - swing;
      }

      e.attackCD -= dt;
      if (dist < 2.5 && e.attackCD <= 0) {
        hp -= e.dmg;
        e.attackCD = e.isBoss ? 0.6 : 1.0;
        updateHUD();
        flashScreen(0xff0000, 0.28);
        showDamage();
        sfx.hurt();
        if (hp <= 0) { hp = 0; updateHUD(); endGame(); }
      }
    }

    // Волны
    waveTimer -= dt;
    if (waveState === 'preparing') {
      updateHUD();
      if (waveTimer <= 0) {
        waveState = 'fighting';
        sfx.waveStart();
        const count = 4 + wave * 2;
        for (let i = 0; i < count; i++) {
          setTimeout(function() { if (!gameOver) spawnRandomEnemy(); }, i * 250);
        }
        if (wave % 5 === 0) {
          setTimeout(function() {
            if (!gameOver) {
              const angle = Math.random() * Math.PI * 2;
              const x = player.position.x + Math.cos(angle) * 35;
              const z = player.position.z + Math.sin(angle) * 35;
              spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z), true);
              sfx.boss();
              flashScreen(0xff00ff, 0.4);
            }
          }, count * 250 + 500);
        }
      }
    } else if (waveState === 'fighting') {
      updateHUD();
      spawnTimer += dt;
      if (spawnTimer > 6 && enemies.length < 4 + wave) {
        spawnRandomEnemy();
        spawnTimer = 0;
      }
      if (Math.random() < 0.005 && enemies.length > 0 && powerups.length < 3) {
        const e = enemies[Math.floor(Math.random() * enemies.length)];
        spawnPowerup(e.mesh.position.clone(), Math.random() < 0.6 ? 'health' : 'energy');
      }
      if (enemies.length === 0 && waveTimer < -2) {
        waveState = 'cleared';
        waveTimer = 3;
      }
    } else if (waveState === 'cleared') {
      updateHUD();
      if (waveTimer <= 0) {
        wave++;
        waveState = 'preparing';
        waveTimer = 5;
        hp = Math.min(100, hp + 20);
        updateHUD();
      }
    }

    // Бонусы
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.hover += dt * 3;
      p.mesh.position.y = 1.5 + Math.sin(p.hover) * 0.35;
      p.mesh.rotation.y += dt * 2;
      p.life -= dt;
      const d = player.position.distanceTo(p.mesh.position);
      if (d < 1.6) {
        if (p.type === 'health') { hp = Math.min(100, hp + 30); flashScreen(0x00ff88, 0.15); }
        else { energy = Math.min(100, energy + 50); flashScreen(0xffaa00, 0.15); }
        updateHUD();
        sfx.pickup();
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      }
    }

    updateMines(dt);

    // Партиклы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      if (p.mesh.material) p.mesh.material.opacity = p.life / p.maxLife;
      if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
    }

    renderer.render(scene, camera);
  }

  waveState = 'preparing';
  waveTimer = 4;
  updateHUD();
  animate();

  addEventListener('resize', function() {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

</script>
</body>
</html>
