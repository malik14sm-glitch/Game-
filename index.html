<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05010f">

<title>NEON DRIFT — Cyber Chronicles</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  position:fixed;
  inset:0;
  background:#05010f;
  color:#0ff;
  font-family:-apple-system,BlinkMacSystemFont,"Courier New",monospace;
  touch-action:none;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:10;
}

/* ================= TOP HUD ================= */

#topbar{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 10px);
  left:10px;
  right:10px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

#speedo,
#info{
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

#speedo{
  padding:8px 14px;
  border:1px solid #0ff;
  border-radius:10px;
  background:rgba(0,10,30,.58);
  box-shadow:0 0 20px rgba(0,255,255,.4);
  font-size:10px;
  letter-spacing:2px;
}

#speedo b{
  font-size:26px;
  color:#f0f;
  text-shadow:0 0 12px #f0f;
}

#info{
  padding:8px 12px;
  border:1px solid #f0f;
  border-radius:10px;
  background:rgba(30,0,30,.58);
  box-shadow:0 0 20px rgba(255,0,255,.4);
  font-size:10px;
  text-align:right;
  letter-spacing:1px;
  line-height:1.5;
}

#info b{
  color:#0ff;
  font-size:13px;
}

#styleName{
  color:#ff0;
  font-size:11px;
  letter-spacing:2px;
}

/* ================= MINIMAP ================= */

#mapWrap{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 70px);
  right:10px;
  width:110px;
  height:110px;
  border:1px solid #0ff;
  border-radius:50%;
  overflow:hidden;
  background:rgba(0,10,30,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 20px rgba(0,255,255,.4);
}

#mapCanvas{
  width:100%;
  height:100%;
}

/* ================= NITRO ================= */

#nitroLabel{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 142px);
  color:#ff0;
  font-size:9px;
  letter-spacing:3px;
  text-shadow:0 0 8px #ff0;
}

#nitroBar{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom,0px) + 130px);
  width:180px;
  height:8px;
  border:1px solid #ff0;
  border-radius:4px;
  background:rgba(0,0,0,.65);
  overflow:hidden;
  box-shadow:0 0 12px rgba(255,255,0,.5);
}

#nitroFill{
  height:100%;
  width:100%;
  background:linear-gradient(90deg,#ff0,#f80);
  box-shadow:0 0 10px #ff0;
}

/* ================= BUTTONS ================= */

.pad,
.pad-sm{
  position:absolute;
  pointer-events:auto;
  touch-action:none;
  display:flex;
  align-items:center;
  justify-content:center;
  -webkit-user-select:none;
  user-select:none;
}

.pad{
  border-radius:50%;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,255,.25),
    rgba(0,255,255,.08)
  );
  border:2px solid #0ff;
  color:#0ff;
  font-size:24px;
  font-weight:900;
  box-shadow:
    0 0 20px rgba(0,255,255,.6),
    inset 0 0 20px rgba(0,255,255,.15);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.pad.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,255,.7),
    rgba(0,255,255,.3)
  );
  box-shadow:
    0 0 30px #0ff,
    inset 0 0 30px rgba(0,255,255,.5);
  transform:scale(.94);
}

#btnLeft{
  left:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
}

#btnRight{
  left:98px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
}

#btnGas{
  right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:82px;
  height:82px;
  border-color:#0f0;
  color:#0f0;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,0,.25),
    rgba(0,255,0,.08)
  );
  box-shadow:
    0 0 20px rgba(0,255,0,.6),
    inset 0 0 20px rgba(0,255,0,.15);
}

#btnGas.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(0,255,0,.8),
    rgba(0,255,0,.4)
  );
  box-shadow:
    0 0 30px #0f0,
    inset 0 0 30px rgba(0,255,0,.5);
}

#btnBrake{
  right:106px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  width:70px;
  height:70px;
  border-color:#f00;
  color:#f00;
  background:radial-gradient(
    circle at 30% 30%,
    rgba(255,0,0,.25),
    rgba(255,0,0,.08)
  );
  box-shadow:
    0 0 20px rgba(255,0,0,.6),
    inset 0 0 20px rgba(255,0,0,.15);
}

#btnBrake.on{
  background:radial-gradient(
    circle at 30% 30%,
    rgba(255,0,0,.8),
    rgba(255,0,0,.4)
  );
  box-shadow:
    0 0 30px #f00,
    inset 0 0 30px rgba(255,0,0,.5);
}

.pad-sm{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  border:2px solid #f0f;
  color:#f0f;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  box-shadow:0 0 14px rgba(255,0,255,.5);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}

.pad-sm.on{
  background:rgba(255,0,255,.5);
  box-shadow:0 0 20px #f0f;
  transform:scale(.92);
}

.pad-sm.yellow{
  border-color:#ff0;
  color:#ff0;
  box-shadow:0 0 14px rgba(255,255,0,.5);
}

.pad-sm.yellow.on{
  background:rgba(255,255,0,.4);
  box-shadow:0 0 20px #ff0;
}

.pad-sm.blue{
  border-color:#0af;
  color:#0af;
  box-shadow:0 0 14px rgba(0,170,255,.5);
}

.pad-sm.blue.on{
  background:rgba(0,170,255,.4);
  box-shadow:0 0 20px #0af;
}

.pad-sm.green{
  border-color:#0fa;
  color:#0fa;
  box-shadow:0 0 14px rgba(0,255,170,.5);
}

.pad-sm.green.on{
  background:rgba(0,255,170,.4);
  box-shadow:0 0 20px #0fa;
}

#btnStyle{
  right:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnHorn{
  left:14px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnJump{
  right:78px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnNitro{
  right:136px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

#btnCam{
  left:78px;
  bottom:calc(env(safe-area-inset-bottom,0px) + 120px);
}

/* ================= TOAST ================= */

#toast{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:22px;
  letter-spacing:6px;
  color:#ff0;
  text-shadow:0 0 20px #ff0;
  opacity:0;
  transition:opacity .25s;
  pointer-events:none;
  font-weight:900;
}

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  text-align:center;
  background:
    radial-gradient(circle at 50% 50%,#1a0033,#05010f 70%);
  transition:opacity .5s;
}

#splash h1{
  font-size:36px;
  letter-spacing:6px;
  color:#f0f;
  text-shadow:
    0 0 30px #f0f,
    0 0 60px #f0f;
  margin-bottom:10px;
}

#splash h2{
  font-size:14px;
  letter-spacing:4px;
  color:#0ff;
  text-shadow:0 0 12px #0ff;
  margin-bottom:30px;
}

#splash p{
  font-size:11px;
  line-height:1.9;
  color:#8ff;
  margin-bottom:30px;
  max-width:330px;
  letter-spacing:1px;
}

#startBtn{
  pointer-events:auto;
  touch-action:manipulation;
  padding:16px 40px;
  border:2px solid #0ff;
  border-radius:12px;
  background:rgba(0,255,255,.1);
  color:#0ff;
  font-size:14px;
  letter-spacing:4px;
  font-weight:900;
  box-shadow:0 0 30px #0ff;
}

#loading{
  font-size:11px;
  color:#f0f;
  letter-spacing:2px;
  margin-top:20px;
  opacity:.7;
}
</style>
</head>

<body>

<div id="splash">
  <h1>NEON DRIFT</h1>
  <h2>CYBER CHRONICLES</h2>

  <p>
    ЛЕВО / ПРАВО — руль<br>
    ▲ — газ<br>
    ▼ — тормоз<br>
    JUMP — прыжок<br>
    N2O — нитро<br>
    STYLE — 22 машины<br>
    HORN — гудок<br>
    CAM — камера
  </p>

  <button id="startBtn">START</button>
  <div id="loading">загрузка города...</div>
</div>

<div id="hud">

  <div id="topbar">
    <div id="speedo">
      SPEED <b>0</b> km/h
    </div>

    <div id="info">
      GEAR <b>N</b><br>
      <span id="styleName">SPECTRE</span>
    </div>
  </div>

  <div id="mapWrap">
    <canvas id="mapCanvas" width="220" height="220"></canvas>
  </div>

  <div id="nitroLabel">NITRO</div>

  <div id="nitroBar">
    <div id="nitroFill"></div>
  </div>

  <div id="toast"></div>

  <div class="pad" id="btnLeft">◀</div>
  <div class="pad" id="btnRight">▶</div>

  <div class="pad" id="btnGas">▲</div>
  <div class="pad" id="btnBrake">▼</div>

  <div class="pad-sm green" id="btnJump">JUMP</div>
  <div class="pad-sm yellow" id="btnNitro">N2O</div>
  <div class="pad-sm" id="btnHorn">HORN</div>
  <div class="pad-sm blue" id="btnStyle">STYLE</div>
  <div class="pad-sm blue" id="btnCam">CAM</div>

</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05010f);

scene.fog = new THREE.FogExp2(
  0x0a0320,
  0.019
);

/* =========================================================
   RENDERER
========================================================= */

const renderer = new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
});

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1.35)
);

renderer.toneMapping =
  THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
  renderer.domElement
);

/* =========================================================
   CAMERA
========================================================= */

const camera =
  new THREE.PerspectiveCamera(
    72,
    innerWidth / innerHeight,
    0.1,
    2000
  );

/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.AmbientLight(
    0x223355,
    0.75
  )
);

const keyLight =
  new THREE.DirectionalLight(
    0xff44ff,
    0.45
  );

keyLight.position.set(
  0,100,50
);

scene.add(keyLight);

const rimLight =
  new THREE.DirectionalLight(
    0x00ffff,
    0.55
  );

rimLight.position.set(
  -80,60,-100
);

scene.add(rimLight);

scene.add(
  new THREE.HemisphereLight(
    0x0066ff,
    0xff00aa,
    0.35
  )
);

/* =========================================================
   CITY
========================================================= */

const cityGroup =
  new THREE.Group();

scene.add(cityGroup);

const collidables = [];

const blockSize = 42;
const citySize = 10;

const signColors = [
  0x00ffff,
  0xff00ff,
  0xff0066,
  0x00ffaa,
  0xffff00,
  0x00aaff,
  0xff6600
];

/*
  Для производительности PointLight
  используется только у части зданий.
*/

function makeSkyscraper(x,z){

  const h =
    45 + Math.random()*170;

  const w =
    15 + Math.random()*12;

  const d =
    15 + Math.random()*12;

  const geo =
    new THREE.BoxGeometry(
      w,h,d
    );

  const bodyMat =
    new THREE.MeshStandardMaterial({
      color:0x0a0a18,
      metalness:.82,
      roughness:.32,
      emissive:
        Math.random()>.5
        ? 0x001a2a
        : 0x20001c,
      emissiveIntensity:.45
    });

  const building =
    new THREE.Mesh(
      geo,
      bodyMat
    );

  building.position.set(
    x,
    h/2,
    z
  );

  cityGroup.add(building);

  collidables.push({
    x,
    z,
    w:w/2+2.5,
    d:d/2+2.5
  });

  /* Окна */

  const color =
    signColors[
      Math.floor(
        Math.random()*signColors.length
      )
    ];

  const winMat =
    new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:.7
    });

  const windowCount =
    3 + Math.floor(Math.random()*4);

  for(let i=0;i<windowCount;i++){

    const win =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          w*.75,
          1.2+Math.random()*2
        ),
        winMat
      );

    win.position.copy(
      building.position
    );

    win.position.y =
      8 + Math.random()*(h-16);

    const side =
      Math.floor(Math.random()*4);

    if(side===0){

      win.position.z += d/2+.06;

    }else if(side===1){

      win.position.z -= d/2+.06;
      win.rotation.y=Math.PI;

    }else if(side===2){

      win.position.x += w/2+.06;
      win.rotation.y=Math.PI/2;

    }else{

      win.position.x -= w/2+.06;
      win.rotation.y=-Math.PI/2;

    }

    cityGroup.add(win);
  }

  /* Маяк */

  const beacon =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .8,8,8
      ),
      new THREE.MeshBasicMaterial({
        color
      })
    );

  beacon.position.set(
    x,
    h+4,
    z
  );

  cityGroup.add(beacon);

  /*
    Только каждое 5-е здание получает PointLight.
  */

  if(Math.random()<.2){

    const light =
      new THREE.PointLight(
        color,
        5,
        35,
        2
      );

    light.position.set(
      x,
      h+4,
      z
    );

    cityGroup.add(light);
  }
}

/* Создание города */

for(
  let i=-citySize;
  i<=citySize;
  i++
){

  for(
    let j=-citySize;
    j<=citySize;
    j++
  ){

    if(
      Math.abs(i)%2===0 &&
      Math.abs(j)%2===0
    ) continue;

    makeSkyscraper(
      i*blockSize,
      j*blockSize
    );
  }
}

/* =========================================================
   SKY BRIDGES
========================================================= */

const bridgeMat =
  new THREE.MeshStandardMaterial({
    color:0x111122,
    emissive:0x003333,
    emissiveIntensity:.7,
    metalness:.85,
    roughness:.25
  });

const bridgeEdgeMat =
  new THREE.MeshBasicMaterial({
    color:0x00ffff
  });

const bridges=[];

for(let i=0;i<14;i++){

  const len =
    70+Math.random()*100;

  const x =
    (Math.random()-.5)*850;

  const z =
    (Math.random()-.5)*850;

  const y =
    55+Math.random()*100;

  const rotation =
    Math.random()*Math.PI;

  const bridge =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        len,2,5
      ),
      bridgeMat
    );

  bridge.position.set(
    x,y,z
  );

  bridge.rotation.y =
    rotation;

  cityGroup.add(bridge);

  const edge =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        len,.12,.12
      ),
      bridgeEdgeMat
    );

  edge.position.set(
    x,
    y+1.1,
    z
  );

  edge.rotation.y =
    rotation;

  cityGroup.add(edge);

  bridges.push({
    x,
    z,
    y,
    len
  });
}

/* =========================================================
   GROUND
========================================================= */

const groundMat =
  new THREE.MeshStandardMaterial({
    color:0x08081a,
    metalness:.92,
    roughness:.14
  });

const ground =
  new THREE.Mesh(
    new THREE.PlaneGeometry(
      5000,
      5000
    ),
    groundMat
  );

ground.rotation.x =
  -Math.PI/2;

scene.add(ground);

/* =========================================================
   ROAD NEON
========================================================= */

const roadLineMat =
  new THREE.LineBasicMaterial({
    color:0x00ffff,
    transparent:true,
    opacity:.7
  });

for(
  let i=-citySize-1;
  i<=citySize+1;
  i++
){

  const vertical =
    new THREE.BufferGeometry()
      .setFromPoints([
        new THREE.Vector3(
          i*blockSize,
          .05,
          -citySize*blockSize-100
        ),
        new THREE.Vector3(
          i*blockSize,
          .05,
          citySize*blockSize+100
        )
      ]);

  const horizontal =
    new THREE.BufferGeometry()
      .setFromPoints([
        new THREE.Vector3(
          -citySize*blockSize-100,
          .05,
          i*blockSize
        ),
        new THREE.Vector3(
          citySize*blockSize+100,
          .05,
          i*blockSize
        )
      ]);

  scene.add(
    new THREE.Line(
      vertical,
      roadLineMat
    )
  );

  scene.add(
    new THREE.Line(
      horizontal,
      roadLineMat
    )
  );
}

/* =========================================================
   RAIN
========================================================= */

const rainCount = 1800;

const rainGeo =
  new THREE.BufferGeometry();

const rainPos =
  new Float32Array(
    rainCount*3
  );

for(let i=0;i<rainCount;i++){

  rainPos[i*3] =
    (Math.random()-.5)*220;

  rainPos[i*3+1] =
    Math.random()*140;

  rainPos[i*3+2] =
    (Math.random()-.5)*220;
}

rainGeo.setAttribute(
  "position",
  new THREE.BufferAttribute(
    rainPos,
    3
  )
);

const rain =
  new THREE.Points(
    rainGeo,
    new THREE.PointsMaterial({
      color:0xaaeaff,
      size:.14,
      transparent:true,
      opacity:.65,
      sizeAttenuation:true
    })
  );

scene.add(rain);

/* =========================================================
   CAR STYLES
========================================================= */

const carStyles=[

{name:"SPECTRE",body:0x101018,neon:0x00ffff,wings:false,turbines:1,robotic:.2},
{name:"RONIN",body:0x1a0a0a,neon:0xff0044,wings:true,turbines:2,robotic:.3},
{name:"CHROME",body:0xdddddd,neon:0xff00ff,wings:false,turbines:2,robotic:.1},
{name:"WRAITH",body:0x0a0a2a,neon:0x6600ff,wings:true,turbines:3,robotic:.5},
{name:"MECHA-01",body:0x222228,neon:0x00ff88,wings:true,turbines:2,robotic:.9},
{name:"MECHA-02",body:0x2a1a10,neon:0xffaa00,wings:true,turbines:3,robotic:.95},
{name:"NEON SAMURAI",body:0x180020,neon:0xff0066,wings:false,turbines:2,robotic:.4},
{name:"GHOST",body:0xeeeeee,neon:0x00ffff,wings:false,turbines:1,robotic:.15},
{name:"VORTEX",body:0x0a1a2a,neon:0x00aaff,wings:true,turbines:3,robotic:.6},
{name:"KITSUNE",body:0x2a0a1a,neon:0xff44aa,wings:false,turbines:2,robotic:.35},
{name:"TITAN",body:0x111111,neon:0xff2200,wings:true,turbines:4,robotic:.7},
{name:"PRISM",body:0x445566,neon:0x88ffff,wings:false,turbines:2,robotic:.2},
{name:"RAZOR",body:0x0a0a0a,neon:0xff00ff,wings:true,turbines:2,robotic:.55},
{name:"AURORA",body:0x203040,neon:0x00ffcc,wings:false,turbines:3,robotic:.45},
{name:"BULLET",body:0x330000,neon:0xff3300,wings:false,turbines:1,robotic:.25},

function clearGroup(group){

  while(group.children.length){

    const obj =
      group.children.pop();

    if(obj.geometry)
      obj.geometry.dispose();

    if(obj.material){

      if(Array.isArray(obj.material)){

        obj.material.forEach(
          m=>m.dispose()
        );

      }else{

        obj.material.dispose();

      }
    }
  }
}

      roughness:.05,
      emissive:style.neon,

      new THREE.BoxGeometry(

  /* VISOR */

      new THREE.BoxGeometry(
        1.75,.25,.15

        color:0x000000,
        metalness:1,
        roughness:.02,
        emissive:style.neon,
        emissiveIntensity:.3

    );

  /* TAIL */

    new THREE.Mesh(
      new THREE.BoxGeometry(

  tail.position.set(
    0,.78,-2.35

    new THREE.MeshBasicMaterial({
      color:style.neon

      .07,.07,4.4

    new THREE.Mesh(

      neonMat
    );

  leftStrip.position.set(
    -1.16,.35,0
  );

  const rightStrip =
    new THREE.Mesh(
      sideGeo,
      neonMat
    );

  rightStrip.position.set(
    1.16,.35,0

  neonGroup.add(
    leftStrip,
    rightStrip

  const frontStrip =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.9,.07,.07

      neonMat
    );

  frontStrip.position.set(
    0,.35,2.5

  neonGroup.add(

  backStrip.position.z=-2.5;

function showToast(text){

  clearTimeout(

  toast._timer=
    setTimeout(()=>{
      toast.style.opacity=0;
    },900);
}

let audioCtx=null;

function initAudio(){

  if(!audioCtx){

    audioCtx=
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  if(audioCtx.state==="suspended"){
    audioCtx.resume();
  }
}

function playHorn(){

  initAudio();

  const o1=
    audioCtx.createOscillator();

  const o2=
    audioCtx.createOscillator();

  const gain=
    audioCtx.createGain();

  o1.type="sawtooth";
  o2.type="sawtooth";

  o1.frequency.value=220;
  o2.frequency.value=277;

  gain.gain.value=.0001;

  o1.connect(gain);
  o2.connect(gain);

  gain.connect(
    audioCtx.destination
  );

  o1.start();
  o2.start();

  const now=
    audioCtx.currentTime;

  gain.gain.exponentialRampToValueAtTime(
    .12,
    now+.03
  );

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now+.5
  );

  o1.stop(now+.55);
  o2.stop(now+.55);
}

/* =========================================================
   POINTER CONTROLS
   Исправлено для iPhone + iPad + PC
========================================================= */

const activePointers=
  new Map();

function bindHold(
  id,
  property
){

  const el=
    document.getElementById(id);

  el.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      el.setPointerCapture?.(
        e.pointerId
      );

      activePointers.set(
        e.pointerId,
        id
      );

      input[property]=true;

      el.classList.add("on");
    },
    {passive:false}
  );

  const release=e=>{

    e.preventDefault();

    activePointers.delete(
      e.pointerId
    );

    input[property]=false;

    if(
      ![...activePointers.values()]
        .includes(id)
    ){
      el.classList.remove("on");
    }
  };

  el.addEventListener(
    "pointerup",
    release,
    {passive:false}
  );

  el.addEventListener(
    "pointercancel",
    release,
    {passive:false}
  );

  el.addEventListener(
    "lostpointercapture",
    release,
    {passive:false}
  );
}

const skidMarks=[];

function spawnSkid(
  x,
  z,
  heading
){

  if(
    Math.random()>.35
  ) return;

  const mesh =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        .32,.32
      ),
      skidMat.clone()
    );

  mesh.rotation.x=
    -Math.PI/2;

  mesh.rotation.z=
    heading;

  mesh.position.set(
    x,.021,z
  );

  scene.add(mesh);

  skidMarks.push({
    mesh,
    life:1.5
  });

  if(
    skidMarks.length>150
  ){

    const old=
      skidMarks.shift();

    scene.remove(
      old.mesh
    );

    old.mesh.geometry.dispose();
    old.mesh.material.dispose();
  }
}

/* =========================================================
   CAR PHYSICS
========================================================= */

function updateCar(dt){

  const forward=
    (input.forward?1:0)-
    (input.back?1:0);

  const steerInput=
    (input.left?1:0)-
    (input.right?1:0);

  carState.boosting=
    input.nitro &&
    carState.nitro>0 &&
    carState.speed>5;

  const targetMax=
    carState.boosting
    ?carState.boostSpeed
    :carState.maxSpeed;

  /* ACCELERATION */

  if(forward>0){

    carState.speed +=
      carState.accel*
      dt*
      (
        carState.boosting
        ?2.1
        :1
      );

  }else if(forward<0){

    carState.speed -=
      carState.brake*
      dt;

  }else{

    const amount=
      carState.friction*dt;

    if(carState.speed>0){

      carState.speed=
        Math.max(
          0,
          carState.speed-amount
        );

    }else if(
      carState.speed<0
    ){

      carState.speed=
        Math.min(
          0,
          carState.speed+amount
        );
    }
  }

  carState.speed=
    THREE.MathUtils.clamp(
      carState.speed,
      -35,
      targetMax
    );

  /* NITRO */

  if(
    carState.boosting
  ){

    carState.nitro=
      Math.max(
        0,
        carState.nitro-
        32*dt
      );

  }else{

    carState.nitro=
      Math.min(
        100,
        carState.nitro+
        14*dt
      );
  }

  /* STEERING */

  const steerFactor=
    THREE.MathUtils.clamp(
      Math.abs(carState.speed)/25,
      0,
      1
    );

  /*
    Дрифт:
    чем выше скорость и
    сильнее поворот,
    тем сильнее скольжение.
  */

  const targetDrift=
    Math.abs(steerInput)*
    steerFactor;

  carState.drift +=
    (
      targetDrift-
      carState.drift
    )*
    Math.min(
      1,
      dt*7
    );

  carState.heading +=
    steerInput*
    carState.steer*
    steerFactor*
    dt*
    (
      carState.speed>=0
      ?1
      :-1
    );

  /* JUMP */

  if(carState.airborne){

    carState.verticalVel -=
      26*dt;

    carState.y +=
      carState.verticalVel*dt;

    if(
      carState.y<=0
    ){

      carState.y=0;

      carState.verticalVel=0;

      carState.airborne=false;

    }

    carState.speed *=
      Math.max(
        0,
        1-.35*dt
      );
  }

  /* MOVE */

  car.position.x +=
    Math.sin(
      carState.heading
    )*
    carState.speed*
    dt;

  car.position.z +=
    Math.cos(
      carState.heading
    )*
    carState.speed*
    dt;

  car.position.y=
    carState.y;

  /* ROTATION */

  const targetRoll=
    -steerInput*
    .2*
    steerFactor;

  car.rotation.z +=
    (
      targetRoll-
      car.rotation.z
    )*
    Math.min(
      1,
      8*dt
    );

  car.rotation.y=
    carState.heading;

  const targetPitch=
    carState.airborne
    ?-carState.verticalVel*.014
    :0;

  car.rotation.x +=
    (
      targetPitch-
      car.rotation.x
    )*
    Math.min(
      1,
      5*dt
    );

  /* BRAKE LIGHTS */

  const braking=
    input.back &&
    carState.speed>2;

  const targetBrake=
    braking?8:0;

  brakeLightL.intensity +=
    (
      targetBrake-
      brakeLightL.intensity
    )*
    Math.min(
      1,
      dt*12
    );

  brakeLightR.intensity=
    brakeLightL.intensity;

  /* SKID */

  if(
    carState.drift>.25 &&
    Math.abs(carState.speed)>25 &&
    !carState.airborne
  ){

    const bx=
      car.position.x-
      Math.sin(
        carState.heading
      )*1.55;

    const bz=
      car.position.z-
      Math.cos(
        carState.heading
      )*1.55;

    spawnSkid(
      bx-
      Math.cos(carState.heading)*1.15,

      bz+
      Math.sin(carState.heading)*1.15,

      carState.heading
    );

    spawnSkid(
      bx+
      Math.cos(carState.heading)*1.15,

      bz-
      Math.sin(carState.heading)*1.15,

      carState.heading
    );
  }

  /* UPDATE SKIDS */

  for(
    let i=skidMarks.length-1;
    i>=0;
    i--
  ){

    const s=
      skidMarks[i];

    s.life-=dt;

    s.mesh.material.opacity=
      Math.max(
        0,
        s.life/1.5
      )*.45;

    if(
      s.life<=0
    ){

      scene.remove(
        s.mesh
      );

      s.mesh.geometry.dispose();
      s.mesh.material.dispose();

      skidMarks.splice(
        i,
        1
      );
    }
  }

  /* =====================================================
     BUILDING COLLISIONS
  ===================================================== */

  if(!carState.airborne){

    for(
      const c of collidables
    ){

      const dx=
        car.position.x-c.x;

      const dz=
        car.position.z-c.z;

      const overlapX=
        c.w-
        Math.abs(dx);

      const overlapZ=
        c.d-
        Math.abs(dz);

      if(
        overlapX>0 &&
        overlapZ>0
      ){

        if(
          overlapX<overlapZ
        ){

          const dir=
            dx===0
            ?1
            :Math.sign(dx);

          car.position.x +=
            dir*overlapX;

        }else{

          const dir=
            dz===0
            ?1
            :Math.sign(dz);

          car.position.z +=
            dir*overlapZ;
        }

        carState.speed*=.25;
      }
    }
  }

  /* =====================================================
     WHEEL ROTATION
  ===================================================== */

  wheelsGroup.children
    .forEach(obj=>{

      if(
        obj.userData.isWheel
      ){

        /*
          Исправленная ось вращения.
        */

        obj.rotation.x +=
          carState.speed*
          dt*
          2.2;
      }
    });

  /* =====================================================
     TURBINES
  ===================================================== */

  turbineGroup.children
    .forEach(obj=>{

      if(
        obj.geometry &&
        obj.geometry.type===
        "CylinderGeometry"
      ){

        obj.rotation.z +=
          dt*
          (
            8+
            Math.abs(
              carState.speed
            )*.35
          );
      }
    });

  /* =====================================================
     NEON PULSE
  ===================================================== */

  const time=
    performance.now()*.005;

  const pulse=
    7+
    Math.sin(time)*2+
    Math.abs(
      carState.speed
    )*.055;

  underglow.intensity=
    pulse;

  underglow2.intensity=
    pulse;

  underglow3.intensity=
    pulse*.55;

  /*
    Нитро визуально усиливает подсветку.
  */

  if(
    carState.boosting
  ){

    underglow.intensity*=1.6;
    underglow2.intensity*=1.6;
  }
}

/* =========================================================
   CAMERA
========================================================= */

const camPos=
  new THREE.Vector3();

const camTarget=
  new THREE.Vector3();

function updateCamera(dt){

  let back;
  let height;
  let look;

  if(camMode===0){

    back=-10;
    height=4.5;
    look=10;

  }else if(camMode===1){

    back=-.3;
    height=1.4;
    look=8;

  }else{

    back=-16;
    height=7;
    look=12;
  }

  const sinH=
    Math.sin(
      carState.heading
    );

  const cosH=
    Math.cos(
      carState.heading
    );

  camPos.set(

    car.position.x+
    sinH*back,

    car.position.y+
    height,

    car.position.z+
    cosH*back
  );

  camTarget.set(

    car.position.x+
    sinH*look,

    car.position.y+
    1.2,

    car.position.z+
    cosH*look
  );

  /*
    Плавная камера.
  */

  const smooth=
    camMode===1
    ?1
    :1-Math.pow(
      .0015,
      dt
    );

  camera.position.lerp(
    camPos,
    smooth
  );

  camera.lookAt(
    camTarget
  );

  const targetFov=
    72+
    Math.abs(
      carState.speed
    )*.25+
    (
      carState.boosting
      ?14
      :0
    );

  camera.fov +=
    (
      targetFov-
      camera.fov
    )*
    Math.min(
      1,
      4*dt
    );

  camera.updateProjectionMatrix();
}

/* =========================================================
   DRONES
========================================================= */

const drones=[];

const droneColors=[
  0xff00ff,
  0x00ffff,
  0xff0066,
  0x00ff88
];

for(let i=0;i<35;i++){

  const drone=
    new THREE.Group();

  const color=
    droneColors[
      Math.floor(
        Math.random()*
        droneColors.length
      )
    ];

  const body=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .8,8,8
      ),
      new THREE.MeshBasicMaterial({
        color
      })
    );

  drone.add(body);

  const light=
    new THREE.PointLight(
      color,
      2.5,
      18,
      2
    );

  drone.add(light);

  drone.position.set(

    (Math.random()-.5)*900,

    30+Math.random()*150,

    (Math.random()-.5)*900

  );

  drone.userData={
    speed:.3+
      Math.random()*.7,

    angle:
      Math.random()*Math.PI*2,

    baseY:
      30+
      Math.random()*150
  };

  scene.add(drone);

  drones.push(drone);
}

function updateDrones(dt){

  const t=
    performance.now()*.0005;

  drones.forEach(
    (drone,i)=>{

      drone.userData.angle +=
        drone.userData.speed*
        dt;

      drone.position.x +=
        Math.cos(
          drone.userData.angle+i
        )*.4;

      drone.position.z +=
        Math.sin(
          drone.userData.angle+i
        )*.4;

      drone.position.y=
        drone.userData.baseY+
        Math.sin(
          t+i
        )*1.5;

      drone.rotation.y +=
        dt*2;
    }
  );
}

/* =========================================================
   RAIN UPDATE
========================================================= */

function updateRain(dt){

  const p=
    rain.geometry.attributes
      .position.array;

  for(
    let i=0;
    i<rainCount;
    i++
  ){

    p[i*3+1]-=
      80*dt;

    if(
      p[i*3+1]<0
    ){

      p[i*3+1]=140;

      p[i*3]=
        car.position.x+
        (Math.random()-.5)*220;

      p[i*3+2]=
        car.position.z+
        (Math.random()-.5)*220;
    }
  }

  rain.geometry.attributes
    .position
    .needsUpdate=true;
}

/* =========================================================
   HUD
========================================================= */

const speedEl=
  document.querySelector(
    "#speedo b"
  );

const nitroFill=
  document.getElementById(
    "nitroFill"
  );

const mapCanvas=
  document.getElementById(
    "mapCanvas"
  );

const mapCtx=
  mapCanvas.getContext(
    "2d"
  );

function updateHUD(){

  const kmh=
    Math.abs(
      carState.speed
    )*3.6|0;

  speedEl.textContent=
    kmh;

  let gear;

  if(carState.airborne)
    gear="F";
  else if(kmh<5)
    gear="N";
  else if(kmh<40)
    gear=1;
  else if(kmh<80)
    gear=2;
  else if(kmh<130)
    gear=3;
  else if(kmh<200)
    gear=4;
  else
    gear=5;

  document
    .querySelector("#info b")
    .textContent=gear;

  document
    .getElementById("styleName")
    .textContent=
      carStyles[
        currentStyle
      ].name;

  nitroFill.style.width=
    carState.nitro+"%";
}

/* =========================================================
   MINIMAP
========================================================= */

let mapTimer=0;

function drawMap(){

  const W=
    mapCanvas.width;

  const H=
    mapCanvas.height;

  mapCtx.clearRect(
    0,
    0,
    W,
    H
  );

  mapCtx.save();

  mapCtx.translate(
    W/2,
    H/2
  );

  mapCtx.rotate(
    -carState.heading
  );

  const scale=.13;

  mapCtx.fillStyle=
    "rgba(255,0,255,.55)";

  for(
    const c of collidables
  ){

    const x=
      (c.x-
       car.position.x)*
      scale;

    const z=
      (c.z-
       car.position.z)*
      scale;

    if(
      Math.abs(x)<W/2 &&
      Math.abs(z)<H/2
    ){

      mapCtx.fillRect(
        x-1.5,
        z-1.5,
        3,
        3
      );
    }
  }

  mapCtx.fillStyle="#0ff";

  mapCtx.shadowColor="#0ff";
  mapCtx.shadowBlur=12;

  mapCtx.beginPath();

  mapCtx.moveTo(
    0,
    -9
  );

  mapCtx.lineTo(
    -5,
    6
  );

  mapCtx.lineTo(
    5,
    6
  );

  mapCtx.closePath();

  mapCtx.fill();

  mapCtx.restore();
}

/* =========================================================
   START
========================================================= */

const splash=
  document.getElementById(
    "splash"
  );

document
  .getElementById("startBtn")
  .addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      initAudio();

      splash.style.opacity=0;

      setTimeout(
        ()=>{
          splash.style.display="none";
        },
        500
      );

    },
    {passive:false}
  );

document.getElementById(
  "loading"
).textContent=
  "ГОРОД ГОТОВ";

/* =========================================================
   GAME LOOP
========================================================= */

const clock=
  new THREE.Clock();

let lastTime=
  performance.now();

function loop(){

  requestAnimationFrame(
    loop
  );

  /*
    Защита от огромного dt,
    если вкладка была свернута.
  */

  const now=
    performance.now();

  const dt=
    Math.min(
      (now-lastTime)/1000,
      .05
    );

  lastTime=now;

  updateCar(dt);

  updateCamera(dt);

  updateDrones(dt);

  updateRain(dt);

  updateHUD();

  /*
    Миникарта обновляется
    не 60 раз в секунду,
    а примерно 20.
  */

  mapTimer+=dt;

  if(mapTimer>.05){

    drawMap();

    mapTimer=0;
  }

  renderer.render(
    scene,
    camera
  );
}

loop();

/* =========================================================
   RESIZE
========================================================= */

addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        devicePixelRatio,
        1.35
      )
    );
  }
);

/* =========================================================
   MOBILE GESTURES
========================================================= */

document.addEventListener(
  "gesturestart",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gesturechange",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "gestureend",
  e=>{
    e.preventDefault();
  },
  {passive:false}
);

document.addEventListener(
  "contextmenu",
  e=>{
    e.preventDefault();
  }
);

</script>
