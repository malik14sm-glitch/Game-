<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Neon Drift: Cyber Chronicles — Prototype</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#05010f;font-family:'Orbitron',monospace;color:#0ff}
  #hud{position:absolute;inset:0;pointer-events:none}
  #speedo{position:absolute;bottom:24px;left:24px;padding:12px 20px;border:1px solid #0ff;border-radius:8px;background:rgba(0,10,30,.55);box-shadow:0 0 20px #0ff;font-size:14px;letter-spacing:2px}
  #speedo b{font-size:34px;color:#f0f;text-shadow:0 0 12px #f0f}
  #gear{position:absolute;bottom:24px;left:220px;padding:12px 20px;border:1px solid #f0f;border-radius:8px;background:rgba(30,0,30,.55);box-shadow:0 0 20px #f0f;font-size:14px}
  #gear b{font-size:28px;color:#0ff}
  #map{position:absolute;top:24px;right:24px;width:180px;height:180px;border:1px solid #0ff;border-radius:50%;background:rgba(0,10,30,.55);box-shadow:0 0 24px #0ff;overflow:hidden}
  #map canvas{width:100%;height:100%}
  #horn{position:absolute;bottom:24px;right:24px;padding:10px 18px;border:1px solid #ff0;color:#ff0;border-radius:8px;background:rgba(40,30,0,.5);font-size:12px;letter-spacing:2px}
  #hint{position:absolute;top:16px;left:16px;font-size:12px;line-height:1.7;opacity:.85;text-shadow:0 0 8px #0ff}
  #hint span{color:#f0f}
  #title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:42px;letter-spacing:8px;color:#f0f;text-shadow:0 0 24px #f0f;pointer-events:none;transition:opacity 1s}
</style>
</head>
<body>
<div id="hud">
  <div id="title">NEON DRIFT</div>
  <div id="hint">
    <span>W/S</span> — газ/тормоз &nbsp; <span>A/D</span> — руль &nbsp; <span>SHIFT</span> — нитро<br>
    <span>SPACE</span> — прыжок/полёт &nbsp; <span>H</span> — гудок &nbsp; <span>C</span> — камера<br>
    <span>R</span> — сменить стиль машины (20+)
  </div>
  <div id="speedo">SPEED <b>0</b> km/h</div>
  <div id="gear">GEAR <b>N</b> · MODE <b>DRIVE</b></div>
  <div id="map"><canvas id="mapCanvas" width="180" height="180"></canvas></div>
  <div id="horn">[ H ] HORN</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   1. СЦЕНА, ТУМАН, ОСВЕЩЕНИЕ (нео-нуар, cyan/magenta)
   ============================================================ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05010f);
scene.fog = new THREE.FogExp2(0x0a0320, 0.018);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 2000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x334466, 0.6));
const key = new THREE.DirectionalLight(0xff44ff, 0.4);
key.position.set(0, 100, 50);
scene.add(key);
const rim = new THREE.DirectionalLight(0x00ffff, 0.5);
rim.position.set(-80, 60, -100);
scene.add(rim);

/* ============================================================
   2. ГОРОД — процедурная генерация киберпанк-каньона
   ============================================================ */
const cityGroup = new THREE.Group();
scene.add(cityGroup);
const collidables = [];
const blockSize = 40;
const citySize = 15; // 15x15 кварталов

function makeSkyscraper(x, z){
  const h = 40 + Math.random() * 180;
  const w = 14 + Math.random() * 10;
  const d = 14 + Math.random() * 10;
  const geo = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x0a0a18,
    metalness: 0.7,
    roughness: 0.35,
    emissive: new THREE.Color(Math.random() > .5 ? 0x001a2a : 0x2a0020),
    emissiveIntensity: 0.4
  });
  const b = new THREE.Mesh(geo, mat);
  b.position.set(x, h/2, z);
  b.castShadow = b.receiveShadow = true;
  cityGroup.add(b);
  collidables.push({ x, z, w: w/2 + 3, d: d/2 + 3 });

  // Неоновые вывески — горизонтальные полосы
  const signColor = [0x00ffff, 0xff00ff, 0xff0066, 0x00ffaa][Math.floor(Math.random()*4)];
  const signGeo = new THREE.PlaneGeometry(w*0.9, 1.5 + Math.random()*3);
  const signMat = new THREE.MeshBasicMaterial({ color: signColor });
  for(let i=0; i<3 + Math.floor(Math.random()*4); i++){
    const s = new THREE.Mesh(signGeo, signMat);
    const y = 10 + Math.random() * (h - 20);
    const side = Math.floor(Math.random()*4);
    s.position.copy(b.position);
    s.position.y = y;
    if(side===0){ s.position.z += d/2 + 0.05; }
    else if(side===1){ s.position.z -= d/2 + 0.05; s.rotation.y = Math.PI; }
    else if(side===2){ s.position.x += w/2 + 0.05; s.rotation.y = Math.PI/2; }
    else { s.position.x -= w/2 + 0.05; s.rotation.y = -Math.PI/2; }
    cityGroup.add(s);
  }
  // Верхний маяк
  const beacon = new THREE.PointLight(signColor, 6, 40);
  beacon.position.set(x, h + 4, z);
  cityGroup.add(beacon);
}

for(let i=-citySize; i<=citySize; i++){
  for(let j=-citySize; j<=citySize; j++){
    if(Math.abs(i)%2===0 && Math.abs(j)%2===0) continue; // дороги
    makeSkyscraper(i*blockSize, j*blockSize);
  }
}

/* Небесные мосты-переходы */
const bridgeMat = new THREE.MeshStandardMaterial({
  color: 0x111122, emissive: 0x00ffff, emissiveIntensity: 0.6,
  metalness:0.8, roughness:0.3
});
for(let i=0; i<12; i++){
  const len = 60 + Math.random()*80;
  const br = new THREE.Mesh(new THREE.BoxGeometry(len, 1.5, 4), bridgeMat);
  br.position.set((Math.random()-0.5)*800, 60 + Math.random()*80, (Math.random()-0.5)*800);
  br.rotation.y = Math.random() * Math.PI;
  cityGroup.add(br);
}

/* Дроны */
const drones = [];
for(let i=0; i<60; i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.6, 8, 8),
    new THREE.MeshBasicMaterial({ color: Math.random()>.5 ? 0xff00ff : 0x00ffff })
  );
  g.add(body);
  const light = new THREE.PointLight(0x00ffff, 2, 15);
  g.add(light);
  g.position.set((Math.random()-0.5)*900, 30 + Math.random()*150, (Math.random()-0.5)*900);
  g.userData = { speed: 0.2 + Math.random()*0.5, radius: 15 + Math.random()*30, angle: Math.random()*Math.PI*2 };
  scene.add(g);
  drones.push(g);
}

/* Земля — мокрый асфальт с отражениями */
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x050510, metalness: 0.9, roughness: 0.15
});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

/* Разметка дорог — неоновые линии */
const roadLineMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent:true, opacity:0.7 });
for(let i=-citySize-1; i<=citySize+1; i++){
  const g1 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(i*blockSize, 0.05, -citySize*blockSize - 100),
    new THREE.Vector3(i*blockSize, 0.05,  citySize*blockSize + 100)
  ]);
  const g2 = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-citySize*blockSize - 100, 0.05, i*blockSize),
    new THREE.Vector3( citySize*blockSize + 100, 0.05, i*blockSize)
  ]);
  scene.add(new THREE.Line(g1, roadLineMat));
  scene.add(new THREE.Line(g2, roadLineMat));
}

/* ============================================================
   3. ДОЖДЬ — частицы
   ============================================================ */
const rainCount = 4000;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(rainCount * 3);
for(let i=0; i<rainCount; i++){
  rainPos[i*3]   = (Math.random()-0.5) * 200;
  rainPos[i*3+1] = Math.random() * 120;
  rainPos[i*3+2] = (Math.random()-0.5) * 200;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.Points(rainGeo, new THREE.PointsMaterial({
  color: 0x88ddff, size: 0.12, transparent:true, opacity:0.6
}));
scene.add(rain);

/* ============================================================
   4. МАШИНА — базовая модель + 20+ конфигураций
   ============================================================ */
/* Стили машины меняют обвес, цвет подсветки, «роботизацию» */
const carStyles = [
  { name:'Spectre',    body:0x101018, neon:0x00ffff, wings:false, turbines:1, robotic:0.2 },
  { name:'Ronin',      body:0x1a0a0a, neon:0xff0044, wings:true,  turbines:2, robotic:0.3 },
  { name:'Chrome',     body:0xdddddd, neon:0xff00ff, wings:false, turbines:2, robotic:0.1 },
  { name:'Wraith',     body:0x0a0a2a, neon:0x6600ff, wings:true,  turbines:3, robotic:0.5 },
  { name:'Mecha-01',   body:0x222228, neon:0x00ff88, wings:true,  turbines:2, robotic:0.9 },
  { name:'Mecha-02',   body:0x2a1a10, neon:0xffaa00, wings:true,  turbines:3, robotic:0.95 },
  { name:'Neon Samurai',body:0x180020,neon:0xff0066, wings:false, turbines:2, robotic:0.4 },
  { name:'Ghost',      body:0xeeeeee, neon:0x00ffff, wings:false, turbines:1, robotic:0.15 },
  { name:'Vortex',     body:0x0a1a2a, neon:0x00aaff, wings:true,  turbines:3, robotic:0.6 },
  { name:'Kitsune',    body:0x2a0a1a, neon:0xff44aa, wings:false, turbines:2, robotic:0.35 },
  { name:'Titan',      body:0x111111, neon:0xff2200, wings:true,  turbines:4, robotic:0.7 },
  { name:'Prism',      body:0x445566, neon:0x88ffff, wings:false, turbines:2, robotic:0.2 },
  { name:'Razor',      body:0x0a0a0a, neon:0xff00ff, wings:true,  turbines:2, robotic:0.55 },
  { name:'Aurora',     body:0x203040, neon:0x00ffcc, wings:false, turbines:3, robotic:0.45 },
  { name:'Bullet',     body:0x330000, neon:0xff3300, wings:false, turbines:1, robotic:0.25 },
  { name:'Zero',       body:0x000000, neon:0xffffff, wings:true,  turbines:2, robotic:0.5 },
  { name:'Hannya',     body:0x200010, neon:0xff1155, wings:true,  turbines:3, robotic:0.65 },
  { name:'Specter-X',  body:0x0a0a1a, neon:0x00eeff, wings:true,  turbines:4, robotic:0.8 },
  { name:'Chrome-2',   body:0xbbbbcc, neon:0xaa00ff, wings:false, turbines:2, robotic:0.3 },
  { name:'Nyx',        body:0x050510, neon:0x7700ff, wings:true,  turbines:3, robotic:0.75 },
  { name:'Ember',      body:0x220a00, neon:0xff6600, wings:false, turbines:2, robotic:0.4 },
  { name:'Halo',       body:0x101820, neon:0xaaffff, wings:false, turbines:4, robotic:0.85 }
];

let currentStyle = 0;

/* Хранилище динамических частей машины для пересборки */
const car = new THREE.Group();
scene.add(car);

/* Подсветка под днищем (neon underglow) */
const underglow = new THREE.PointLight(0x00ffff, 8, 18);
underglow.position.set(0, -0.6, 0);
car.add(underglow);
const underglow2 = new THREE.PointLight(0x00ffff, 8, 18);
underglow2.position.set(0, -0.6, -2);
car.add(underglow2);

/* Передние фары */
const headlightL = new THREE.SpotLight(0xffffff, 4, 60, Math.PI/6, 0.5, 1.5);
headlightL.position.set(-0.9, 0.6, 2.2);
headlightL.target.position.set(-1, 0, 20);
car.add(headlightL, headlightL.target);
const headlightR = headlightL.clone();
headlightR.position.x = 0.9;
headlightR.target.position.x = 1;
car.add(headlightR, headlightR.target);

/* Динамические группы для смены обвеса */
const bodyGroup = new THREE.Group(); car.add(bodyGroup);
const neonGroup = new THREE.Group(); car.add(neonGroup);
const wingGroup = new THREE.Group(); car.add(wingGroup);
const turbineGroup = new THREE.Group(); car.add(turbineGroup);
const roboticGroup = new THREE.Group(); car.add(roboticGroup);

function buildCar(style){
  // Очистка
  [bodyGroup, neonGroup, wingGroup, turbineGroup, roboticGroup].forEach(g=>{
    while(g.children.length){ const c = g.children.pop(); c.geometry?.dispose?.(); c.material?.dispose?.(); g.remove(c); }
  });

  const bodyMat = new THREE.MeshStandardMaterial({
    color: style.body, metalness: 0.9, roughness: 0.25,
    envMapIntensity: 1.5
  });

  // Основной корпус — низкий, широкий, ретро-футуризм
  const hull = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.5, 4.6), bodyMat);
  hull.position.y = 0.5;
  hull.castShadow = true;
  bodyGroup.add(hull);

  // Кабина
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.6, 0.55, 1.8),
    new THREE.MeshStandardMaterial({ color: 0x000814, metalness:1, roughness:0.05,
      emissive: style.neon, emissiveIntensity:0.15 })
  );
  cabin.position.set(0, 0.98, -0.2);
  bodyGroup.add(cabin);

  // Нос
  const nose = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.35, 1.0), bodyMat);
  nose.position.set(0, 0.55, 2.2);
  bodyGroup.add(nose);

  // Задний спойлер (базовый)
  const tail = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.25, 0.6), bodyMat);
  tail.position.set(0, 0.75, -2.2);
  bodyGroup.add(tail);

  // Колёса / гравитационные подушки
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x111111, metalness:0.8, roughness:0.4 });
  const wheelGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.35, 16);
  [[-1.1,0.45,1.5],[1.1,0.45,1.5],[-1.1,0.45,-1.5],[1.1,0.45,-1.5]].forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(...p);
    w.castShadow = true;
    bodyGroup.add(w);
  });

  // Неоновая подсветка по бортам
  const neonMat = new THREE.MeshBasicMaterial({ color: style.neon });
  const stripGeo = new THREE.BoxGeometry(0.06, 0.06, 4.2);
  const sL = new THREE.Mesh(stripGeo, neonMat); sL.position.set(-1.12, 0.35, 0);
  const sR = new THREE.Mesh(stripGeo, neonMat); sR.position.set( 1.12, 0.35, 0);
  neonGroup.add(sL, sR);
  const frontStrip = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.06, 0.06), neonMat);
  frontStrip.position.set(0, 0.35, 2.35);
  neonGroup.add(frontStrip);

  // Крылья (роботизированная часть)
  if(style.wings){
    const wingMat = new THREE.MeshStandardMaterial({ color: style.body, metalness:0.9, roughness:0.3,
      emissive: style.neon, emissiveIntensity: 0.2 });
    for(const sgn of [-1,1]){
      const w = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.08, 0.6), wingMat);
      w.position.set(sgn*1.5, 1.15, -2.0);
      w.rotation.z = sgn * 0.25;
      w.castShadow = true;
      wingGroup.add(w);
      const tip = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.5), neonMat);
      tip.position.set(sgn*2.15, 1.2, -2.0);
      wingGroup.add(tip);
    }
  }

  // Турбины
  const turbMat = new THREE.MeshStandardMaterial({ color:0x222228, metalness:1, roughness:0.2,
    emissive: style.neon, emissiveIntensity:0.5 });
  const positions = [
    [ 0, 1.1, -2.4], [ 0, 0.6, -2.6], [-0.7, 0.7, -2.4], [ 0.7, 0.7, -2.4]
  ];
  for(let i=0; i<style.turbines && i<positions.length; i++){
    const t = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 0.5, 12), turbMat);
    t.rotation.x = Math.PI/2;
    t.position.set(...positions[i]);
    turbineGroup.add(t);
  }

  // «Роботизированные» сегменты — чем выше robotic, тем больше деталей
  const ribCount = Math.floor(style.robotic * 6);
  const ribMat = new THREE.MeshStandardMaterial({ color: 0x1a1a20, metalness:1, roughness:0.3,
    emissive: style.neon, emissiveIntensity: 0.3 });
  for(let i=0; i<ribCount; i++){
    const rib = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.05, 0.15), ribMat);
    rib.position.set(0, 0.75, -1.5 + i*0.35);
    roboticGroup.add(rib);
  }

  // Обновить свет
  underglow.color.set(style.neon);
  underglow2.color.set(style.neon);
  document.getElementById('title').textContent = 'NEON DRIFT · ' + style.name;
  document.getElementById('title').style.opacity = 1;
  setTimeout(()=>{ document.getElementById('title').style.opacity = 0; }, 1200);
}

buildCar(carStyles[currentStyle]);

/* ============================================================
   5. ФИЗИКА / УПРАВЛЕНИЕ
   ============================================================ */
const carState = {
  speed: 0,
  maxSpeed: 90,
  boostSpeed: 140,
  accel: 40,
  brake: 60,
  friction: 18,
  steer: 1.8,
  heading: 0,
  verticalVel: 0,
  y: 0,
  mode: 'DRIVE', // DRIVE | FLY
  gear: 1,
  nitro: 100,
  boosting: false,
  airborne: false
};

const keys = {};
addEventListener('keydown', e=>{
  keys[e.code] = true;
  if(e.code === 'KeyH') horn();
  if(e.code === 'KeyR'){
    currentStyle = (currentStyle + 1) % carStyles.length;
    buildCar(carStyles[currentStyle]);
  }
  if(e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if(e.code === 'Space'){
    if(!carState.airborne){
      carState.airborne = true;
      carState.verticalVel = 22;
      carState.mode = 'FLY';
    }
  }
});
addEventListener('keyup', e=>{ keys[e.code] = false; });

let camMode = 0; // 0 third-person, 1 first-person, 2 far chase

/* Гудок */
function horn(){
  const ctx = new (AudioContext || webkitAudioContext)();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.value = 220;
  g.gain.value = 0.0001;
  o.connect(g); g.connect(ctx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
  o.stop(ctx.currentTime + 0.55);
}

/* ============================================================
   6. ОБНОВЛЕНИЕ КАЖДЫЙ КАДР
   ============================================================ */
const clock = new THREE.Clock();
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();
let cameraLerp = 1;

function updateCar(dt){
  const forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
  const steerInput = (keys['KeyA'] ? 1 : 0) - (keys['KeyD'] ? 1 : 0);
  carState.boosting = !!keys['ShiftLeft'] && carState.nitro > 0;

  // Разгон / торможение
  const targetMax = carState.boosting ? carState.boostSpeed : carState.maxSpeed;
  if(forward > 0){
    carState.speed += carState.accel * dt * (carState.boosting ? 1.8 : 1);
  } else if(forward < 0){
    carState.speed -= carState.brake * dt;
  } else {
    // трение
    if(carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.friction * dt);
    if(carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.friction * dt);
  }
  carState.speed = THREE.MathUtils.clamp(carState.speed, -30, targetMax);

  if(carState.boosting){
    carState.nitro = Math.max(0, carState.nitro - 30 * dt);
  } else {
    carState.nitro = Math.min(100, carState.nitro + 12 * dt);
  }

  // Руль — зависит от скорости
  const steerFactor = THREE.MathUtils.clamp(carState.speed / 30, 0, 1);
  carState.heading += steerInput * carState.steer * steerFactor * dt * (carState.speed >= 0 ? 1 : -1);

  // Гравитация / полёт
  if(carState.airborne){
    carState.verticalVel -= 25 * dt;
    carState.y += carState.verticalVel * dt;
    if(carState.y <= 0){
      carState.y = 0;
      carState.verticalVel = 0;
      carState.airborne = false;
      carState.mode = 'DRIVE';
    }
    // В полёте гасим скорость
    carState.speed *= (1 - 0.4 * dt);
  } else {
    carState.mode = 'DRIVE';
  }

  // Применяем позицию
  car.position.x += Math.sin(carState.heading) * carState.speed * dt;
  car.position.z += Math.cos(carState.heading) * carState.speed * dt;
  car.position.y = carState.y;

  // Наклон в повороте
  const targetRoll = -steerInput * 0.15 * steerFactor;
  car.rotation.z += (targetRoll - car.rotation.z) * 8 * dt;
  car.rotation.y = carState.heading;
  // Пикирование в полёте
  const targetPitch = carState.airborne ? -carState.verticalVel * 0.012 : 0;
  car.rotation.x += (targetPitch - car.rotation.x) * 5 * dt;

  // Простая коллизия со зданиями (AABB)
  for(const c of collidables){
    const dx = car.position.x - c.x;
    const dz = car.position.z - c.z;
    const px = c.w + 1.2 - Math.abs(dx);
    const pz = c.d + 1.2 - Math.abs(dz);
    if(px > 0 && pz > 0){
      // Выталкиваем по меньшей оси
      if(px < pz) car.position.x += Math.sign(dx) * px;
      else car.position.z += Math.sign(dz) * pz;
      carState.speed *= 0.5;
    }
  }

  // Колёса-турбины вращаются
  turbineGroup.children.forEach((t, i)=>{
    t.rotation.z += dt * 20 * (1 + Math.abs(carState.speed)/50);
  });

  // Гирлянда под днищем мерцает
  const t = performance.now() * 0.005;
  const intensity = 6 + Math.sin(t) * 2 + Math.abs(carState.speed) * 0.05;
  underglow.intensity = underglow2.intensity = intensity;
}

function updateCamera(dt){
  const camOffsetBack = camMode === 0 ? -9 : camMode === 2 ? -14 : -0.1;
  const camHeight   = camMode === 0 ? 4   : camMode === 2 ? 6   : 1.35;
  const lookAhead   = camMode === 1 ? 0 : 8;

  const sinH = Math.sin(carState.heading);
  const cosH = Math.cos(carState.heading);

  camPos.set(
    car.position.x + sinH * camOffsetBack,
    car.position.y + camHeight + (camMode===1 ? 0.15 : 0),
    car.position.z + cosH * camOffsetBack
  );
  camTarget.set(
    car.position.x + sinH * lookAhead,
    car.position.y + 1.2,
    car.position.z + cosH * lookAhead
  );

  // Камера следует с задержкой, добавляя динамики
  const lerp = camMode === 1 ? 1 : 1 - Math.pow(0.001, dt);
  camera.position.lerp(camPos, lerp);
  camera.lookAt(camTarget);

  // FOV эффект скорости
  const targetFov = 70 + Math.abs(carState.speed) * 0.25 + (carState.boosting ? 12 : 0);
  camera.fov += (targetFov - camera.fov) * 3 * dt;
  camera.updateProjectionMatrix();
}

function updateDrones(dt){
  const t = performance.now() * 0.0005;
  drones.forEach((d, i)=>{
    d.userData.angle += d.userData.speed * dt;
    d.position.x += Math.cos(d.userData.angle + i) * 0.3;
    d.position.z += Math.sin(d.userData.angle + i) * 0.3;
    d.position.y += Math.sin(t + i) * 0.05;
  });
}

function updateRain(dt){
  const p = rain.geometry.attributes.position.array;
  for(let i=0; i<rainCount; i++){
    p[i*3+1] -= 60 * dt;
    if(p[i*3+1] < 0){
      p[i*3+1] = 120;
      p[i*3]   = car.position.x + (Math.random()-0.5) * 200;
      p[i*3+2] = car.position.z + (Math.random()-0.5) * 200;
    }
  }
  rain.geometry.attributes.position.needsUpdate = true;
}

/* ============================================================
   7. HUD — спидометр, передача, миникарта
   ============================================================ */
const speedEl = document.querySelector('#speedo b');
const gearEl = document.querySelector('#gear b');
const modeEl = document.querySelector('#gear');

const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');

function updateHUD(){
  const kmh = Math.abs(carState.speed) * 3.6 | 0;
  speedEl.textContent = kmh;
  // «Передача» — виртуальная, от скорости
  const gear = carState.airborne ? 'F' : kmh < 5 ? 'N' : kmh < 40 ? 1 : kmh < 80 ? 2 : kmh < 130 ? 3 : kmh < 200 ? 4 : 5;
  gearEl.textContent = gear;
  modeEl.innerHTML = `GEAR <b>${gear}</b> · MODE <b>${carState.mode}</b> · N2O <b>${carState.nitro|0}%</b>`;
  modeEl.style.color = carState.boosting ? '#ff0' : '#0ff';
}

function drawMap(){
  const W = mapCanvas.width, H = mapCanvas.height;
  mapCtx.clearRect(0, 0, W, H);
  mapCtx.save();
  mapCtx.translate(W/2, H/2);
  mapCtx.rotate(-carState.heading);

  const scale = 0.06;
  // Здания
  mapCtx.fillStyle = 'rgba(255,0,255,0.35)';
  for(const c of collidables){
    const x = (c.x - car.position.x) * scale;
    const z = (c.z - car.position.z) * scale;
    if(Math.abs(x) < W/2 && Math.abs(z) < H/2){
      mapCtx.fillRect(x - 2, z - 2, 4, 4);
    }
  }
  // Игрок
  mapCtx.fillStyle = '#0ff';
  mapCtx.shadowColor = '#0ff'; mapCtx.shadowBlur = 10;
  mapCtx.beginPath();
  mapCtx.moveTo(0, -6);
  mapCtx.lineTo(-4, 4);
  mapCtx.lineTo(4, 4);
  mapCtx.closePath();
  mapCtx.fill();
  mapCtx.restore();
}

/* ============================================================
   8. ОСНОВНОЙ ЦИКЛ
   ============================================================ */
function loop(){
  const dt = Math.min(clock.getDelta(), 0.05);

  updateCar(dt);
  updateCamera(dt);
  updateDrones(dt);
  updateRain(dt);
  updateHUD();
  drawMap();

  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
