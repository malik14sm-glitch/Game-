<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>NEON HUNTER // Cyberpunk Shooter v2.0</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; overflow:hidden; background:#000; font-family: 'Courier New', monospace; }
  canvas { display:block; }
  #hud {
    position:fixed; top:15px; left:15px; color:#0ff; font-size:16px;
    text-shadow:0 0 10px #0ff; pointer-events:none; z-index:10;
  }
  #hud div { margin:4px 0; }
  .bar { width:220px; height:14px; border:1px solid #0ff; background:rgba(0,0,0,0.6); position:relative; }
  .bar > div { height:100%; transition:width 0.1s; }
  #hpFill { background:linear-gradient(90deg,#f0f,#0ff); width:100%; }
  #enFill { background:linear-gradient(90deg,#ff0,#f80); width:0%; }
  #waveInfo {
    position:fixed; top:15px; right:15px; color:#f0f; font-size:16px;
    text-shadow:0 0 10px #f0f; text-align:right; z-index:10;
  }
  #crosshair {
    position:fixed; top:50%; left:50%; width:20px; height:20px;
    transform:translate(-50%,-50%); pointer-events:none; z-index:10;
  }
  #crosshair::before, #crosshair::after {
    content:''; position:absolute; background:#0ff; box-shadow:0 0 8px #0ff;
  }
  #crosshair::before { left:9px; top:0; width:2px; height:20px; }
  #crosshair::after { top:9px; left:0; height:2px; width:20px; }
  #info {
    position:fixed; bottom:15px; left:50%; transform:translateX(-50%);
    color:#f0f; text-shadow:0 0 8px #f0f; font-size:12px; z-index:10;
    background:rgba(0,0,0,0.6); padding:6px 14px; border:1px solid #f0f;
    border-radius:4px; text-align:center;
  }
  #gameover {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,0.9); color:#f0f; font-size:52px;
    text-shadow:0 0 20px #f0f; z-index:100; flex-direction:column;
  }
  #gameover small { font-size:18px; color:#0ff; margin-top:20px; }
  #menu {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg, #0a0018, #1a0033, #0a0018);
    z-index:500; flex-direction:column;
  }
  #menu h1 {
    color:#f0f; font-size:72px; text-shadow:0 0 30px #f0f, 0 0 60px #f0f;
    letter-spacing:8px; margin:0 0 20px 0; animation: pulse 2s infinite;
  }
  #menu h2 {
    color:#0ff; font-size:18px; text-shadow:0 0 10px #0ff;
    letter-spacing:4px; margin:0 0 40px 0;
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 30px #f0f, 0 0 60px #f0f; }
    50% { text-shadow: 0 0 50px #f0f, 0 0 100px #f0f, 0 0 120px #0ff; }
  }
  .btn {
    padding:14px 40px; margin:8px; font-size:20px; letter-spacing:3px;
    background:transparent; color:#0ff; border:2px solid #0ff;
    cursor:pointer; font-family:inherit; text-shadow:0 0 8px #0ff;
    box-shadow:0 0 15px rgba(0,255,255,0.3), inset 0 0 15px rgba(0,255,255,0.1);
    transition:all 0.3s; border-radius:4px;
  }
  .btn:hover {
    background:#0ff; color:#000; text-shadow:none;
    box-shadow:0 0 30px #0ff, 0 0 60px #0ff;
  }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#000; color:#0ff; font-size:24px; z-index:600; flex-direction:column;
    font-family: monospace; letter-spacing:2px;
  }
  #loading .dot { animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:0.2; } }
  #err {
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:#200; color:#f66; font-size:14px; z-index:300; padding:40px;
    white-space:pre-wrap; overflow:auto; font-family:monospace;
  }
  .hitmark {
    position:fixed; pointer-events:none; color:#f00; font-size:30px;
    font-weight:bold; z-index:20; text-shadow:0 0 10px #f00;
    animation: hitFade 0.5s forwards;
  }
  @keyframes hitFade {
    0% { opacity:1; transform:scale(1); }
    100% { opacity:0; transform:scale(1.5); }
  }
  #damageOverlay {
    position:fixed; inset:0; pointer-events:none; z-index:15;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(255,0,0,0.5) 100%);
    opacity:0; transition:opacity 0.2s;
  }
  .killfeed {
    position:fixed; top:100px; right:15px; color:#0ff; font-size:14px;
    text-shadow:0 0 8px #0ff; z-index:10; text-align:right;
  }
  .killfeed div { margin:3px 0; animation: slideIn 0.3s; }
  @keyframes slideIn {
    from { transform: translateX(30px); opacity:0; }
    to { transform: translateX(0); opacity:1; }
  }
</style>
</head>
<body>

<div id="loading">ЗАГРУЗКА СИСТЕМЫ<span class="dot">...</span></div>
<div id="err"></div>
<div id="damageOverlay"></div>

<div id="menu">
  <h1>NEON HUNTER</h1>
  <h2>CYBERPUNK SHOOTER v2.0</h2>
  <button class="btn" id="btnPlay">ИГРАТЬ</button>
  <button class="btn" id="btnSettings">НАСТРОЙКИ</button>
  <button class="btn" id="btnHelp">УПРАВЛЕНИЕ</button>
  <div style="color:#0ff; margin-top:30px; font-size:12px; opacity:0.6;">
    v2.0 // УЛУЧШЕННАЯ ВЕРСИЯ
  </div>
</div>

<div id="hud" style="display:none;">
  <div>HP: <div class="bar"><div id="hpFill"></div></div></div>
  <div>ENERGY: <div class="bar"><div id="enFill"></div></div></div>
  <div id="score">SCORE: 0</div>
  <div id="kills">KILLS: 0</div>
  <div id="wave">WAVE: 1</div>
</div>
<div id="waveInfo" style="display:none;"></div>
<div id="crosshair" style="display:none;"></div>
<div id="info" style="display:none;">
  WASD — движение | SHIFT — бег | SPACE — прыжок (двойной) | ЛКМ — лазер | ПКМ (держать) — мега-лазер | E — мина | Q — аптечка
</div>
<div id="gameover" style="display:none;">
  СИСТЕМА УНИЧТОЖЕНА
  <div style="font-size:22px; color:#0ff; margin-top:20px;" id="finalScore"></div>
  <small>Нажми F5 для перезапуска</small>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
// ============== ЗАЩИТА ОТ ОШИБОК ==============
window.addEventListener('error', function(e) {
  const err = document.getElementById('err');
  err.style.display = 'flex';
  err.textContent = 'ОШИБКА:\n' + e.message + '\n\n' + (e.filename || '') + ':' + (e.lineno || '');
});

// ============== ЗВУКИ (Web Audio API, без файлов) ==============
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, duration, type, volume) {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) {}
}
function playLaser() { playSound(880, 0.1, 'sawtooth', 0.08); }
function playMegaLaser() {
  playSound(200, 0.5, 'sawtooth', 0.15);
  playSound(400, 0.5, 'square', 0.1);
}
function playExplosion() { playSound(60, 0.3, 'sawtooth', 0.15); }
function playHit() { playSound(1200, 0.05, 'square', 0.05); }
function playHurt() { playSound(150, 0.2, 'sawtooth', 0.1); }
function playPickup() { playSound(1500, 0.15, 'sine', 0.1); }
function playJump() { playSound(600, 0.1, 'sine', 0.06); }

// ============== ПРОВЕРКА THREE.JS ==============
window.addEventListener('load', function() {
  setTimeout(() => {
    if (typeof THREE === 'undefined') {
      document.getElementById('loading').style.display = 'none';
      const err = document.getElementById('err');
      err.style.display = 'flex';
      err.textContent = '❌ Three.js не загрузился.\n\nТы открываешь файл через file:// — Chrome/Edge блокируют загрузку из интернета.\n\nРешения:\n1. Открой через Firefox\n2. Запусти через python -m http.server 8000\n3. Загрузи на GitHub Pages\n4. Скачай three.min.js и положи рядом, заменив ссылку на "./three.min.js"';
      return;
    }
    initGame();
  }, 500);
});

let gameStarted = false;

function initGame() {
  document.getElementById('loading').style.display = 'none';

  // Кнопки меню
  document.getElementById('btnPlay').addEventListener('click', () => {
    document.getElementById('menu').style.display = 'none';
    document.getElementById('hud').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('info').style.display = 'block';
    document.getElementById('waveInfo').style.display = 'block';
    initAudio();
    if (!gameStarted) {
      gameStarted = true;
      startGame();
    }
  });

  document.getElementById('btnHelp').addEventListener('click', () => {
    alert('УПРАВЛЕНИЕ:\n\nWASD — движение\nSHIFT — бег\nSPACE — прыжок (двойной!)\nЛКМ — золотой лазер\nПКМ (держать) — зарядить мега-лазер\nE — поставить мину\nQ — использовать аптечку\n\nЦЕЛЬ:\nУничтожай роботов, выживай как можно дольше.\nКаждые 5 волн — БОСС.\nСобирай бонусы (аптечки, энергия).');
  });

  document.getElementById('btnSettings').addEventListener('click', () => {
    alert('НАСТРОЙКИ:\n\n(В разработке)\n\nСкоро:\n- Качество теней\n- Количество врагов\n- Громкость звука\n- Чувствительность мыши');
  });
}

function startGame() {
  // ============ СЦЕНА ============
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05000a);
  scene.fog = new THREE.FogExp2(0x0a0018, 0.016);

  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 500);
  const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.3;
  document.body.appendChild(renderer.domElement);

  // ============ СВЕТ ============
  scene.add(new THREE.AmbientLight(0x220044, 0.7));
  const moon = new THREE.DirectionalLight(0x6644ff, 1.4);
  moon.position.set(30, 60, 20);
  moon.castShadow = true;
  moon.shadow.mapSize.set(2048, 2048);
  moon.shadow.camera.left = -60;
  moon.shadow.camera.right = 60;
  moon.shadow.camera.top = 60;
  moon.shadow.camera.bottom = -60;
  scene.add(moon);

  const neonColors = [0xff00ff, 0x00ffff, 0xff0066, 0x00ff88, 0xffaa00, 0xff3300, 0xaa00ff];
  const cityLights = [];
  for (let i = 0; i < 15; i++) {
    const l = new THREE.PointLight(neonColors[i % neonColors.length], 4, 45);
    l.position.set((Math.random()-0.5)*95, 6 + Math.random()*15, (Math.random()-0.5)*95);
    scene.add(l);
    cityLights.push(l);
  }

  // ============ ЗЕМЛЯ ============
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(120, 120, 60, 60),
    new THREE.MeshStandardMaterial({
      color: 0x0a0014, roughness: 0.5, metalness: 0.8,
      emissive: 0x110033, emissiveIntensity: 0.5
    })
  );
  ground.rotation.x = -Math.PI/2;
  ground.receiveShadow = true;
  scene.add(ground);

  const grid = new THREE.GridHelper(120, 60, 0xff00ff, 0x00ffff);
  grid.position.y = 0.01;
  grid.material.opacity = 0.4;
  grid.material.transparent = true;
  scene.add(grid);

  // ============ ГОРОД ============
  const CITY_SIZE = 25;
  const buildMats = [
    new THREE.MeshStandardMaterial({ color:0x1a1a2e, metalness:0.8, roughness:0.3, emissive:0x220044, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x16213e, metalness:0.85, roughness:0.25, emissive:0x004466, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x0f0f1e, metalness:0.9, roughness:0.2, emissive:0x440022, emissiveIntensity:0.4 }),
    new THREE.MeshStandardMaterial({ color:0x2a1a3e, metalness:0.75, roughness:0.35, emissive:0x004444, emissiveIntensity:0.3 }),
  ];

  function createBillboard(x, y, z, rotY, color) {
    const group = new THREE.Group();
    const frame = new THREE.Mesh(
      new THREE.BoxGeometry(4.2, 2.4, 0.2),
      new THREE.MeshStandardMaterial({ color:0x000000, emissive:color, emissiveIntensity:2 })
    );
    group.add(frame);
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(3.8, 2.0),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.9 })
    );
    screen.position.z = 0.11;
    group.add(screen);
    // "японские иероглифы"
    for (let i = 0; i < 8; i++) {
      const strip = new THREE.Mesh(
        new THREE.PlaneGeometry(0.2 + Math.random()*0.35, 0.15 + Math.random()*0.5),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
      );
      strip.position.set(-1.6 + i*0.45, -0.4 + Math.random()*0.8, 0.12);
      group.add(strip);
    }
    group.position.set(x, y, z);
    group.rotation.y = rotY;
    scene.add(group);
  }

  const buildingColliders = [];
  (function generateCity() {
    const cellSize = 4.2;
    const half = (CITY_SIZE * cellSize) / 2;
    for (let ix = 0; ix < CITY_SIZE; ix++) {
      for (let iz = 0; iz < CITY_SIZE; iz++) {
        if (Math.abs(ix - CITY_SIZE/2) < 2 && Math.abs(iz - CITY_SIZE/2) < 2) continue;
        if (Math.random() < 0.3) continue;
        const x = ix * cellSize - half + cellSize/2;
        const z = iz * cellSize - half + cellSize/2;
        const w = 2.6 + Math.random()*1.3;
        const d = 2.6 + Math.random()*1.3;
        const h = 4 + Math.random() * 22;
        const mat = buildMats[Math.floor(Math.random()*buildMats.length)];
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        b.position.set(x, h/2, z);
        b.castShadow = true;
        b.receiveShadow = true;
        scene.add(b);
        buildingColliders.push({ x, z, w: w/2 + 0.5, d: d/2 + 0.5 });
        // неоновая кромка
        const edgeColor = neonColors[Math.floor(Math.random()*neonColors.length)];
        const edge = new THREE.Mesh(
          new THREE.BoxGeometry(w+0.05, 0.15, d+0.05),
          new THREE.MeshBasicMaterial({ color: edgeColor })
        );
        edge.position.set(x, h + 0.05, z);
        scene.add(edge);
        // вертикальная полоса
        if (Math.random() < 0.5) {
          const stripColor = neonColors[Math.floor(Math.random()*neonColors.length)];
          const strip = new THREE.Mesh(
            new THREE.BoxGeometry(0.1, h*0.8, 0.05),
            new THREE.MeshBasicMaterial({ color: stripColor })
          );
          strip.position.set(x + w/2 + 0.03, h/2, z);
          scene.add(strip);
        }
        // горизонтальные окна
        if (Math.random() < 0.4) {
          for (let i = 0; i < 4; i++) {
            const win = new THREE.Mesh(
              new THREE.PlaneGeometry(0.3, 0.2),
              new THREE.MeshBasicMaterial({ color: Math.random() < 0.5 ? 0x00ffff : 0xff00ff })
            );
            win.position.set(x - w/2 + 0.5 + i*0.6, 2 + i*2, z + d/2 + 0.02);
            scene.add(win);
          }
        }
        if (h > 10 && Math.random() < 0.7) {
          const col = neonColors[Math.floor(Math.random()*neonColors.length)];
          const side = Math.random() < 0.5 ? 1 : -1;
          createBillboard(x, h - 2, z + side * (d/2 + 0.15), 0, col);
        }
      }
    }
  })();

  // ============ ИГРОК ============
  const player = new THREE.Group();
  player.position.set(0, 1, 0);

  const bodyMat = new THREE.MeshStandardMaterial({ color:0x1a1a2e, metalness:0.9, roughness:0.2, emissive:0x00ffff, emissiveIntensity:0.2 });
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.0, 0.4), bodyMat);
  torso.position.y = 1.0; torso.castShadow = true;
  player.add(torso);

  const chest = new THREE.Mesh(
    new THREE.BoxGeometry(0.3, 0.3, 0.05),
    new THREE.MeshBasicMaterial({ color: 0x00ffff })
  );
  chest.position.set(0, 1.2, 0.22);
  player.add(chest);

  const head = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.5, 0.45),
    new THREE.MeshStandardMaterial({ color:0x0a0a15, metalness:1, roughness:0.1 })
  );
  head.position.y = 1.85; head.castShadow = true;
  player.add(head);

  const visor = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.1, 0.06),
    new THREE.MeshBasicMaterial({ color: 0xff00ff })
  );
  visor.position.set(0, 1.88, 0.23);
  player.add(visor);

  function createArm(side) {
    const g = new THREE.Group();
    const upper = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.7, 0.22),
      new THREE.MeshStandardMaterial({ color:0x222233, metalness:0.9, roughness:0.2 })
    );
    upper.position.y = -0.35; upper.castShadow = true;
    g.add(upper);
    const forearm = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.6, 0.25),
      new THREE.MeshStandardMaterial({ color:0x111122, metalness:1, roughness:0.15, emissive:0xffaa00, emissiveIntensity:0.3 })
    );
    forearm.position.y = -1.0; forearm.castShadow = true;
    g.add(forearm);
    const implant = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.15, 0.28),
      new THREE.MeshBasicMaterial({ color: 0xffaa00 })
    );
    implant.position.y = -0.9;
    g.add(implant);
    g.position.set(side * 0.55, 1.4, 0);
    return g;
  }
  const leftArm = createArm(-1);
  const rightArm = createArm(1);
  player.add(leftArm, rightArm);

  function createLeg(side) {
    const g = new THREE.Group();
    const thigh = new THREE.Mesh(
      new THREE.BoxGeometry(0.28, 0.7, 0.28),
      new THREE.MeshStandardMaterial({ color:0x1a1a2e, metalness:0.9, roughness:0.2 })
    );
    thigh.position.y = -0.35; thigh.castShadow = true;
    g.add(thigh);
    const shin = new THREE.Mesh(
      new THREE.BoxGeometry(0.25, 0.7, 0.25),
      new THREE.MeshStandardMaterial({ color:0x0a0a15, metalness:1, roughness:0.15, emissive:0x00ffff, emissiveIntensity:0.2 })
    );
    shin.position.y = -1.05; shin.castShadow = true;
    g.add(shin);
    g.position.set(side * 0.2, 0.7, 0);
    return g;
  }
  const leftLeg = createLeg(-1);
  const rightLeg = createLeg(1);
  player.add(leftLeg, rightLeg);
  scene.add(player);

  // ============ УПРАВЛЕНИЕ ============
  const keys = {};
  addEventListener('keydown', e => keys[e.code] = true);
  addEventListener('keyup', e => keys[e.code] = false);

  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / innerWidth) * 2 - 1;
    mouseY = (e.clientY / innerHeight) * 2 - 1;
  });

  // ============ ВРАГИ ============
  const enemies = [];
  const bossEnemies = [];
  const robotStyles = [
    { name:'Scout',     color:0xff0055, size:0.7, hp:30, speed:3.0, dmg:8,  shape:'cube' },
    { name:'Bruiser',   color:0xff4400, size:1.1, hp:70, speed:1.8, dmg:14, shape:'box'  },
    { name:'Drone',     color:0x00ffff, size:0.6, hp:20, speed:4.0, dmg:6,  shape:'sphere' },
    { name:'Sentinel',  color:0x00ff88, size:1.0, hp:50, speed:2.2, dmg:10, shape:'cylin' },
    { name:'Striker',   color:0xff00ff, size:0.9, hp:45, speed:3.2, dmg:12, shape:'tetra' },
    { name:'Warden',    color:0xaa00ff, size:1.2, hp:80, speed:1.6, dmg:16, shape:'cube' },
    { name:'Reaper',    color:0xff2200, size:1.0, hp:55, speed:2.8, dmg:15, shape:'octa' },
    { name:'Phantom',   color:0x8800ff, size:0.8, hp:35, speed:3.8, dmg:9,  shape:'sphere' },
    { name:'Titan',     color:0xffaa00, size:1.4, hp:100,speed:1.4, dmg:18, shape:'box'  },
    { name:'Spider',    color:0x00ff44, size:0.7, hp:28, speed:3.6, dmg:7,  shape:'tetra' },
    { name:'Crusher',   color:0xff0066, size:1.3, hp:90, speed:1.7, dmg:20, shape:'cube' },
    { name:'Wasp',      color:0xffee00, size:0.5, hp:18, speed:4.5, dmg:5,  shape:'sphere' },
    { name:'Golem',     color:0x884400, size:1.5, hp:120,speed:1.2, dmg:22, shape:'box'  },
    { name:'Assassin',  color:0x0000ff, size:0.85,hp:40, speed:4.2, dmg:13, shape:'tetra' },
    { name:'Enforcer',  color:0x00aaff, size:1.1, hp:65, speed:2.0, dmg:12, shape:'cylin' },
    { name:'Harbinger', color:0xff0088, size:1.25,hp:85, speed:1.9, dmg:17, shape:'octa' },
    { name:'Specter',   color:0x44ffaa, size:0.75,hp:25, speed:4.0, dmg:8,  shape:'sphere' },
    { name:'Destroyer', color:0xff3300, size:1.35,hp:95, speed:1.5, dmg:19, shape:'box'  },
    { name:'Nano',      color:0xffffff, size:0.55,hp:22, speed:4.3, dmg:6,  shape:'cube' },
    { name:'Overlord',  color:0xff00aa, size:1.6, hp:150,speed:1.0, dmg:25, shape:'box'  },
  ];

  function createEnemyMesh(style, isBoss) {
    const group = new THREE.Group();
    const scale = isBoss ? 2.5 : 1;
    const mat = new THREE.MeshStandardMaterial({
      color: style.color, metalness:0.9, roughness:0.2,
      emissive: style.color, emissiveIntensity: isBoss ? 0.8 : 0.5
    });
    let geo;
    switch (style.shape) {
      case 'sphere': geo = new THREE.SphereGeometry(style.size*0.5*scale, 12, 12); break;
      case 'cylin':  geo = new THREE.CylinderGeometry(style.size*0.4*scale, style.size*0.5*scale, style.size*scale, 12); break;
      case 'tetra':  geo = new THREE.TetrahedronGeometry(style.size*0.7*scale); break;
      case 'octa':   geo = new THREE.OctahedronGeometry(style.size*0.7*scale); break;
      case 'box':    geo = new THREE.BoxGeometry(style.size*scale, style.size*1.3*scale, style.size*0.7*scale); break;
      default:       geo = new THREE.BoxGeometry(style.size*scale, style.size*scale, style.size*scale);
    }
    const body = new THREE.Mesh(geo, mat);
    body.castShadow = true;
    group.add(body);
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(style.size*0.15*scale, 8, 8),
      new THREE.MeshBasicMaterial({ color: isBoss ? 0xffffff : 0xffffff })
    );
    eye.position.set(0, 0, style.size*0.55*scale);
    group.add(eye);
    if (style.hp > 60 || isBoss) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(style.size*0.9*scale, 0.05, 8, 24),
        new THREE.MeshBasicMaterial({ color: style.color })
      );
      ring.rotation.x = Math.PI/2;
      group.add(ring);
      group.userData.ring = ring;
    }
    group.userData.eye = eye;
    group.userData.isBoss = isBoss;
    return group;
  }

  function spawnEnemy(typeIndex, pos, isBoss) {
    const style = robotStyles[typeIndex % robotStyles.length];
    const mesh = createEnemyMesh(style, isBoss);
    mesh.position.copy(pos);
    mesh.position.y = style.size * (isBoss ? 2.5 : 1);
    scene.add(mesh);
    const e = {
      mesh, style,
      hp: style.hp * (isBoss ? 10 : 1),
      maxHp: style.hp * (isBoss ? 10 : 1),
      speed: style.speed * (isBoss ? 0.6 : 1),
      dmg: style.dmg * (isBoss ? 2 : 1),
      attackCD: 0,
      hover: Math.random() * Math.PI * 2,
      isBoss: !!isBoss
    };
    enemies.push(e);
    if (isBoss) bossEnemies.push(e);
    return e;
  }

  // ============ ЛАЗЕРЫ ============
  const lasers = [];
  const particles = [];
  const enemyProjectiles = [];

  function fireLaser(origin, direction, isMega) {
    isMega = !!isMega;
    const len = isMega ? 80 : 30;
    const thick = isMega ? 1.2 : 0.15;
    const geo = new THREE.CylinderGeometry(thick, thick, len, 8);
    geo.rotateX(Math.PI/2);
    const mat = new THREE.MeshBasicMaterial({ color: isMega ? 0xffffff : 0xffdd44, transparent:true, opacity:0.95 });
    const beam = new THREE.Mesh(geo, mat);
    beam.position.copy(origin);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), direction.clone().normalize());
    beam.quaternion.copy(q);
    beam.position.add(direction.clone().normalize().multiplyScalar(len/2));

    const glowGeo = new THREE.CylinderGeometry(thick*2.5, thick*2.5, len, 8);
    glowGeo.rotateX(Math.PI/2);
    const glowMat = new THREE.MeshBasicMaterial({ color: isMega ? 0xff88ff : 0xffaa00, transparent:true, opacity:0.35 });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    glow.position.copy(beam.position);
    glow.quaternion.copy(q);

    scene.add(beam); scene.add(glow);
    lasers.push({ beam, glow, life: isMega ? 0.35 : 0.15, maxLife: isMega ? 0.35 : 0.15 });

    // Проверка попаданий
    for (const e of enemies) {
      const toE = e.mesh.position.clone().sub(origin);
      const dist = toE.dot(direction);
      if (dist < 0 || dist > len) continue;
      const closest = origin.clone().add(direction.clone().multiplyScalar(dist));
      const perp = closest.distanceTo(e.mesh.position);
      if (perp < e.style.size * 0.8 + (isMega ? 1.5 : 0.3)) {
        damageEnemy(e, isMega ? 200 : 15);
      }
    }

    isMega ? playMegaLaser() : playLaser();
  }

  function damageEnemy(e, dmg) {
    e.hp -= dmg;
    if (e.mesh.children[0]) e.mesh.children[0].material.emissiveIntensity = 2.0;
    setTimeout(() => { if (e.mesh.children[0]) e.mesh.children[0].material.emissiveIntensity = 0.5; }, 80);
    spawnHitParticles(e.mesh.position, e.style.color);
    playHit();
    showHitmark();
    if (e.hp <= 0) killEnemy(e);
  }

  function killEnemy(e) {
    scene.remove(e.mesh);
    const idx = enemies.indexOf(e);
    if (idx >= 0) enemies.splice(idx, 1);
    const idxB = bossEnemies.indexOf(e);
    if (idxB >= 0) bossEnemies.splice(idxB, 1);
    score += (10 + e.maxHp) * (e.isBoss ? 5 : 1);
    kills++;
    updateHUD();
    addKillFeed(e.style.name + (e.isBoss ? ' [BOSS]' : ''));
    playExplosion();
    // Взрыв
    for (let i = 0; i < (e.isBoss ? 60 : 20); i++) spawnHitParticles(e.mesh.position, e.style.color);
    // Разлетающиеся части
    if (e.isBoss) {
      for (let i = 0; i < 8; i++) {
        const chunk = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.3, 0.3),
          new THREE.MeshBasicMaterial({ color: e.style.color })
        );
        chunk.position.copy(e.mesh.position);
        scene.add(chunk);
        const vel = new THREE.Vector3(
          (Math.random()-0.5)*10, Math.random()*8, (Math.random()-0.5)*10
        );
        particles.push({ mesh:chunk, vel, life:1.5 });
      }
    }
  }

  function spawnHitParticles(pos, color) {
    for (let i = 0; i < 5; i++) {
      const p = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 4, 4),
        new THREE.MeshBasicMaterial({ color, transparent:true })
      );
      p.position.copy(pos);
      const vel = new THREE.Vector3((Math.random()-0.5)*4, Math.random()*3, (Math.random()-0.5)*4);
      scene.add(p);
      particles.push({ mesh:p, vel, life:0.7 });
    }
  }

  // ============ БОНУСЫ ============
  const powerups = [];
  function spawnPowerup(pos, type) {
    const color = type === 'health' ? 0x00ff88 : 0xffaa00;
    const geo = type === 'health' 
      ? new THREE.BoxGeometry(0.5, 0.5, 0.5)
      : new THREE.OctahedronGeometry(0.4);
    const p = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color }));
    p.position.copy(pos);
    p.position.y = 1;
    scene.add(p);
    powerups.push({ mesh:p, type, hover: Math.random() * Math.PI * 2, life: 20 });
  }
  function updatePowerups(dt) {
    for (let i = powerups.length - 1; i >= 0; i--) {
      const p = powerups[i];
      p.hover += dt * 3;
      p.mesh.position.y = 1 + Math.sin(p.hover) * 0.3;
      p.mesh.rotation.y += dt * 2;
      p.life -= dt;
      const dist = player.position.distanceTo(p.mesh.position);
      if (dist < 1.5) {
        if (p.type === 'health') {
          hp = Math.min(100, hp + 30);
          flashScreen(0x00ff88, 0.15);
        } else {
          energy = Math.min(100, energy + 50);
          flashScreen(0xffaa00, 0.15);
        }
        updateHUD();
        playPickup();
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        powerups.splice(i, 1);
      }
    }
  }

  // ============ МИНЫ ============
  const mines = [];
  let mineCooldown = 0;
  function placeMine() {
    if (mineCooldown > 0) return;
    mineCooldown = 3;
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    m.position.copy(player.position);
    m.position.y = 0.3;
    scene.add(m);
    mines.push({ mesh: m, life: 15, blink: 0 });
    playSound(300, 0.1, 'square', 0.05);
  }
  function updateMines(dt) {
    for (let i = mines.length - 1; i >= 0; i--) {
      const m = mines[i];
      m.life -= dt;
      m.blink += dt;
      m.mesh.material.color.setHex(Math.sin(m.blink * 10) > 0 ? 0xff0000 : 0x880000);
      m.mesh.scale.setScalar(1 + Math.sin(m.blink * 10) * 0.1);
      for (const e of enemies) {
        const d = e.mesh.position.distanceTo(m.mesh.position);
        if (d < 3) {
          // Взрыв мины
          for (let j = 0; j < 15; j++) spawnHitParticles(m.mesh.position, 0xff8800);
          for (const e2 of enemies) {
            if (e2.mesh.position.distanceTo(m.mesh.position) < 4) {
              damageEnemy(e2, e2.isBoss ? 50 : 100);
            }
          }
          playExplosion();
          flashScreen(0xff4400, 0.2);
          scene.remove(m.mesh);
          mines.splice(i, 1);
          break;
        }
      }
      if (m.life <= 0) {
        scene.remove(m.mesh);
        mines.splice(i, 1);
      }
    }
  }

  // ============ ВРАЖЕСКИЕ СНАРЯДЫ ============
  function enemyShoot(origin, target) {
    const dir = target.clone().sub(origin).normalize();
    const proj = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff0000 })
    );
    proj.position.copy(origin);
    scene.add(proj);
    enemyProjectiles.push({ mesh: proj, dir, speed: 15, life: 3 });
  }
  function updateEnemyProjectiles(dt) {
    for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
      const p = enemyProjectiles[i];
      p.life -= dt;
      p.mesh.position.addScaledVector(p.dir, p.speed * dt);
      if (p.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0,1,0))) < 1) {
        hp -= 10;
        flashScreen(0xff0000, 0.3);
        showDamageOverlay();
        playHurt();
        updateHUD();
        if (hp <= 0) endGame();
        scene.remove(p.mesh);
        enemyProjectiles.splice(i, 1);
      } else if (p.life <= 0) {
        scene.remove(p.mesh);
        enemyProjectiles.splice(i, 1);
      }
    }
  }

  // ============ HUD ============
  let hp = 100;
  let energy = 0;
  let charging = false;
  let chargeTime = 0;
  let score = 0, kills = 0;
  let wave = 1;
  let waveTimer = 0;
  let waveState = 'preparing'; // preparing / fighting / cleared
  let gameOver = false;
  let velocityY = 0;
  let onGround = true;
  let jumpCount = 0;
  let shootCooldown = 0;

  const hpFill = document.getElementById('hpFill');
  const enFill = document.getElementById('enFill');
  const scoreEl = document.getElementById('score');
  const killsEl = document.getElementById('kills');
  const waveEl = document.getElementById('wave');
  const waveInfoEl = document.getElementById('waveInfo');
  const gameoverEl = document.getElementById('gameover');
  const damageOverlay = document.getElementById('damageOverlay');
  const killFeed = document.createElement('div');
  killFeed.className = 'killfeed';
  document.body.appendChild(killFeed);

  function updateHUD() {
    hpFill.style.width = Math.max(0, hp) + '%';
    enFill.style.width = energy + '%';
    scoreEl.textContent = 'SCORE: ' + score;
    killsEl.textContent = 'KILLS: ' + kills;
    waveEl.textContent = 'WAVE: ' + wave;
    if (waveState === 'preparing') {
      waveInfoEl.innerHTML = 'ВОЛНА ' + wave + ' ЧЕРЕЗ<br><span style="font-size:32px;">' + Math.ceil(waveTimer) + '</span>';
    } else if (waveState === 'cleared') {
      waveInfoEl.textContent = 'ВОЛНА ЗАЧИЩЕНА!';
    } else {
      waveInfoEl.textContent = 'ВРАГОВ: ' + enemies.length;
    }
  }

  function addKillFeed(name) {
    const div = document.createElement('div');
    div.textContent = '✖ ' + name;
    killFeed.appendChild(div);
    setTimeout(() => div.remove(), 3000);
  }

  function showHitmark() {
    const hm = document.createElement('div');
    hm.className = 'hitmark';
    hm.textContent = '✕';
    hm.style.left = 'calc(50% + 20px)';
    hm.style.top = 'calc(50% - 20px)';
    document.body.appendChild(hm);
    setTimeout(() => hm.remove(), 500);
  }

  function showDamageOverlay() {
    damageOverlay.style.opacity = '1';
    setTimeout(() => { damageOverlay.style.opacity = '0'; }, 200);
  }

  function endGame() {
    gameOver = true;
    document.getElementById('finalScore').textContent = 'SCORE: ' + score + ' | KILLS: ' + kills + ' | WAVE: ' + wave;
    gameoverEl.style.display = 'flex';
  }

  // ============ МЫШЬ ============
  let mouseDownL = false, mouseDownR = false;
  renderer.domElement.addEventListener('mousedown', e => {
    if (e.button === 0) mouseDownL = true;
    if (e.button === 2) mouseDownR = true;
  });
  renderer.domElement.addEventListener('mouseup', e => {
    if (e.button === 0) mouseDownL = false;
    if (e.button === 2) {
      if (charging && chargeTime > 1.2) releaseMegaLaser();
      mouseDownR = false;
      charging = false;
    }
  });
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  function releaseMegaLaser() {
    const origin = player.position.clone();
    origin.y += 1.5;
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    fireLaser(origin, camDir, true);
    player.position.add(camDir.clone().multiplyScalar(-1.5));
    flashScreen(0xff00ff, 0.35);
    energy = 0;
    chargeTime = 0;
    updateHUD();
  }

  function flashScreen(color, alpha) {
    const div = document.createElement('div');
    const r = (color>>16)&255, g = (color>>8)&255, b = color&255;
    div.style.cssText = 'position:fixed;inset:0;background:rgba('+r+','+g+','+b+','+alpha+');pointer-events:none;z-index:50;transition:opacity 0.4s;';
    document.body.appendChild(div);
    setTimeout(() => { div.style.opacity = '0'; }, 30);
    setTimeout(() => div.remove(), 500);
  }

  // ============ СПАВН ============
  let spawnTimer = 0;
  function spawnRandomEnemy() {
    const angle = Math.random() * Math.PI * 2;
    const radius = 25 + Math.random() * 20;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    spawnEnemy(Math.floor(Math.random() * robotStyles.length), new THREE.Vector3(x, 0, z));
  }

  // ============ ЦИКЛ ============
  const clock = new THREE.Clock();
  const camTarget = new THREE.Vector3();
  let yaw = 0, pitch = 0;

  function animate() {
    requestAnimationFrame(animate);
    if (gameOver) { renderer.render(scene, camera); return; }

    const dt = Math.min(clock.getDelta(), 0.05);
    const t = clock.elapsedTime;

    // Мерцание городских огней
    for (let i = 0; i < cityLights.length; i++) {
      cityLights[i].intensity = 3 + Math.sin(t * 2 + i) * 1.5;
    }

    // Движение
    const moveDir = new THREE.Vector3();
    if (keys['KeyW'] || keys['ArrowUp']) moveDir.z -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveDir.z += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveDir.x -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveDir.x += 1;

    const baseSpeed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 12 : 6;

    if (moveDir.lengthSq() > 0) {
      moveDir.normalize();
      const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      forward.y = 0; forward.normalize();
      const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
      right.y = 0; right.normalize();
      const worldMove = new THREE.Vector3()
        .addScaledVector(forward, -moveDir.z)
        .addScaledVector(right, moveDir.x)
        .normalize()
        .multiplyScalar(baseSpeed * dt);

      const newPos = player.position.clone().add(worldMove);
      let blocked = false;
      for (const c of buildingColliders) {
        if (Math.abs(newPos.x - c.x) < c.w && Math.abs(newPos.z - c.z) < c.d) { blocked = true; break; }
      }
      if (!blocked) {
        player.position.copy(newPos);
        player.rotation.y = Math.atan2(worldMove.x, worldMove.z);
      }
    }

    // Прыжок (двойной)
    if (keys['Space'] && !player.userData.jumpHeld) {
      if (onGround) {
        velocityY = 9; onGround = false; jumpCount = 1; playJump();
      } else if (jumpCount < 2) {
        velocityY = 8; jumpCount = 2; playJump();
      }
      player.userData.jumpHeld = true;
    }
    if (!keys['Space']) player.userData.jumpHeld = false;

    velocityY -= 25 * dt;
    player.position.y += velocityY * dt;
    if (player.position.y <= 1) {
      player.position.y = 1; velocityY = 0; onGround = true; jumpCount = 0;
    }

    // Мина
    if (keys['KeyE'] && !player.userData.mineHeld) {
      placeMine();
      player.userData.mineHeld = true;
    }
    if (!keys['KeyE']) player.userData.mineHeld = false;
    mineCooldown -= dt;

    // Анимация
    const walkCycle = Math.sin(t * 12) * (moveDir.lengthSq() > 0 ? 0.5 : 0);
    leftLeg.rotation.x = walkCycle;
    rightLeg.rotation.x = -walkCycle;
    leftArm.rotation.x = -walkCycle * 0.6;
    rightArm.rotation.x = -Math.PI/2 + Math.sin(t*2)*0.05;

    // Камера
    yaw = -mouseX * 1.2;
    pitch = mouseY * 0.5;
    const camDesired = new THREE.Vector3(
      player.position.x + Math.sin(yaw) * 7,
      player.position.y + 3.5 + pitch * 3,
      player.position.z + Math.cos(yaw) * 7
    );
    camera.position.lerp(camDesired, 0.12);
    camTarget.lerp(player.position.clone().add(new THREE.Vector3(0,1.5,0)), 0.2);
    camera.lookAt(camTarget);

    // Стрельба
    shootCooldown -= dt;
    if (mouseDownL && shootCooldown <= 0) {
      const origin = player.position.clone();
      origin.y += 1.5;
      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      fireLaser(origin, camDir, false);
      shootCooldown = 0.15;
      rightArm.rotation.x = -Math.PI/2 - 0.3;
    }

    // Заряд
    if (mouseDownR && !charging) { charging = true; chargeTime = 0; }
    if (charging) {
      chargeTime += dt;
      energy = Math.min(100, chargeTime * 60);
      updateHUD();
      const gi = Math.min(1, chargeTime / 1.5);
      if (leftArm.children[2]) leftArm.children[2].material.color.setRGB(1, 0.6 * gi + 0.2, 0);
      if (rightArm.children[2]) rightArm.children[2].material.color.setRGB(1, 0.6 * gi + 0.2, 0);
    } else {
      if (energy < 100) { energy = Math.min(100, energy + dt * 10); updateHUD(); }
    }

    // Враги
    for (const e of enemies) {
      const toPlayer = player.position.clone().sub(e.mesh.position);
      toPlayer.y = 0;
      const dist = toPlayer.length();
      toPlayer.normalize();
      e.hover += dt * 3;
      e.mesh.position.y = (e.isBoss ? e.style.size * 2.5 : e.style.size) + Math.sin(e.hover) * 0.15;
      if (dist > 1.5) e.mesh.position.addScaledVector(toPlayer, e.speed * dt);
      e.mesh.rotation.y = Math.atan2(toPlayer.x, toPlayer.z);
      if (e.mesh.userData.ring) e.mesh.userData.ring.rotation.z += dt * 3;
      
      // Атака
      e.attackCD -= dt;
      if (dist < 2.5 && e.attackCD <= 0) {
        hp -= e.dmg;
        e.attackCD = e.isBoss ? 0.6 : 1.0;
        updateHUD();
        flashScreen(0xff0000, 0.25);
        showDamageOverlay();
        playHurt();
        if (hp <= 0) { hp = 0; updateHUD(); endGame(); }
      }
      // Стрельба вдалеке (роботы)
      if (dist > 8 && dist < 30 && e.attackCD <= 0 && Math.random() < 0.01) {
        enemyShoot(e.mesh.position.clone(), player.position.clone().add(new THREE.Vector3(0,1,0)));
        e.attackCD = 2;
      }
      if (e.mesh.userData.eye) {
        const s = 1 + Math.sin(t * 6 + e.hover) * 0.3;
        e.mesh.userData.eye.scale.setScalar(s);
      }
    }

    // Волны
    waveTimer -= dt;
    if (waveState === 'preparing') {
      updateHUD();
      if (waveTimer <= 0) {
        waveState = 'fighting';
        const count = 3 + wave * 2;
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            if (!gameOver) spawnRandomEnemy();
          }, i * 300);
        }
        // Босс каждые 5 волн
        if (wave % 5 === 0) {
          setTimeout(() => {
            if (!gameOver) {
              const angle = Math.random() * Math.PI * 2;
              const x = Math.cos(angle) * 30;
              const z = Math.sin(angle) * 30;
              spawnEnemy(Math.floor(Math.random()*robotStyles.length), new THREE.Vector3(x, 0, z), true);
            }
          }, count * 300 + 500);
        }
      }
    } else if (waveState === 'fighting') {
      updateHUD();
      // Спавн добивки
      spawnTimer += dt;
      if (spawnTimer > 5 && enemies.length < 3 + wave) {
        spawnRandomEnemy();
        spawnTimer = 0;
      }
      // Бонусы
      if (Math.random() < 0.005 && enemies.length > 0 && powerups.length < 3) {
        const e = enemies[Math.floor(Math.random() * enemies.length)];
        spawnPowerup(e.mesh.position.clone(), Math.random() < 0.6 ? 'health' : 'energy');
      }
      if (enemies.length === 0 && waveTimer < -2) {
        waveState = 'cleared';
        waveTimer = 3;
      }
    } else if (waveState === 'cleared') {
      updateHUD();
      if (waveTimer <= 0) {
        wave++;
        waveState = 'preparing';
        waveTimer = 5;
        // Аптечка игроку
        hp = Math.min(100, hp + 20);
        updateHUD();
      }
    }

    updateMines(dt);
    updateEnemyProjectiles(dt);
    updatePowerups(dt);

    // Лазеры
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.life -= dt;
      const a = l.life / l.maxLife;
      l.beam.material.opacity = a;
      l.glow.material.opacity = a * 0.35;
      if (l.life <= 0) {
        scene.remove(l.beam); scene.remove(l.glow);
        l.beam.geometry.dispose(); l.beam.material.dispose();
        l.glow.geometry.dispose(); l.glow.material.dispose();
        lasers.splice(i, 1);
      }
    }

    // Партиклы
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.vel.y -= 12 * dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      if (p.mesh.material.opacity !== undefined) {
        p.mesh.material.opacity = p.life / 0.7;
        p.mesh.material.transparent = true;
      }
      if (p.life <= 0) {
        scene.remove(p.mesh);
        particles.splice(i, 1);
      }
    }

    renderer.render(scene, camera);
  }

  // Старт
  waveState = 'preparing';
  waveTimer = 3;
  updateHUD();
  animate();

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}
</script>
</body>
</html>
